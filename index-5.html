<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Net — Твой выбор короче</title>
<style>
  :root {
    --bg:#f5f8fa; --panel:#fff; --text:#14171a; --muted:#657786; --border:#e1e8ed;
    --accent:#1da1f2; --accent-hover:#1a91da; --accent-soft:#e8f5fe;
    --hover:#f5f8fa; --sticker-bg:#f0f4f8; --modal-bg:rgba(0,0,0,.45);
    --danger:#e0245e; --success:#10b981; --gold:#f59e0b;
  }
  [data-theme="dark"] {
    --bg:#15202b; --panel:#1c2732; --text:#e7ecf0; --muted:#8b98a5; --border:#38444d;
    --accent:#1da1f2; --accent-hover:#4ab3f4; --accent-soft:#1a3a52;
    --hover:#22303c; --sticker-bg:#22303c; --modal-bg:rgba(0,0,0,.7);
    --danger:#f43f5e; --success:#34d399; --gold:#fbbf24;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s;overflow-x:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}
  a{color:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  .app{display:flex;max-width:1280px;margin:0 auto;min-height:100vh}

  /* ---------- AUTH ---------- */
  .auth-screen{position:fixed;inset:0;z-index:500;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
  .auth-screen.show{display:flex}
  .auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:28px 24px;box-shadow:0 8px 40px rgba(0,0,0,.12)}
  .auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .auth-logo svg{width:44px;height:44px}
  .auth-logo b{font-size:26px;font-weight:800;letter-spacing:-.5px;display:block}
  .auth-logo span{font-size:13px;color:var(--muted)}
  .auth-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--hover);padding:4px;border-radius:999px}
  .auth-tabs button{flex:1;padding:9px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
  .auth-tabs button.active{background:var(--accent);color:#fff}
  .auth-title{font-size:20px;font-weight:800;margin-bottom:6px}
  .auth-sub{font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.45}
  .auth-msg{padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:14px;line-height:1.4}
  .auth-msg.err{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
  .auth-msg.ok{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
  .auth-link{color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;display:inline-block;margin-top:12px}
  .auth-link:hover{text-decoration:underline}
  .auth-card .btn-primary{width:100%;padding:12px;font-size:16px}
  .loader{padding:60px 20px;text-align:center;color:var(--muted);font-weight:600}
  .spinner{width:34px;height:34px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- SIDEBAR ---------- */
  .sidebar{width:250px;padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--border);flex-shrink:0}
  .logo{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px}
  .logo svg{width:34px;height:34px;flex-shrink:0}
  .logo-name{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .logo-slogan{font-size:11px;color:var(--muted);font-weight:500}
  .nav-item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:999px;font-size:16px;font-weight:600;transition:background .15s;width:fit-content;padding-right:22px;position:relative}
  .nav-item:hover{background:var(--hover)}
  .nav-item.active{color:var(--accent)}
  .nav-item svg{width:24px;height:24px;flex-shrink:0}
  .badge{position:absolute;top:6px;left:26px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
  .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px;position:relative}
  .theme-toggle,.profile-mini{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;font-weight:600;font-size:14px;transition:background .15s;cursor:pointer}
  .theme-toggle:hover,.profile-mini:hover{background:var(--hover)}
  .theme-toggle svg{width:22px;height:22px;flex-shrink:0}
  .user-menu{position:absolute;bottom:64px;left:6px;right:6px;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.2);overflow:hidden;display:none;z-index:60;min-width:210px}
  .user-menu.show{display:block}
  .user-menu button{display:block;width:100%;text-align:left;padding:13px 16px;font-weight:700;font-size:14px}
  .user-menu button:hover{background:var(--hover)}
  .user-menu button.red{color:var(--danger)}

  .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px;flex-shrink:0;user-select:none;background-size:cover;background-position:center;position:relative}
  .avatar.sm{width:34px;height:34px;font-size:14px}
  .verify-badge{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--panel)}
  .verify-badge svg{width:9px;height:9px;fill:#fff}

  /* ---------- MAIN ---------- */
  .main{flex:1;max-width:640px;border-right:1px solid var(--border);min-height:100vh;min-width:0}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:14px;min-height:54px}
  .topbar h1{font-size:20px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
  .back-btn:hover{background:var(--hover)}
  .back-btn svg{width:20px;height:20px}
  .slogan-badge{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:999px;white-space:nowrap}

  .search-box{padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:54px;background:var(--bg);z-index:15}
  .search-input-wrap{display:flex;align-items:center;gap:10px;background:var(--hover);border:1px solid var(--border);border-radius:999px;padding:9px 16px}
  .search-input-wrap:focus-within{border-color:var(--accent);background:var(--panel)}
  .search-input-wrap svg{width:20px;height:20px;color:var(--muted);flex-shrink:0}
  .search-input-wrap input{flex:1;border:none;outline:none;background:transparent;color:var(--text);font-size:15px;min-width:0}

  .composer{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px}
  .composer-body{flex:1;min-width:0;position:relative}
  .composer textarea{width:100%;border:none;outline:none;resize:none;background:transparent;color:var(--text);font-size:19px;line-height:1.4;min-height:48px;padding-top:8px}
  .composer textarea::placeholder{color:var(--muted)}
  .composer-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px}
  .toolbar-left{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);transition:background .15s}
  .icon-btn:hover{background:var(--accent-soft)}
  .icon-btn svg{width:22px;height:22px}
  .char-count{font-size:13px;color:var(--muted);font-weight:600;margin-left:6px}
  .char-count.over{color:var(--danger)}
  .btn-primary{background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:9px 22px;border-radius:999px;transition:background .15s,opacity .15s;white-space:nowrap}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-primary:disabled{opacity:.5;cursor:default}
  .btn-outline{border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px;transition:background .15s;white-space:nowrap}
  .btn-outline:hover{background:var(--accent-soft)}
  .btn-danger{border:1px solid var(--danger);color:var(--danger);font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px;transition:background .15s;white-space:nowrap}
  .btn-danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
  .btn-ghost{font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;transition:background .15s}
  .btn-ghost:hover{background:var(--hover)}
  .btn-gold{background:var(--gold);color:#000;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px}
  .btn-gold:hover{opacity:.9}

  .sticker-panel{display:none;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px;padding:10px;background:var(--sticker-bg);border-radius:14px}
  .sticker-panel.show{display:grid}
  .sticker-opt{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;padding:4px}
  .sticker-opt:hover{background:var(--panel);transform:scale(1.08)}
  .sticker-opt svg{width:100%;height:100%}
  .chosen-stickers{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .post-sticker{width:64px;height:64px;padding:6px;background:var(--sticker-bg);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .post-sticker svg{width:100%;height:100%}
  .post-stickers{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

  .mention-dropdown{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.18);overflow:hidden;z-index:60;min-width:230px;display:none}
  .mention-dropdown.show{display:block}
  .mention-item{display:flex;align-items:center;gap:10px;padding:10px 14px;width:100%;text-align:left;transition:background .1s}
  .mention-item:hover,.mention-item.selected{background:var(--hover)}
  .mention-item .name{font-weight:700;font-size:14px}
  .mention-item .handle{font-size:13px;color:var(--muted)}
  .community-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;margin-top:8px}
  .community-chip button{color:var(--accent);font-size:16px;line-height:1}

  .composer-img-preview{margin-top:10px;position:relative;display:inline-block}
  .composer-img-preview img{max-height:200px;max-width:100%;border-radius:14px;border:1px solid var(--border);display:block}
  .composer-img-preview button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;font-size:15px;font-weight:700;border:2px solid var(--panel);display:flex;align-items:center;justify-content:center}

  /* ---------- POSTS ---------- */
  .post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);transition:background .15s}
  .post:hover{background:var(--hover)}
  .post-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .post-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;min-width:0}
  .post-name{font-weight:700;display:flex;align-items:center;gap:3px;flex-shrink:0;cursor:pointer}
  .post-handle,.post-time{color:var(--muted);font-size:14px;flex-shrink:0}
  .post-community{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;cursor:pointer;flex-shrink:0}
  .post-community:hover{background:var(--accent);color:#fff}
  .post-text{margin-top:3px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;cursor:pointer}
  .mention,.hashtag{color:var(--accent);cursor:pointer}
  .mention{font-weight:600}
  .mention:hover,.hashtag:hover{text-decoration:underline}
  .post-image{margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--border);width:100%}
  .post-image img{width:100%;height:auto;max-height:420px;object-fit:cover;display:block}
  .post-actions{display:flex;gap:2px;margin-top:8px;margin-left:-8px;flex-wrap:wrap}
  .action-btn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;color:var(--muted);font-size:13px;font-weight:600;transition:color .15s,background .15s}
  .action-btn svg{width:18px;height:18px}
  .action-btn:hover{background:var(--accent-soft);color:var(--accent)}
  .action-btn.liked{color:var(--danger)}
  .action-btn.liked:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
  .action-btn.reposted{color:var(--success)}
  .action-btn.reposted:hover{background:color-mix(in srgb,var(--success) 12%,transparent)}
  .action-btn.del:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}

  /* ---------- RAIL ---------- */
  .rail{width:320px;padding:16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:none;flex-shrink:0}
  .rail-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
  .rail-card h2{font-size:18px;font-weight:800;margin-bottom:12px}
  .rail-user{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
  .rail-user:hover .name{text-decoration:underline}
  .rail-user-info{flex:1;min-width:0}
  .rail-user-info .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:3px}
  .rail-user-info .handle{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn-follow{font-size:13px;font-weight:700;padding:5px 14px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);transition:background .15s,color .15s;flex-shrink:0}
  .btn-follow:hover{background:var(--accent-soft)}
  .btn-follow.following{background:var(--accent);color:#fff}
  .trend-item{padding:8px 0;cursor:pointer}
  .trend-item:hover .trend-name{text-decoration:underline}
  .trend-label{font-size:13px;color:var(--muted)}
  .trend-name{font-weight:700}
  .trend-count{font-size:13px;color:var(--muted)}

  .comm-list{display:flex;flex-direction:column;gap:2px}
  .comm-card{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background .15s}
  .comm-card:hover{background:var(--hover)}
  .comm-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0;background-size:cover;background-position:center;position:relative;overflow:hidden}
  .comm-info{flex:1;min-width:0}
  .comm-info .cname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px}
  .comm-info .cmeta{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- MODAL ---------- */
  .modal-backdrop{position:fixed;inset:0;background:var(--modal-bg);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal-backdrop.show{display:flex}
  .modal{background:var(--panel);border-radius:20px;width:100%;max-width:560px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.3);animation:modalIn .22s ease}
  @keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:5}
  .modal-head h2{font-size:19px;font-weight:800}
  .modal-close{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;transition:background .15s;flex-shrink:0}
  .modal-close:hover{background:var(--hover)}
  .modal-body{padding:18px;max-height:75vh;overflow-y:auto}
  .modal-body.flush{padding:0}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
  .field input,.field textarea,.field select{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;outline:none;transition:border-color .15s}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
  .field input:disabled{opacity:.6}
  .field textarea{resize:vertical;min-height:70px}
  .field .hint{font-size:12px;color:var(--muted);margin-top:5px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}

  /* ---------- PROFILE ---------- */
  .profile-cover{height:150px;background:linear-gradient(120deg,#1da1f2,#8b5cf6,#ec4899)}
  .profile-header{padding:0 16px 8px;position:relative}
  .profile-avatar{width:96px;height:96px;border-radius:50%;border:4px solid var(--panel);margin-top:-48px;font-size:36px}
  .profile-name{font-size:22px;font-weight:800;margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .profile-handle{color:var(--muted);font-size:15px}
  .profile-bio{margin-top:10px;font-size:15px;line-height:1.45;white-space:pre-wrap}
  .profile-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:14px}
  .profile-meta a{color:var(--accent);text-decoration:none}
  .profile-stats{display:flex;gap:20px;margin-top:12px;font-size:14px;flex-wrap:wrap}
  .profile-stats b{font-weight:800;color:var(--text)}
  .profile-stats span{color:var(--muted)}
  .contact-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:border-color .15s;text-decoration:none}
  .contact-badge:hover{border-color:var(--accent)}
  .tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:54px;background:var(--bg);z-index:15}
  .tab{flex:1;padding:14px;font-weight:700;font-size:14px;color:var(--muted);text-align:center;position:relative;transition:background .15s;cursor:pointer}
  .tab:hover{background:var(--hover)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:3px;background:var(--accent);border-radius:3px}
  .empty{padding:48px 24px;text-align:center;color:var(--muted)}
  .empty svg{width:56px;height:56px;margin-bottom:12px;opacity:.5}
  .empty h3{font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px}
  .comm-banner{height:130px;display:flex;align-items:flex-end;padding:16px;position:relative;background-size:cover;background-position:center}
  .comm-banner-icon{width:80px;height:80px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;border:4px solid var(--panel);margin-bottom:-40px;background-size:cover;background-position:center}

  /* ---------- COMMENTS ---------- */
  .comment{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);transition:background .15s}
  .comment:hover{background:var(--hover)}
  .comment-main{flex:1;min-width:0}
  .comment-head{display:flex;align-items:center;gap:6px;font-size:14px;flex-wrap:wrap}
  .comment-head .name{font-weight:700;display:flex;align-items:center;gap:3px}
  .comment-head .handle,.comment-head .time{color:var(--muted);font-size:13px}
  .comment-text{margin-top:3px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .comment-actions{display:flex;gap:6px;margin-top:4px;margin-left:-8px;flex-wrap:wrap;align-items:center}
  .comment-actions .action-btn{font-size:12px;padding:4px 8px}
  .comment-actions .action-btn svg{width:15px;height:15px}
  .author-like-big{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);font-size:12px;font-weight:800}
  .comment-reply-info{font-size:12px;color:var(--muted);margin-bottom:2px}
  .comment-reply-info b{color:var(--accent)}

  /* ---------- MESSENGER ---------- */
  .messenger{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column}
  .messenger.show{display:flex}

  .msg-sidebar{width:300px;border-right:1px solid var(--border);overflow-y:auto;background:var(--panel);flex-shrink:0}
  .msg-chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .chat-item{display:flex;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;align-items:center}
  .chat-item:hover{background:var(--hover)}
  .chat-item.active{background:var(--accent-soft)}

  .chat-item-time{font-size:11px;color:var(--muted);flex-shrink:0}

  .chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}

  /* ---------- NOTIFICATIONS ---------- */

  .notif-time{font-size:12px;color:var(--muted);margin-top:2px}

  /* ---------- ADMIN ---------- */

  .admin-tab{padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;transition:background .15s;cursor:pointer}
  .admin-tab:hover{background:var(--hover)}
  .admin-tab.active{background:var(--accent);color:#fff}
  .admin-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
  .admin-item-info{flex:1;min-width:0}
  .admin-item-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px}
  .admin-item-meta{font-size:13px;color:var(--muted);margin-top:2px}
  .admin-actions{display:flex;gap:6px;flex-wrap:wrap}
  .badge-verified{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:var(--accent);border-radius:50%;flex-shrink:0}
  .badge-verified svg{width:9px;height:9px;fill:#fff}
  .badge-banned{background:var(--danger);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px}
  .category-tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px;margin-top:4px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:10px 22px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:all .3s;z-index:600;pointer-events:none;box-shadow:0 4px 20px rgba(29,161,242,.45);max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(min-width:1050px){.rail{display:block}}

async function uploadImg(file){
  const fd=new FormData();fd.append('image',file);
  const r=await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_KEY,{method:'POST',body:fd});
  const j=await r.json();
  if(!j.success)throw new Error((j.error&&j.error.message)||'Ошибка загрузки изображения');
  return j.data.display_url||j.data.url;
}

    };

async function doRegister(){
  const name=$('rName').value.trim();
  const email=$('rEmail').value.trim();
  const pass=$('rPass').value;
  const isAdm=email.toLowerCase()===ADMIN_EMAIL;
  let handle=isAdm?ADMIN_HANDLE:$('rHandle').value.trim().toLowerCase();
  if(!name)return showAuth('register','Введите имя');
  if(!/^[a-zA-Zа-яА-Я0-9_]{3,20}$/.test(handle))return showAuth('register','Логин: 3–20 символов, буквы, цифры, _');
  if(handle===ADMIN_HANDLE&&!isAdm)return showAuth('register','Этот логин зарезервирован');
  if(!email)return showAuth('register','Введите email');
  if(pass.length<6)return showAuth('register','Пароль минимум 6 символов');
  $('rGo').disabled=true;
  try{
    if(!isAdm){
      const h=await get(ref(db,'handles/'+handle));
      if(h.exists())return showAuth('register','Этот логин уже занят');
    }
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    const uid=cred.user.uid;
    const profile={name,handle,color:COLORS[Math.floor(Math.random()*COLORS.length)],bio:'',createdAt:Date.now()};
    await set(ref(db,'users/'+uid),profile);
    if(!isAdm)await set(ref(db,'handles/'+handle),uid);
    await sendEmailVerification(cred.user);
    showAuth('verify','Письмо отправлено','ok');
  }catch(e){showAuth('register',errText(e));}
}

async function ensureProfile(user){
  const uid=user.uid;
  const snap=await get(ref(db,'users/'+uid));
  const adm=user.email===ADMIN_EMAIL;
  let p=snap.val();
  if(!p){
    let handle=adm?ADMIN_HANDLE:(user.email.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g,'')||'user').slice(0,14);
    if(!adm){
      let h=handle,i=0;
      while((await get(ref(db,'handles/'+h))).exists()){i++;h=handle+i;}
      handle=h;
    }
    p={name:adm?'Глеб':handle,handle,color:COLORS[0],bio:'',createdAt:Date.now()};
    await set(ref(db,'users/'+uid),p);
  }
  if(adm){
    // суперпользователь: логин glebb + галочка
    await update(ref(db,'users/'+uid),{handle:ADMIN_HANDLE,verified:true}).catch(e=>console.warn(e));
    await set(ref(db,'handles/'+ADMIN_HANDLE),uid).catch(()=>{});
    if(!p.bio)await update(ref(db,'users/'+uid),{bio:'Создатель Shift Net. Твой выбор короче.'}).catch(()=>{});
  }else if(p.handle){
    const h=await get(ref(db,'handles/'+p.handle));
    if(!h.exists())await set(ref(db,'handles/'+p.handle),uid).catch(()=>{});
  }
  return (await get(ref(db,'users/'+uid))).val();
}

async function enter(user){
  if(S.entered===user.uid)return;
  S.entered=user.uid;
  try{
    await user.getIdToken(true);
    const p=await ensureProfile(user);
    if(p&&p.banned){flashMsg='Аккаунт заблокирован администратором';S.entered=null;await signOut(auth);return;}
    $('authScreen').classList.remove('show');
    mainEl.innerHTML=`<div class="loader"><div class="spinner"></div>Загрузка…</div>`;
    startListeners();
  }catch(e){
    S.entered=null;
    console.error(e);
    showAuth('login','Ошибка доступа к базе данных. Проверьте правила Realtime Database. '+errText(e));
  }
}

function bindComposer(){

  input.value=S.draft||'';

    const box=$('selectedStickers');box.innerHTML='';

      const d=document.createElement('div');d.className='post-sticker';d.style.cssText='width:46px;height:46px;position:relative;padding:5px';

    if(!C.preview){box.innerHTML='';return;}
    box.innerHTML=`<div class="composer-img-preview"><img src="${C.preview}"><button id="rmImg">×</button></div>`;
    $('rmImg').onclick=()=>{C.file=null;C.preview=null;renderImg();upd();};
  }
  renderSel();renderImg();upd();
  input.style.height='auto';input.style.height=Math.min(input.scrollHeight,200)+'px';

  STICKERS.forEach(s=>{
    const b=document.createElement('button');b.className='sticker-opt';b.innerHTML=s.svg;
    b.onclick=()=>{
      if(C.stickers.includes(s.id))C.stickers=C.stickers.filter(x=>x!==s.id);
      else{if(C.stickers.length>=6){toast('Максимум 6 стикеров');return;}C.stickers.push(s.id);}
      renderSel();upd();
    };
    sp.appendChild(b);
  });
  $('stickerBtn').onclick=()=>sp.classList.toggle('show');

  const pi=$('photoInput');
  $('photoBtn').onclick=()=>pi.click();
  pi.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>5*1024*1024){toast('Максимум 5 МБ');return;}
    C.file=f;
    const r=new FileReader();r.onload=ev=>{C.preview=ev.target.result;renderImg();upd();};r.readAsDataURL(f);
  };

  $('commBtn').onclick=()=>{
    const list=visibleComms();
    openModal('Выбрать сообщество',`<div class="comm-list">
      <div class="comm-card" data-comm="" style="border:1px solid var(--border);margin-bottom:6px"><div class="comm-icon" style="background:var(--muted)">—</div><div class="comm-info"><div class="cname">Без сообщества</div><div class="cmeta">Личный пост</div></div></div>
      ${list.map(c=>`<div class="comm-card" data-comm="${c.id}">${renderCommIcon(c,44)}<div class="comm-info"><div class="cname">${esc(c.name)}</div><div class="cmeta">${fmtNum(c.members)} участников</div></div></div>`).join('')}
    </div>`,()=>{
      document.querySelectorAll('#modalInner .comm-card').forEach(el=>el.onclick=()=>{C.comm=el.dataset.comm||null;closeModal();render();});
    });
  };
  const clr=$('clearComm');if(clr)clr.onclick=()=>{C.comm=null;render();};

  /* @-упоминания */
  function handleMention(){
    const pos=input.selectionStart,before=input.value.slice(0,pos);
    const m=before.match(/@([a-zA-Zа-яА-Я0-9_]*)$/);
    if(!m){closeMen();return;}
    const q=m[1].toLowerCase();
    men.active=true;men.start=pos-m[0].length;men.idx=0;
    men.matches=usersList().filter(u=>!u.banned&&((u.handle||'').toLowerCase().startsWith(q)||(u.name||'').toLowerCase().startsWith(q))).slice(0,6);
    renderMen();
  }
  function renderMen(){
    if(!men.active||!men.matches.length){md.classList.remove('show');return;}
    md.innerHTML='';
    men.matches.forEach((u,i)=>{
      const b=document.createElement('button');b.className='mention-item'+(i===men.idx?' selected':'');
      b.innerHTML=`${renderAvatar(u,'sm')}<div><div class="name">${esc(u.name)} ${verifyBadgeHTML(u.uid)}</div><div class="handle">@${esc(u.handle)}</div></div>`;
      b.onmousedown=e=>{e.preventDefault();insMen(u);};
      md.appendChild(b);
    });
    md.classList.add('show');
    md.style.left='0px';md.style.top=(input.offsetTop+input.offsetHeight+4)+'px';
  }
  function insMen(u){
    const pos=input.selectionStart,before=input.value.slice(0,men.start),after=input.value.slice(pos);
    input.value=before+'@'+u.handle+' '+after;
    const np=men.start+u.handle.length+2;input.setSelectionRange(np,np);input.focus();closeMen();upd();
  }
  function closeMen(){men.active=false;md.classList.remove('show');}
  input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,200)+'px';upd();handleMention();};
  input.onkeydown=e=>{
    const open=men.active&&md.classList.contains('show');
    if(open){
      if(e.key==='ArrowDown'){e.preventDefault();men.idx=(men.idx+1)%men.matches.length;renderMen();return;}
      if(e.key==='ArrowUp'){e.preventDefault();men.idx=(men.idx-1+men.matches.length)%men.matches.length;renderMen();return;}
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();insMen(men.matches[men.idx]);return;}
      if(e.key==='Escape'){closeMen();return;}
    }
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!pb.disabled)publish();}
  };
  $('mentionBtn').onclick=()=>{
    const pos=input.selectionStart,v=input.value;
    input.value=v.slice(0,pos)+'@'+v.slice(pos);input.setSelectionRange(pos+1,pos+1);input.focus();handleMention();upd();
  };
  pb.onclick=publish;

  async function publish(){
    const text=input.value.trim();
    if(!text&&!C.stickers.length&&!C.file)return;
    if(isBanned(S.uid)){toast('Аккаунт заблокирован');return;}
    pb.disabled=true;pb.textContent='Публикую…';
    try{
      let image=null;
      if(C.file)image=await uploadImg(C.file);
      const r=push(ref(db,'posts'));
      await set(r,clean({uid:S.uid,text,stickers:C.stickers.length?[...C.stickers]:null,image,community:C.comm,ts:Date.now()}));
      // упоминания
      const seen=new Set();
      (text.match(/@([a-zA-Zа-яА-Я0-9_]+)/g)||[]).forEach(m=>{
        const uid=byHandle(m.slice(1));
        if(uid&&!seen.has(uid)){seen.add(uid);notify(uid,'mention',{postId:r.key});}
      });
      S.draft='';C.stickers=[];C.file=null;C.preview=null;C.comm=null;
      render();toast('Пост опубликован!');
    }catch(e){
      console.error(e);toast('Ошибка: '+(e.message||'не удалось опубликовать'));
      pb.textContent='Опубликовать';upd();
    }
  }
}

/* =====================================================
   ЛЕНТА / ПОСТ
   ===================================================== */
function renderFeed(el,posts,emptyTitle,emptyText){
  if(!posts.length){
    el.innerHTML=`<div class="empty">${IC.reply}<h3>${emptyTitle||'Пока пусто'}</h3><p>${emptyText||'Опубликуйте первый пост'}</p></div>`;return;
  }
  el.innerHTML='';
  posts.forEach(p=>el.appendChild(buildPost(p)));
}
function buildPost(p){
  const el=document.createElement('div');el.className='post';
  const u=U(p.uid);
  const comm=p.community?commById(p.community):null;
  const stickers=(p.stickers||[]).map(id=>`<div class="post-sticker">${stickerSvg(id)}</div>`).join('');
  const liked=!!(p.likes&&p.likes[S.uid]),reposted=!!(p.reposts&&p.reposts[S.uid]);
  const canDel=p.uid===S.uid||isAdmin();
  el.innerHTML=`
    <div style="cursor:pointer" data-goto="${p.uid}">${renderAvatar(u)}</div>
    <div class="post-main">
      <div class="post-head">
        <span class="post-name" data-goto="${p.uid}">${esc(u.name)} ${verifyBadgeHTML(p.uid)}</span>
        <span class="post-handle">@${esc(u.handle)}</span>
        ${comm?`<span class="post-community" data-community="${comm.id}">${esc(comm.name)}</span>`:''}
        <span class="post-time">· ${ago(p.ts)}</span>
      </div>
      ${p.text?`<div class="post-text">${fmtText(p.text)}</div>`:''}
      ${p.image?`<div class="post-image"><img src="${esc(p.image)}" loading="lazy" alt=""></div>`:''}
      ${stickers?`<div class="post-stickers">${stickers}</div>`:''}
      <div class="post-actions">
        <button class="action-btn reply-btn">${IC.reply}<span>${cnt(p.comments)}</span></button>
        <button class="action-btn repost-btn ${reposted?'reposted':''}" title="${reposted?'Убрать репост':'Репост'}">${IC.repost}<span>${cnt(p.reposts)}</span></button>
        <button class="action-btn like-btn ${liked?'liked':''}">${IC.heart(liked)}<span>${cnt(p.likes)}</span></button>
        ${canDel?`<button class="action-btn del" title="Удалить">${IC.trash}</button>`:''}
      </div>
    </div>`;
  el.querySelector('.like-btn').onclick=e=>{e.stopPropagation();toggleLike(p);};
  el.querySelector('.repost-btn').onclick=e=>{e.stopPropagation();toggleRepost(p);};
  el.querySelector('.reply-btn').onclick=e=>{e.stopPropagation();openComments(p.id);};
  const d=el.querySelector('.del');
  if(d)d.onclick=async e=>{e.stopPropagation();if(confirm('Удалить пост?')){await remove(ref(db,'posts/'+p.id)).catch(er=>toast('Ошибка: '+er.message));toast('Пост удалён');}};
  const pc=el.querySelector('.post-community');if(pc)pc.onclick=e=>{e.stopPropagation();navigate('community',pc.dataset.community);};
  const pt=el.querySelector('.post-text');if(pt)pt.onclick=()=>openComments(p.id);
  return el;
}
async function toggleLike(p){
  const r=ref(db,`posts/${p.id}/likes/${S.uid}`);
  try{
    if(p.likes&&p.likes[S.uid])await remove(r);
    else{await set(r,true);notify(p.uid,'like',{postId:p.id,key:`like_${p.id}_${S.uid}`});}
  }catch(e){toast('Ошибка: '+e.message);}
}
async function toggleRepost(p){
  const r=ref(db,`posts/${p.id}/reposts/${S.uid}`);
  try{
    if(p.reposts&&p.reposts[S.uid]){await remove(r);toast('Репост убран');}
    else{await set(r,true);notify(p.uid,'repost',{postId:p.id,key:`repost_${p.id}_${S.uid}`});toast('Репост!');}
  }catch(e){toast('Ошибка: '+e.message);}
}

   КОММЕНТАРИИ

let commState={replyTo:null,stickers:[]};
function openComments(postId){
  const post=S.posts[postId];if(!post)return;
  S.openPost=postId;commState={replyTo:null,stickers:[]};
  const pu=U(post.uid);
  openModal('Комментарии',`
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);background:var(--bg)">
      <div style="display:flex;gap:10px;align-items:flex-start">
        ${renderAvatar(pu,'sm',36)}
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">${esc(pu.name)} ${verifyBadgeHTML(post.uid)} <span style="color:var(--muted);font-weight:400">@${esc(pu.handle)}</span></div>
          <div style="font-size:14px;margin-top:3px;white-space:pre-wrap">${fmtText(post.text||'')}</div>
        </div>
      </div>
    </div>
    <div id="commentsList"></div>
    <div style="padding:12px 16px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--panel)">
      <div id="replyToBanner" style="display:none;font-size:13px;color:var(--muted);margin-bottom:8px;align-items:center;gap:6px"></div>
      <div id="commChosen" class="chosen-stickers" style="margin:0 0 8px 46px"></div>
      <div style="display:flex;gap:10px;align-items:flex-start">
        ${renderAvatar(U(S.uid),'sm',36)}
        <div style="flex:1;min-width:0">
          <textarea id="commentInput" placeholder="Написать комментарий..." maxlength="280" style="width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--text);font-size:14px;resize:vertical;min-height:44px;outline:none"></textarea>
          <div class="sticker-panel" id="commStickerPanel"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
            <div style="display:flex;gap:2px">
              <button class="icon-btn" id="commStickerBtn" style="width:32px;height:32px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/></svg></button>
              <button class="icon-btn" id="commMentionBtn" style="width:32px;height:32px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 006 0v-1a10 10 0 10-3.9 8"/></svg></button>
            </div>
            <button class="btn-primary" id="sendCommentBtn" style="padding:6px 16px;font-size:14px" disabled>Отправить</button>
          </div>
        </div>
      </div>
    </div>`,()=>{
    const input=$('commentInput'),send=$('sendCommentBtn'),panel=$('commStickerPanel'),list=$('commentsList');
    updateCommentsList();
    const upd=()=>{send.disabled=!input.value.trim()&&!commState.stickers.length;};
    const renderChosen=()=>{
      $('commChosen').innerHTML=commState.stickers.map((id,i)=>`<div class="post-sticker" data-i="${i}" style="width:38px;height:38px;padding:4px;cursor:pointer" title="Убрать">${stickerSvg(id)}</div>`).join('');
      $('commChosen').querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>{commState.stickers.splice(+d.dataset.i,1);renderChosen();upd();});
    };
    STICKERS.forEach(s=>{const b=document.createElement('button');b.className='sticker-opt';b.innerHTML=s.svg;
      b.onclick=()=>{if(commState.stickers.length>=3){toast('Максимум 3');return;}commState.stickers.push(s.id);renderChosen();upd();};panel.appendChild(b);});
    $('commStickerBtn').onclick=()=>panel.classList.toggle('show');
    $('commMentionBtn').onclick=()=>{const p=input.selectionStart,v=input.value;input.value=v.slice(0,p)+'@'+v.slice(p);input.setSelectionRange(p+1,p+1);input.focus();};
    input.oninput=upd;
    input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!send.disabled)doSend();}};
    send.onclick=doSend;

    list.onclick=async e=>{
      const b=e.target.closest('[data-act]');if(!b)return;
      e.stopPropagation();
      const cid=b.dataset.cid,act=b.dataset.act;
      const p=S.posts[postId];if(!p)return;const c=(p.comments||{})[cid];if(!c)return;
      try{
        if(act==='reply'){
          const h=U(c.uid).handle;commState.replyTo={uid:c.uid,handle:h,cid};
          const bn=$('replyToBanner');bn.style.display='flex';
          bn.innerHTML=`↳ Ответ на <b style="color:var(--accent)">@${esc(h)}</b> <button id="cancelReply" style="color:var(--danger);margin-left:auto;font-size:18px">×</button>`;
          $('cancelReply').onclick=()=>{commState.replyTo=null;bn.style.display='none';};
          input.focus();
        }else if(act==='like'){
          const r=ref(db,`posts/${postId}/comments/${cid}/likes/${S.uid}`);
          if(c.likes&&c.likes[S.uid])await remove(r);else await set(r,true);
        }else if(act==='authorlike'){
          await set(ref(db,`posts/${postId}/comments/${cid}/authorLiked`),true);
          notify(c.uid,'like',{postId,text:'поставил(а) «лайк от автора» вашему комментарию'});
          toast('👑 Лайк от автора отправлен!');
        }else if(act==='del'){
          if(confirm('Удалить комментарий?')){await remove(ref(db,`posts/${postId}/comments/${cid}`));toast('Комментарий удалён');}
        }
      }catch(er){toast('Ошибка: '+er.message);}
    };

    async function doSend(){
      const text=input.value.trim();
      if(!text&&!commState.stickers.length)return;
      if(isBanned(S.uid)){toast('Аккаунт заблокирован');return;}
      send.disabled=true;
      const rt=commState.replyTo;
      try{
        await set(push(ref(db,`posts/${postId}/comments`)),clean({uid:S.uid,text,stickers:commState.stickers.length?[...commState.stickers]:null,replyTo:rt?rt.handle:null,ts:Date.now()}));
        notify(post.uid,'comment',{postId});
        if(rt&&rt.uid!==post.uid)notify(rt.uid,'reply',{postId});
        (text.match(/@([a-zA-Zа-яА-Я0-9_]+)/g)||[]).forEach(m=>{const u=byHandle(m.slice(1));if(u&&u!==post.uid&&(!rt||u!==rt.uid))notify(u,'mention',{postId});});
        input.value='';commState={replyTo:null,stickers:[]};$('replyToBanner').style.display='none';renderChosen();
      }catch(er){toast('Ошибка: '+er.message);}
      upd();
    }
  },true);
}
function updateCommentsList(){
  const list=$('commentsList');if(!list)return;
  const post=S.posts[S.openPost];
  if(!post){closeModal();return;}
  const comments=Object.entries(post.comments||{}).map(([id,c])=>({id,...c})).sort((a,b)=>(a.ts||0)-(b.ts||0));
  if(!comments.length){list.innerHTML=`<div class="empty" style="padding:32px 16px"><h3>Комментариев пока нет</h3><p>Будьте первым!</p></div>`;return;}
  const canAL=post.uid===S.uid||isAdmin();
  list.innerHTML=comments.map(c=>{
    const u=U(c.uid);const liked=!!(c.likes&&c.likes[S.uid]);
    const st=(c.stickers||[]).map(id=>`<div class="post-sticker" style="width:48px;height:48px;padding:4px">${stickerSvg(id)}</div>`).join('');
    return `<div class="comment">
      <div style="cursor:pointer" data-goto="${c.uid}">${renderAvatar(u,'',36)}</div>
      <div class="comment-main">
        <div class="comment-head"><span class="name">${esc(u.name)} ${verifyBadgeHTML(c.uid)}</span><span class="handle">@${esc(u.handle)}</span><span class="time">· ${ago(c.ts)}</span></div>
        ${c.replyTo?`<div class="comment-reply-info">↳ ответ на <b>@${esc(c.replyTo)}</b></div>`:''}
        ${c.text?`<div class="comment-text">${fmtText(c.text)}</div>`:''}
        ${st?`<div class="post-stickers">${st}</div>`:''}
        ${c.authorLiked?`<div class="author-like-big">👑 Лайк от автора</div>`:''}
        <div class="comment-actions">
          <button class="action-btn" data-act="reply" data-cid="${c.id}">${IC.reply}<span>Ответить</span></button>
          <button class="action-btn ${liked?'liked':''}" data-act="like" data-cid="${c.id}">${IC.heart(liked)}<span>${cnt(c.likes)}</span></button>
          ${canAL&&!c.authorLiked?`<button class="action-btn" data-act="authorlike" data-cid="${c.id}" style="color:var(--gold)">👑 Лайк от автора</button>`:''}
          ${(c.uid===S.uid||isAdmin())?`<button class="action-btn del" data-act="del" data-cid="${c.id}">Удалить</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

   ПОИСК

function renderSearch(){
  mainEl.innerHTML=`${topbar('Поиск')}
    <div class="search-box"><div class="search-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Люди, посты, сообщества, #хэштеги" value="${esc(S.searchQuery)}">
    </div></div><div id="searchResults"></div>`;
  const inp=$('searchInput');inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);
  inp.oninput=()=>{S.searchQuery=inp.value;doSearch();};
  searchFn=doSearch;doSearch();
  function doSearch(){
    const q=S.searchQuery.trim().toLowerCase();const res=$('searchResults');if(!res)return;
    if(!q){res.innerHTML=`<div class="empty"><h3>Начните поиск</h3><p>Люди, посты, сообщества и #хэштеги</p></div>`;return;}
    const qq=q.replace(/^#/,'');
    const people=usersList().filter(u=>!u.banned&&((u.name||'').toLowerCase().includes(qq)||(u.handle||'').toLowerCase().includes(qq)));
    const comms=visibleComms().filter(c=>(c.name||'').toLowerCase().includes(qq)||(c.desc||'').toLowerCase().includes(qq));
    const posts=postsList().filter(p=>(p.text||'').toLowerCase().includes(qq));
    let html='';
    if(people.length){
      html+=`<div style="padding:14px 16px 6px;font-weight:800;font-size:17px">Люди</div>`;
      people.forEach(u=>{
        const f=isFollowing(u.uid);
        html+=`<div class="rail-user" style="padding:10px 16px" data-goto="${u.uid}">${renderAvatar(u)}
          <div class="rail-user-info"><div class="name">${esc(u.name)} ${verifyBadgeHTML(u.uid)}</div><div class="handle">@${esc(u.handle)}</div><div style="font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.bio||'')}</div></div>
          ${u.uid!==S.uid?`<button class="btn-follow ${f?'following':''}" data-follow="${u.uid}">${f?'Читаю':'Читать'}</button>`:''}</div>`;
      });
    }
    if(comms.length){html+=`<div style="padding:14px 16px 6px;font-weight:800;font-size:17px">Сообщества</div>`;comms.forEach(c=>html+=communityCardHTML(c));}
    if(posts.length)html+=`<div style="padding:14px 16px 6px;font-weight:800;font-size:17px">Посты</div>`;
    if(!people.length&&!comms.length&&!posts.length)html=`<div class="empty"><h3>Ничего не найдено</h3><p>Попробуйте другой запрос</p></div>`;
    res.innerHTML=html;
    if(posts.length){const w=document.createElement('div');renderFeed(w,posts);res.appendChild(w);}
    res.querySelectorAll('[data-community]').forEach(el=>el.onclick=()=>navigate('community',el.dataset.community));
    res.querySelectorAll('[data-follow]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFollow(b.dataset.follow);});
  }
}
function communityCardHTML(c,extra){
  return `<div class="comm-card" data-community="${c.id}" style="padding:10px 16px">
    ${renderCommIcon(c,44)}
    <div class="comm-info">
      <div class="cname">${esc(c.name)} ${c.verified?`<span class="badge-verified">${CHECK_SVG}</span>`:''}</div>
      <div class="cmeta">${fmtNum(c.members)} участников · ${esc(c.desc||'')}</div>
      ${(c.categories||[]).length?`<div>${c.categories.map(x=>`<span class="category-tag">${esc(x)}</span>`).join('')}</div>`:''}
    </div>${extra||''}</div>`;
}
async function toggleFollow(uid){
  if(uid===S.uid)return;
  const r=ref(db,`follows/${S.uid}/${uid}`);
  try{

const NTEXT={like:'оценил(а) ваш пост',repost:'сделал(а) репост вашего поста',comment:'прокомментировал(а) ваш пост',reply:'ответил(а) на ваш комментарий',mention:'упомянул(а) вас',follow:'подписался(лась) на вас',verify:'выдал(а) вам галочку верификации',unverify:'снял(а) с вас галочку верификации',admin:''};
function renderNotifications(){
  const list=Object.entries(S.notifs).map(([id,n])=>({id,...n})).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const unread=list.filter(n=>!n.read).length;
  mainEl.innerHTML=`${topbar('Уведомления',false,unread?`<button class="btn-ghost" id="markAll" style="font-size:13px">Прочитать все</button>`:'')}<div id="notifList"></div>`;
  const box=$('notifList');
  if(!list.length){box.innerHTML=`<div class="empty"><h3>Пока тихо</h3><p>Здесь появятся лайки, упоминания и ответы</p></div>`;return;}
  list.forEach(n=>{
    const from=U(n.from);
    const el=document.createElement('div');el.className='notif-item'+(n.read?'':' unread');
    const cls=['like','repost','verify','admin'].includes(n.type)?n.type:'mention';
    const ico=n.type==='like'?IC.heart(true):n.type==='repost'?IC.repost:n.type==='verify'||n.type==='unverify'?CHECK_SVG:IC.reply;
    el.innerHTML=`<div class="notif-icon-wrap">${renderAvatar(from,'',40)}<div class="notif-type-icon ${cls}">${ico}</div></div>
      <div class="notif-body"><div class="notif-text"><b>${esc(from.name)}</b> ${verifyBadgeHTML(n.from)} ${esc(n.text||NTEXT[n.type]||'')}</div><div class="notif-time">${ago(n.ts)}</div></div>`;
    el.onclick=()=>{
      set(ref(db,`notifs/${S.uid}/${n.id}/read`),true).catch(()=>{});
      if(n.postId&&S.posts[n.postId])openComments(n.postId);
      else if(n.type==='follow')navigate('profile',n.from);
      else if(n.postId)toast('Пост недоступен');
    };
    box.appendChild(el);
  });
  const m=$('markAll');
  if(m)m.onclick=()=>{const up={};list.forEach(n=>{if(!n.read)up[`notifs/${S.uid}/${n.id}/read`]=true;});update(ref(db),up).catch(e=>toast(e.message));};
}

      if(!/^[a-zA-Zа-яА-Я0-9_]{3,20}$/.test(handle)){toast('Логин: 3–20 символов, буквы, цифры, _');return;}
      if(handle===ADMIN_HANDLE&&!adm){toast('Этот логин зарезервирован');return;}
      const btn=$('epSave');btn.disabled=true;btn.textContent='Сохраняю…';
      try{
        if(handle!==cu.handle){
          const h=await get(ref(db,'handles/'+handle));
          if(h.exists()&&h.val()!==S.uid){toast('Этот логин уже занят');btn.disabled=false;btn.textContent='Сохранить';return;}
          await set(ref(db,'handles/'+handle),S.uid);
          await remove(ref(db,'handles/'+cu.handle)).catch(()=>{});
        }
        let avUrl=avatar;if(file)avUrl=await uploadImg(file);
        await update(ref(db,'users/'+S.uid),{name,handle,color,avatar:avUrl||null,bio:$('epBio').value.trim()||null,location:$('epLoc').value.trim()||null,website:$('epWeb').value.trim()||null});
        closeModal();toast('Профиль обновлён!');
      }catch(e){toast('Ошибка: '+(e.message||e));btn.disabled=false;btn.textContent='Сохранить';}
    };
  });
}

/* =====================================================
   МЕССЕНДЖЕР
   ===================================================== */
const chatId=o=>[S.uid,o].sort().join('_');
function openMessenger(){
  $('messenger').classList.add('show');
  setActiveChat(null);
}
function openChat(uid){$('messenger').classList.add('show');setActiveChat(uid);}
function closeMessenger(){$('messenger').classList.remove('show');if(chatUnsub){chatUnsub();chatUnsub=null;}S.activeChat=null;}
$('msgClose').onclick=closeMessenger;

function setActiveChat(o){
  if(chatUnsub){chatUnsub();chatUnsub=null;}
  S.activeChat=o;S.chatMsgs={};
  $('msgBody').classList.toggle('chat-open',!!o);
  renderChatList();renderChatPane();
  if(o){
    chatUnsub=onValue(ref(db,'chats/'+chatId(o)),s=>{S.chatMsgs=s.val()||{};renderChatMessages();},err=>toast('Нет доступа к чату'));
    if(S.inbox[o]&&S.inbox[o].unread)update(ref(db,`userChats/${S.uid}/${o}`),{unread:false}).catch(()=>{});
  }
}
function renderChatList(){
  const sb=$('msgSidebar');
  let items=Object.entries(S.inbox).map(([uid,i])=>({uid,...i}));
  if(S.activeChat&&!items.find(i=>i.uid===S.activeChat))items.push({uid:S.activeChat,last:'',ts:Date.now()});
  items=items.filter(i=>S.users[i.uid]).sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(!items.length){sb.innerHTML=`<div class="empty" style="padding:32px 16px"><h3>Нет чатов</h3><p>Откройте профиль человека и нажмите «Сообщение»</p></div>`;return;}
  sb.innerHTML='';
  items.forEach(i=>{
    const u=U(i.uid);const el=document.createElement('div');
    el.className='chat-item'+(S.activeChat===i.uid?' active':'');
    el.innerHTML=`${renderAvatar(u,'',40)}<div class="chat-item-info"><div class="name">${esc(u.name)} ${verifyBadgeHTML(i.uid)}</div><div class="preview">${esc(i.last||'Нет сообщений')}</div></div>
      ${i.unread&&S.activeChat!==i.uid?'<span class="unread-dot"></span>':`<div class="chat-item-time">${i.last?ago(i.ts):''}</div>`}`;
    el.onclick=()=>setActiveChat(i.uid);
    sb.appendChild(el);
  });
}
function renderChatPane(){
  const chat=$('msgChat');const o=S.activeChat;
  if(!o){chat.innerHTML=`<div class="msg-empty">${IC.reply}<h3 style="color:var(--text)">Выберите чат</h3><p>Или начните переписку с профиля пользователя</p></div>`;return;}
  const u=U(o);
  chat.innerHTML=`
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--panel)">
      <button class="back-btn" id="chatBack" style="display:${window.innerWidth<=600?'flex':'none'}">${IC.back}</button>
      ${renderAvatar(u,'sm',36)}
      <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px;cursor:pointer" id="chatName">${esc(u.name)} ${verifyBadgeHTML(o)}</div><div style="font-size:12px;color:var(--muted)">@${esc(u.handle)}</div></div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area"><input id="chatInput" placeholder="Написать сообщение..." maxlength="1000"><button class="btn-primary" id="chatSend" style="padding:9px 20px">➤</button></div>`;
  $('chatBack').onclick=()=>setActiveChat(null);
  $('chatName').onclick=()=>{closeMessenger();navigate('profile',o);};
  const ci=$('chatInput');
  const send=async()=>{
    const t=ci.value.trim();if(!t)return;
    if(isBanned(S.uid)){toast('Аккаунт заблокирован');return;}
    ci.value='';
    const ts=Date.now();
    try{
      await set(push(ref(db,'chats/'+chatId(o))),{from:S.uid,text:t,ts});
      await update(ref(db),{[`userChats/${S.uid}/${o}`]:{last:t.slice(0,80),ts,unread:false},[`userChats/${o}/${S.uid}`]:{last:t.slice(0,80),ts,unread:true}});
    }catch(e){toast('Не отправлено: '+e.message);ci.value=t;}
  };
  $('chatSend').onclick=send;ci.onkeydown=e=>{if(e.key==='Enter')send();};
  ci.focus();
  renderChatMessages();
}
function renderChatMessages(){
  const box=$('chatMessages');if(!box)return;
  const msgs=Object.values(S.chatMsgs).sort((a,b)=>a.ts-b.ts);
  box.innerHTML='';
  msgs.forEach(m=>{
    const b=document.createElement('div');b.className='bubble '+(m.from===S.uid?'me':'them');
    b.innerHTML=`${esc(m.text)}<small>${clock(m.ts)}</small>`;box.appendChild(b);
  });
  box.scrollTop=box.scrollHeight;
  if(S.activeChat&&S.inbox[S.activeChat]&&S.inbox[S.activeChat].unread)update(ref(db,`userChats/${S.uid}/${S.activeChat}`),{unread:false}).catch(()=>{});
}

/* =====================================================
   АДМИН-ПАНЕЛЬ
   ===================================================== */
function renderAdmin(){
  if(!isAdmin()){mainEl.innerHTML=topbar('Админ')+`<div class="empty"><h3>Доступ запрещён</h3><p>Раздел только для @${ADMIN_HANDLE}</p></div>`;return;}
  mainEl.innerHTML=`${topbar('Админ-панель',false,`<span style="font-size:12px;background:var(--gold);color:#000;padding:4px 10px;border-radius:999px;font-weight:800">SUPERUSER</span>`)}
    <div class="admin-tabs">${[['users','Пользователи'],['communities','Сообщества'],['categories','Категории']].map(([k,l])=>`<button class="admin-tab ${S.adminTab===k?'active':''}" data-atab="${k}">${l}</button>`).join('')}</div>
    <div id="adminContent"></div>`;
  mainEl.querySelectorAll('[data-atab]').forEach(t=>t.onclick=()=>{S.adminTab=t.dataset.atab;renderAdmin();});
  const cont=$('adminContent');
  const cats=Object.entries(S.cats).map(([id,name])=>({id,name}));

  if(S.adminTab==='users'){
    cont.innerHTML=usersList().filter(u=>u.uid!==S.uid).map(u=>`<div class="admin-item">${renderAvatar(u,'',44)}
      <div class="admin-item-info"><div class="admin-item-name">${esc(u.name)} ${verifyBadgeHTML(u.uid)} ${u.banned?'<span class="badge-banned">ЗАБАНЕН</span>':''}</div><div class="admin-item-meta">@${esc(u.handle)}</div></div>
      <div class="admin-actions"><button class="btn-gold" data-act="verify" data-u="${u.uid}" style="font-size:12px;padding:6px 12px">${u.verified?'Снять ✓':'Выдать ✓'}</button>
      <button class="btn-danger" data-act="ban" data-u="${u.uid}" style="font-size:12px;padding:6px 12px">${u.banned?'Разбанить':'Забанить'}</button></div></div>`).join('')||`<div class="empty"><h3>Других пользователей пока нет</h3></div>`;
    cont.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
      const uid=b.dataset.u,u=S.users[uid];if(!u)return;
      if(b.dataset.act==='verify')setVerified(uid,!u.verified);
      else{try{if(u.banned)await remove(ref(db,`users/${uid}/banned`));else await set(ref(db,`users/${uid}/banned`),true);toast(u.banned?'Разбанен':'Забанен');}catch(e){toast('Ошибка: '+e.message);}}
    });
  }else if(S.adminTab==='communities'){
    const list=commsList();
    cont.innerHTML=list.map(c=>`<div class="admin-item">${renderCommIcon(c,44)}
      <div class="admin-item-info"><div class="admin-item-name">${esc(c.name)} ${c.verified?`<span class="badge-verified">${CHECK_SVG}</span>`:''} ${c.banned?'<span class="badge-banned">СКРЫТО</span>':''}</div>
      <div class="admin-item-meta">${fmtNum(c.members)} участников · владелец ${c.owner&&S.users[c.owner]?'@'+esc(U(c.owner).handle):'—'}</div>
      ${(c.categories||[]).length?`<div>${c.categories.map(x=>`<span class="category-tag">${esc(x)}</span>`).join('')}</div>`:''}</div>
      <div class="admin-actions"><button class="btn-gold" data-act="verify" data-id="${c.id}" style="font-size:12px;padding:6px 12px">${c.verified?'Снять ✓':'Выдать ✓'}</button>
      <button class="btn-outline" data-act="cats" data-id="${c.id}" style="font-size:12px;padding:6px 12px">Категории</button>
      <button class="btn-outline" data-act="edit" data-id="${c.id}" style="font-size:12px;padding:6px 12px">Правка</button>
      <button class="btn-danger" data-act="ban" data-id="${c.id}" style="font-size:12px;padding:6px 12px">${c.banned?'Восстановить':'Скрыть'}</button></div></div>`).join('')||`<div class="empty"><h3>Сообществ пока нет</h3></div>`;
    cont.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
      const c=commById(b.dataset.id);if(!c)return;
      try{
        if(b.dataset.act==='verify'){if(c.verified)await remove(ref(db,`communities/${c.id}/admin/verified`));else await set(ref(db,`communities/${c.id}/admin/verified`),true);}
        else if(b.dataset.act==='ban'){if(c.banned)await remove(ref(db,`communities/${c.id}/admin/banned`));else await set(ref(db,`communities/${c.id}/admin/banned`),true);}
        else if(b.dataset.act==='edit')openEditCommunity(c);
        else if(b.dataset.act==='cats')openCommCategories(c);
      }catch(e){toast('Ошибка: '+e.message);}
    });
  }else{
    cont.innerHTML=`<div style="padding:16px">
      <div class="field"><label>Добавить категорию в общий пул</label><div style="display:flex;gap:8px"><input id="newCat" placeholder="Например, Лучший дизайн 2026" style="flex:1"><button class="btn-primary" id="addCat" style="padding:9px 18px">Добавить</button></div></div>
      <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px">${cats.map(c=>`<div class="category-tag" style="font-size:13px;padding:6px 12px">${esc(c.name)} <button data-rm="${c.id}" style="color:var(--danger);margin-left:6px;font-size:14px">×</button></div>`).join('')||'<span style="color:var(--muted)">Категорий пока нет</span>'}</div>
      <div style="margin-top:24px;font-size:13px;color:var(--muted)">Категории назначаются сообществам кнопкой «Категории» и отображаются на странице сообщества и в поиске.</div></div>`;
    $('addCat').onclick=async()=>{
      const v=$('newCat').value.trim();if(!v)return;
      if(cats.some(c=>c.name===v)){toast('Уже есть');return;}
      try{await set(push(ref(db,'categories')),v);toast('Категория добавлена');}catch(e){toast('Ошибка: '+e.message);}
    };
    cont.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>remove(ref(db,'categories/'+b.dataset.rm)).catch(e=>toast(e.message)));
  }
}
function openCommCategories(c){
  const cats=Object.values(S.cats);
  openModal('Категории: '+c.name,`
    <div id="catChecks" style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
      ${cats.map(cat=>`<label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer"><input type="checkbox" value="${esc(cat)}" ${(c.categories||[]).includes(cat)?'checked':''}> ${esc(cat)}</label>`).join('')||'<span style="color:var(--muted)">Сначала добавьте категории во вкладке «Категории»</span>'}
    </div>
    <div class="modal-actions"><button class="btn-ghost" id="ccCancel">Отмена</button><button class="btn-primary" id="ccSave">Применить</button></div>`,()=>{
    $('ccCancel').onclick=closeModal;
    $('ccSave').onclick=async()=>{
      const v=[...document.querySelectorAll('#catChecks input:checked')].map(i=>i.value);
      try{await set(ref(db,`communities/${c.id}/admin/categories`),v.length?v:null);closeModal();toast('Категории обновлены');}catch(e){toast('Ошибка: '+e.message);}
    };
  });
}

/* =====================================================
   RAIL
   ===================================================== */
function renderRail(){
  if(S.page==='search'){railEl.innerHTML='';return;}
  const people=usersList().filter(u=>!isFollowing(u.uid)&&!u.banned&&u.uid!==S.uid).slice(0,3);
  const comms=visibleComms().slice(0,4);
  const tags={};
  Object.values(S.posts).forEach(p=>(String(p.text||'').match(/#([a-zA-Zа-яА-Я0-9_]+)/g)||[]).forEach(t=>{tags[t]=(tags[t]||0)+1;}));
  const trends=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,4);
  railEl.innerHTML=`
    ${people.length?`<div class="rail-card"><h2>Кого читать</h2>${people.map(u=>`<div class="rail-user" data-goto="${u.uid}">${renderAvatar(u,'sm')}
      <div class="rail-user-info"><div class="name">${esc(u.name)} ${verifyBadgeHTML(u.uid)}</div><div class="handle">@${esc(u.handle)}</div></div>
      <button class="btn-follow" data-follow="${u.uid}">Читать</button></div>`).join('')}</div>`:''}
    <div class="rail-card"><h2>Сообщества</h2><div class="comm-list">
      ${comms.map(c=>`<div class="comm-card" data-community="${c.id}" style="padding:8px">${renderCommIcon(c,38)}<div class="comm-info"><div class="cname" style="font-size:14px">${esc(c.name)} ${c.verified?`<span class="badge-verified">${CHECK_SVG}</span>`:''}</div><div class="cmeta">${fmtNum(c.members)}</div></div></div>`).join('')||'<div style="color:var(--muted);font-size:14px">Пока нет</div>'}
    </div><button class="btn-outline" id="railNewComm" style="width:100%;margin-top:10px">+ Создать сообщество</button></div>
    ${trends.length?`<div class="rail-card"><h2>Тренды</h2>${trends.map(([t,n])=>`<div class="trend-item" data-tag="${esc(t)}"><div class="trend-label">Тренд</div><div class="trend-name">${esc(t)}</div><div class="trend-count">${n} ${n===1?'пост':'п.'}</div></div>`).join('')}</div>`:''}`;
  railEl.querySelectorAll('[data-follow]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFollow(b.dataset.follow);});
  railEl.querySelectorAll('[data-community]').forEach(el=>el.onclick=()=>navigate('community',el.dataset.community));
  railEl.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{S.searchQuery=el.dataset.tag;navigate('search');});
  const rn=$('railNewComm');if(rn)rn.onclick=openCreateCommunity;
}

/* =====================================================
   МОДАЛКА
   ===================================================== */
const backdrop=$('modalBackdrop'),modalInner=$('modalInner');
function openModal(title,body,onMount,flush){
  modalInner.innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2><button class="modal-close" id="modalCloseBtn">×</button></div><div class="modal-body ${flush?'flush':''}">${body}</div>`;
  backdrop.classList.add('show');
  $('modalCloseBtn').onclick=closeModal;
  if(onMount)setTimeout(onMount,0);
}
function closeModal(){backdrop.classList.remove('show');modalInner.innerHTML='';S.openPost=null;}
backdrop.onclick=e=>{if(e.target===backdrop)closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(backdrop.classList.contains('show'))closeModal();else if($('messenger').classList.contains('show'))closeMessenger();}});

/* старт: ждём onAuthStateChanged */
showAuth('login');
</script>
