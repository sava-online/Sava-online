function makeBrickTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a3632';
  ctx.fillRect(0,0,256,256);
  const bw = 64, bh = 32, gap = 3;
  for (let row = 0; row < 8; row++) {
    const offset = (row % 2) * bw/2;
    for (let col = -1; col < 5; col++) {
      const x = col*bw + offset + gap;
      const y = row*bh + gap;
      const w = bw - gap*2, h = bh - gap*2;
      const base = 90 + Math.random()*60;
      ctx.fillStyle = `rgb(${base+Math.random()*40|0},${base*0.45+Math.random()*25|0},${base*0.35+Math.random()*20|0})`;
      ctx.fillRect(x, y, w, h);
      for (let i = 0; i < 120; i++) {
        const px = x + Math.random()*w, py = y + Math.random()*h, s = Math.random()*0.35;
        ctx.fillStyle = `rgba(0,0,0,${s*0.4})`;
        ctx.fillRect(px, py, 2, 2);
        ctx.fillStyle = `rgba(255,200,150,${s*0.15})`;
        ctx.fillRect(px+1, py+1, 1, 1);
      }
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 1.5);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function makeBrickNormal() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#8080ff';
  ctx.fillRect(0,0,256,256);
  const bw = 64, bh = 32, gap = 3;
  for (let row = 0; row < 8; row++) {
    const offset = (row % 2) * bw/2;
    for (let col = -1; col < 5; col++) {
      const x = col*bw + offset + gap, y = row*bh + gap;
      ctx.strokeStyle = '#6060ff'; ctx.lineWidth = 2;
      ctx.strokeRect(x, y, bw-gap*2, bh-gap*2);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 1.5);
  return tex;
}

/* ==================== ПОИСК ПУТИ ==================== */
function cellKey(x,z){ return x+','+z; }
function bfsPath(sx, sz, tx, tz) {
  if (sx===tx && sz===tz) return [{x:tx,z:tz}];
  const q = [{x:sx,z:sz}];
  const visited = new Set([cellKey(sx,sz)]);
  const parent = new Map();
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  while (q.length) {
    const cur = q.shift();
    for (const [dx,dz] of dirs) {
      const nx = cur.x+dx, nz = cur.z+dz;
      if (nx<0||nz<0||nx>=COLS||nz>=ROWS) continue;
      if (MAP[nz][nx]===1) continue;
      const k = cellKey(nx,nz);
      if (visited.has(k)) continue;
      visited.add(k);
      parent.set(k, cur);
      if (nx===tx && nz===tz) {
        const path = [{x:tx,z:tz}];
        let p = cur;
        while (p) { path.unshift({x:p.x,z:p.z}); p = parent.get(cellKey(p.x,p.z)); }
        return path;
      }
      q.push({x:nx,z:nz});
    }
  }
  return null;
}

/* ==================== КОЛЛИЗИИ ==================== */
const WALL_RADIUS = 0.55;
function collides(px, pz) {
  const cx = Math.round(px / CELL), cz = Math.round(pz / CELL);
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const x = cx+dx, z = cz+dz;
    if (x<0||z<0||x>=COLS||z>=ROWS) continue;
    if (MAP[z][x] !== 1) continue;
    const wx = x*CELL, wz = z*CELL, half = CELL/2;
    const nx = Math.max(wx-half, Math.min(px, wx+half));
    const nz = Math.max(wz-half, Math.min(pz, wz+half));
    const ddx = px-nx, ddz = pz-nz;
    if (ddx*ddx + ddz*ddz < WALL_RADIUS*WALL_RADIUS) return true;
  }
  return false;
}
function moveWithCollision(pos, dx, dz) {
  if (!collides(pos.x + dx, pos.z)) pos.x += dx;
  if (!collides(pos.x, pos.z + dz)) pos.z += dz;
}

/* ==================== УПРАВЛЕНИЕ ==================== */
const keys = {};
let gameActive = false;
let mouseLocked = false;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Escape') document.exitPointerLock(); });
addEventListener('keyup', e => keys[e.code] = false);

addEventListener('mousemove', e => {
  if (!mouseLocked) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  player.pitch = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, player.pitch));
});
document.addEventListener('pointerlockchange', () => {
  mouseLocked = document.pointerLockElement === renderer.domElement;
});

/* ==================== МОБИЛЬНОЕ УПРАВЛЕНИЕ ==================== */
const mobileControls = document.getElementById('mobileControls');
const joystick = document.getElementById('joystick');
const stick    = document.getElementById('stick');
const runBtn   = document.getElementById('runBtn');
const lookZone = document.getElementById('lookZone');

const joyVec = { x: 0, y: 0 };
let joyTouchId = null;
function updateJoystick(t) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const maxR = rect.width/2 - 10;
  const dist = Math.hypot(dx, dy);
  if (dist > maxR) { dx = dx/dist*maxR; dy = dy/dist*maxR; }
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  joyVec.x = dx / maxR; joyVec.y = dy / maxR;
}
joystick.addEventListener('touchstart', e => { e.preventDefault(); joyTouchId = e.changedTouches[0].identifier; updateJoystick(e.changedTouches[0]); }, { passive:false });
joystick.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === joyTouchId) updateJoystick(t);
}, { passive:false });
function endJoy(e) {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === joyTouchId) {
    joyTouchId = null; joyVec.x = 0; joyVec.y = 0;
    stick.style.transform = 'translate(0,0)';
  }
}
joystick.addEventListener('touchend', endJoy, { passive:false });
joystick.addEventListener('touchcancel', endJoy, { passive:false });

let runPressed = false;
runBtn.addEventListener('touchstart', e => { e.preventDefault(); runPressed = true; runBtn.classList.add('pressed'); }, { passive:false });
runBtn.addEventListener('touchend', e => { e.preventDefault(); runPressed = false; runBtn.classList.remove('pressed'); }, { passive:false });
runBtn.addEventListener('touchcancel', e => { e.preventDefault(); runPressed = false; runBtn.classList.remove('pressed'); }, { passive:false });

let lookTouchId = null, lastLookX = 0, lastLookY = 0;
lookZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  lookTouchId = t.identifier; lastLookX = t.clientX; lastLookY = t.clientY;
}, { passive:false });
lookZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== lookTouchId) continue;
    const dx = t.clientX - lastLookX, dy = t.clientY - lastLookY;
    lastLookX = t.clientX; lastLookY = t.clientY;
    player.yaw   -= dx * 0.005;
    player.pitch -= dy * 0.005;
    player.pitch = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, player.pitch));
  }
}, { passive:false });
lookZone.addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null;
}, { passive:false });

/* ==================== HUD ==================== */
const hpEl = document.getElementById('hp');
const distEl = document.getElementById('dist');
const msgEl = document.getElementById('msg');
const dmgEl = document.getElementById('dmg');
const roleTag = document.getElementById('roleTag');

function showMsg(text, color='#fff', btnText='ЗАНОВО', btnAction=null) {
  msgEl.innerHTML = text + `<br><button id="retryBtn" style="margin-top:30px;padding:14px 40px;font-size:20px;font-weight:bold;background:linear-gradient(135deg,#ff4444,#aa0000);color:#fff;border:none;border-radius:8px;cursor:pointer;box-shadow:0 0 30px rgba(255,0,0,.7)">${btnText}</button>`;
  msgEl.style.color = color;
  msgEl.style.display = 'block';
  document.getElementById('retryBtn').onclick = () => {
    msgEl.style.display = 'none';
    if (btnAction) btnAction();
    else location.reload();
  };
}

/* ==================== ИГРОВОЙ ЦИКЛ ==================== */
const clock = new THREE.Clock();
let gameOver = false;
let gameWon = false;
let damageCooldown = 0;

/* ==================== ONLAIN STATE ==================== */
let currentRoom = null;
let roomRef = null;
let myRoleRef = null;
let opponentListener = null;

/* --- Утилиты --- */
function genRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function setStatus(text, color='#ffaa00') {
  statusText.textContent = text;
  statusText.style.color = color;
}

/* ==================== ЛОББИ ==================== */
window.joinAsRunner = async () => {
  await doJoin('runner', document.getElementById('roomInput').value.trim().toUpperCase());
};
window.joinAsHunter = async () => {
  await doJoin('hunter', document.getElementById('roomInput').value.trim().toUpperCase());
};
window.quickPlay = async () => {
  if (!myUid) { setStatus('ещё подключаемся...', '#ffaa00'); return; }
  const roomCode = document.getElementById('roomInput').value.trim().toUpperCase() || genRoomCode();
  document.getElementById('roomInput').value = roomCode;

  const room = await findOrCreateRoom(roomCode);
  if (!room) return;

  if (!room.runner) await doJoin('runner', roomCode, room);
  else if (!room.hunter) await doJoin('hunter', roomCode, room);
  else if (room.runner === myUid) await doJoin('runner', roomCode, room);
  else if (room.hunter === myUid) await doJoin('hunter', roomCode, room);
  else {
    // оба заняты — создаём новую
    const newCode = genRoomCode();
    document.getElementById('roomInput').value = newCode;
    await doJoin('runner', newCode);
  }
};

async function findOrCreateRoom(code) {
  const r = ref(db, 'rooms/' + code);
  const snap = await get(r);
  if (!snap.exists()) {
    await set(r, { createdAt: serverTimestamp(), runner: null, hunter: null, runnerPos: null, hunterPos: null, state: 'lobby' });
    return { runner: null, hunter: null };
  }
  return snap.val();
}

async function doJoin(role, code, roomData) {
  if (!myUid) { setStatus('Firebase не подключён', '#ff0000'); return; }
  if (!code) { setStatus('введи код комнаты', '#ffaa00'); return; }

  const roomSnap = await get(ref(db, 'rooms/' + code));
  if (!roomSnap.exists()) {
    await set(ref(db, 'rooms/' + code), {
      createdAt: serverTimestamp(), runner: null, hunter: null,
      runnerPos: null, hunterPos: null, state: 'lobby'
    });
    roomData = { runner: null, hunter: null };
  } else {
    roomData = roomSnap.val();
  }

  const runnerTaken = roomData.runner && roomData.runner !== myUid;
  const hunterTaken = roomData.hunter && roomData.hunter !== myUid;

  if (role === 'runner' && runnerTaken) { setStatus('Беглец уже занят в этой комнате', '#ff0000'); return; }
  if (role === 'hunter' && hunterTaken) { setStatus('Савелий уже занят в этой комнате', '#ff0000'); return; }

  currentRoom = code;
  roomRef = ref(db, 'rooms/' + code);
  player.role = role;

  const rolePath = role === 'runner' ? 'runner' : 'hunter';
  await update(roomRef, {
    [rolePath]: myUid,
    state: 'playing'
  });

  // позиции игроков
  const spawn = role === 'runner' ? START_RUNNER : START_HUNTER;
  player.pos.set(spawn.x*CELL, 1.7, spawn.z*CELL);
  player.yaw = 0;
  player.pitch = 0;
  player.hp = 100;

  roleTag.className = role;
  roleTag.textContent = role === 'runner' ? '🏃 БЕГЛЕЦ' : '🔴 САВЕЛИЙ';

  // отключаемся при выходе
  myRoleRef = ref(db, `rooms/${code}/${rolePath}`);
  onDisconnect(myRoleRef).remove();

  // подписываемся на второго игрока
  listenOpponent(code, role);

  // запускаем игру
  document.getElementById('start').style.display = 'none';
  gameActive = true;
  gameOver = false; gameWon = false;
  gameStartedAt = performance.now();

  if (isTouch) mobileControls.classList.add('active');
  else renderer.domElement.requestPointerLock();

  setStatus('В игре! Комната: ' + code, '#44ff44');
  clock.start();
}

/* ==================== СИНХРОНИЗАЦИЯ ==================== */
let lastSync = 0;
const SYNC_INTERVAL = 50; // мс

let gameStartedAt = 0;

function syncMyPos() {
  if (!currentRoom || !myUid) return;
  const now = performance.now();
  if (now - lastSync < SYNC_INTERVAL) return;
  lastSync = now;

  const role = player.role;
  const posPath = role === 'runner' ? 'runnerPos' : 'hunterPos';
  update(ref(db, `rooms/${currentRoom}/${posPath}`), {
    x: +player.pos.x.toFixed(2),
    z: +player.pos.z.toFixed(2),
    yaw: +player.yaw.toFixed(2),
    hp: Math.round(player.hp),
    t: serverTimestamp()
  }).catch(()=>{});
}

function listenOpponent(code, myRole) {
  const oppPath = myRole === 'runner' ? 'hunterPos' : 'runnerPos';
  const oppRole = myRole === 'runner' ? 'hunter' : 'runner';

  // модель противника
  if (opponentMesh) scene.remove(opponentMesh);
  opponentMesh = oppRole === 'hunter' ? createHunterModel() : createRunnerModel();
  opponentMesh.position.set(0, 0, -1000); // пока не видно
  scene.add(opponentMesh);
  opponentRole = oppRole;

  onValue(ref(db, `rooms/${code}/${oppPath}`), (snap) => {
    const d = snap.val();
    if (!d) { opponentMesh.position.set(0,0,-1000); return; }

    opponentPos.set(d.x, 0, d.z);
    opponentYaw = d.yaw || 0;
    opponentMesh.position.copy(opponentPos);
    opponentMesh.rotation.y = opponentYaw;

    // проверка контакта — если я беглец и рядом Савелий
    if (myRole === 'runner' && d) {
      const pd = Math.hypot(player.pos.x - d.x, player.pos.z - d.z);
      if (pd < 2.0 && damageCooldown <= 0 && gameActive && !gameOver) {
        player.hp -= 12;
        damageCooldown = 0.7;
        dmgEl.style.opacity = '1';
        setTimeout(() => dmgEl.style.opacity = '0', 150);
        if (player.hp <= 0) {
          player.hp = 0;
          gameOver = true;
          showMsg('💀 САВЕЛИЙ ПОЙМАЛ ТЕБЯ', '#ff0000');
          if (!isTouch) document.exitPointerLock();
          update(ref(db, `rooms/${code}/state`), { state: 'hunter_won' });
        }
      }
    }
  });
}

function checkExitOnline() {
  const ex = EXIT.x*CELL, ez = EXIT.z*CELL;
  const dx = player.pos.x - ex, dz = player.pos.z - ez;
  if (Math.hypot(dx, dz) < 1.5 && player.role === 'runner' && gameActive && !gameWon) {
    gameWon = true;
    showMsg('🏆 ТЫ СБЕЖАЛ!', '#00ff88');
    if (!isTouch) document.exitPointerLock();
    if (currentRoom) update(ref(db, `rooms/${currentRoom}/state`), { state: 'runner_won' });
  }
}

/* ==================== АНИМАЦИЯ ==================== */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameActive && !gameOver && !gameWon) {
    updatePlayer(dt);
    updateHUD();
    syncMyPos();
    if (player.role === 'runner') checkExitOnline();
  }

  exitRing.rotation.z += dt * 2;
  exitRing.position.y = 1.6 + Math.sin(performance.now()*0.003) * 0.25;
  exitLight.intensity = 2.5 + Math.sin(performance.now()*0.005) * 1.5;

  camera.position.copy(player.pos);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  flashlight.position.copy(camera.position);
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  flashlight.target.position.copy(camera.position).add(dir.multiplyScalar(10));

  renderer.render(scene, camera);
}

function updatePlayer(dt) {
  const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right   = new THREE.Vector3( Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  const move = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp'])    move.add(forward);
  if (keys['KeyS'] || keys['ArrowDown'])  move.sub(forward);
  if (keys['KeyD'] || keys['ArrowRight']) move.add(right);
  if (keys['KeyA'] || keys['ArrowLeft'])  move.sub(right);

  if (Math.abs(joyVec.x) > 0.08 || Math.abs(joyVec.y) > 0.08) {
    move.add(forward.clone().multiplyScalar(-joyVec.y));
    move.add(right.clone().multiplyScalar(joyVec.x));
  }

  if (move.lengthSq() > 0) {
    move.normalize();
    const running = keys['ShiftLeft'] || keys['ShiftRight'] || runPressed;
    // Савелий-игрок чуть быстрее
    let spd = running ? player.runSpeed : player.speed;
    if (player.role === 'hunter') spd *= 1.1;
    moveWithCollision(player.pos, move.x * spd * dt, move.z * spd * dt);
  }

  if (damageCooldown > 0) damageCooldown -= dt;
}

function updateHUD() {
  hpEl.textContent = Math.max(0, Math.round(player.hp));
  hpEl.style.color = player.hp > 60 ? '#44ff44' : player.hp > 30 ? '#ffaa00' : '#ff0000';

  if (opponentMesh && opponentMesh.position.z > -500) {
    const d = Math.hypot(player.pos.x - opponentPos.x, player.pos.z - opponentPos.z);
    distEl.textContent = d.toFixed(1) + ' м';
    distEl.style.color = d < 6 ? '#ff4444' : d < 15 ? '#ffaa00' : '#44ff44';
  } else {
    distEl.textContent = 'ждём игрока...';
    distEl.style.color = '#888';
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
