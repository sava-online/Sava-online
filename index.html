<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shift Net — Делай по-своему</title>
<style>
  :root {
    --bg:#f5f8fa; --panel:#fff; --text:#14171a; --muted:#657786; --border:#e1e8ed;
    --accent:#1da1f2; --accent-hover:#1a91da; --accent-soft:#e8f5fe;
    --hover:#f5f8fa; --sticker-bg:#f0f4f8; --modal-bg:rgba(0,0,0,.5);
    --danger:#e0245e; --success:#10b981; --gold:#f59e0b; --bh:40px;
  }
  [data-theme="dark"] {
    --bg:#15202b; --panel:#1c2732; --text:#e7ecf0; --muted:#8b98a5; --border:#38444d;
    --accent:#1da1f2; --accent-hover:#4ab3f4; --accent-soft:#1a3a52;
    --hover:#22303c; --sticker-bg:#22303c; --modal-bg:rgba(0,0,0,.7);
    --danger:#f43f5e; --success:#34d399; --gold:#fbbf24;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s;overflow-x:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}
  svg{display:block}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  .app{display:flex;max-width:1280px;margin:0 auto;min-height:100vh}

  /* AUTH */
  .auth-screen{position:fixed;inset:0;z-index:500;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
  .auth-screen.show{display:flex}
  .auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:28px 24px;box-shadow:0 8px 40px rgba(0,0,0,.12)}
  .auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .auth-logo svg{width:44px;height:44px}
  .auth-logo b{font-size:26px;font-weight:800;letter-spacing:-.5px;display:block}
  .auth-logo span{font-size:13px;color:var(--muted)}
  .auth-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--hover);padding:4px;border-radius:999px}
  .auth-tabs button{flex:1;padding:9px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
  .auth-tabs button.active{background:var(--accent);color:#fff}
  .auth-title{font-size:20px;font-weight:800;margin-bottom:6px}
  .auth-sub{font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.45}
  .auth-msg{padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:14px;line-height:1.4}
  .auth-msg.err{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
  .auth-msg.ok{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
  .auth-link{color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;display:inline-block;margin-top:12px}
  .auth-link:hover{text-decoration:underline}
  .auth-card .btn-primary{width:100%;padding:12px;font-size:16px}
  .loader{padding:60px 20px;text-align:center;color:var(--muted);font-weight:600}
  .spinner{width:34px;height:34px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* SIDEBAR */
  .sidebar{width:250px;padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--border);flex-shrink:0}
  .logo{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px}
  .logo svg{width:34px;height:34px;flex-shrink:0}
  .logo-name{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .logo-slogan{font-size:11px;color:var(--muted);font-weight:500}
  .nav-item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:999px;font-size:16px;font-weight:600;transition:background .15s;width:fit-content;padding-right:22px;position:relative}
  .nav-item:hover{background:var(--hover)}
  .nav-item.active{color:var(--accent)}
  .nav-item svg{width:24px;height:24px;flex-shrink:0}
  .badge{position:absolute;top:6px;left:26px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
  .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px;position:relative}
  .theme-toggle,.profile-mini{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;font-weight:600;font-size:14px;transition:background .15s;cursor:pointer}
  .theme-toggle:hover,.profile-mini:hover{background:var(--hover)}
  .theme-toggle svg{width:22px;height:22px;flex-shrink:0}
  .user-menu{position:absolute;bottom:64px;left:6px;right:6px;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.2);overflow:hidden;display:none;z-index:60;min-width:220px}
  .user-menu.show{display:block}
  .user-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 16px;font-weight:700;font-size:14px}
  .user-menu button svg{width:18px;height:18px}
  .user-menu button:hover{background:var(--hover)}
  .user-menu button.red{color:var(--danger)}

  .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px;flex-shrink:0;user-select:none;background-size:cover;background-position:center;position:relative}
  .avatar.sm{width:34px;height:34px;font-size:14px}
  .avatar.ring{box-shadow:0 0 0 2px var(--panel),0 0 0 4.5px var(--accent);cursor:pointer}
  .avatar.ring.seen{box-shadow:0 0 0 2px var(--panel),0 0 0 4.5px #9aa5b1}
  .verify-badge{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--panel)}
  .verify-badge svg{width:9px;height:9px;fill:#fff}
  .online-dot{position:absolute;top:0;right:0;width:13px;height:13px;background:#22c55e;border:2px solid var(--panel);border-radius:50%}

  /* MAIN */
  .main{flex:1;max-width:640px;border-right:1px solid var(--border);min-height:100vh;min-width:0}
  .brand-strip{position:sticky;top:0;z-index:22;height:var(--bh);display:flex;align-items:center;gap:8px;padding:0 16px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .brand-strip svg{width:22px;height:22px}
  .brand-strip b{font-size:16px;font-weight:800;letter-spacing:-.3px}
  .brand-strip span{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent)}
  .topbar{position:sticky;top:var(--bh);z-index:20;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:14px;min-height:54px}
  .topbar h1{font-size:20px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
  .back-btn:hover{background:var(--hover)}
  .back-btn svg{width:20px;height:20px}
  .slogan-badge{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:999px;white-space:nowrap}

  .search-box{padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:calc(var(--bh) + 54px);background:var(--bg);z-index:15}
  .search-input-wrap{display:flex;align-items:center;gap:10px;background:var(--hover);border:1px solid var(--border);border-radius:999px;padding:9px 16px}
  .search-input-wrap:focus-within{border-color:var(--accent);background:var(--panel)}
  .search-input-wrap svg{width:20px;height:20px;color:var(--muted);flex-shrink:0}
  .search-input-wrap input{flex:1;border:none;outline:none;background:transparent;color:var(--text);font-size:15px;min-width:0}

  /* STORIES BAR */
  .stories{display:flex;gap:12px;padding:12px 14px 8px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--panel);scrollbar-width:thin}
  .story-item{display:flex;flex-direction:column;align-items:center;gap:7px;width:66px;flex-shrink:0;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);padding-top:5px}
  .story-item .lbl{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .story-item .av-wrap{position:relative}
  .story-plus{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;border:2px solid var(--panel);display:flex;align-items:center;justify-content:center}
  .story-plus svg{width:12px;height:12px;stroke-width:3}
  .story-all{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
  .story-all svg{width:26px;height:26px}

  .composer{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px}
  .composer-body{flex:1;min-width:0;position:relative}
  .composer textarea{width:100%;border:none;outline:none;resize:none;background:transparent;color:var(--text);font-size:19px;line-height:1.4;min-height:48px;padding-top:8px}
  .composer textarea::placeholder{color:var(--muted)}
  .composer-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px}
  .toolbar-left{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);transition:background .15s;flex-shrink:0}
  .icon-btn:hover{background:var(--accent-soft)}
  .icon-btn svg{width:22px;height:22px}
  .char-count{font-size:13px;color:var(--muted);font-weight:600;margin-left:6px}
  .char-count.over{color:var(--danger)}
  .btn-primary{background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:9px 22px;border-radius:999px;transition:background .15s,opacity .15s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn-primary svg{width:18px;height:18px}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-primary:disabled{opacity:.5;cursor:default}
  .btn-outline{border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px;transition:background .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .btn-outline svg{width:16px;height:16px}
  .btn-outline:hover{background:var(--accent-soft)}
  .btn-danger{border:1px solid var(--danger);color:var(--danger);font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px;transition:background .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .btn-danger svg{width:16px;height:16px}
  .btn-danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
  .btn-ghost{font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;transition:background .15s}
  .btn-ghost:hover{background:var(--hover)}
  .btn-gold{background:var(--gold);color:#000;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px}
  .btn-gold:hover{opacity:.9}

  .sticker-panel{display:none;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px;padding:10px;background:var(--sticker-bg);border-radius:14px}
  .sticker-panel.show{display:grid}
  .sticker-opt{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;padding:4px}
  .sticker-opt:hover{background:var(--panel);transform:scale(1.08)}
  .sticker-opt svg{width:100%;height:100%}
  .chosen-stickers{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .post-sticker{width:64px;height:64px;padding:6px;background:var(--sticker-bg);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .post-sticker svg{width:100%;height:100%}
  .post-stickers{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

  .mention-dropdown{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.18);overflow:hidden;z-index:60;min-width:230px;display:none}
  .mention-dropdown.show{display:block}
  .mention-item{display:flex;align-items:center;gap:10px;padding:10px 14px;width:100%;text-align:left;transition:background .1s}
  .mention-item:hover,.mention-item.selected{background:var(--hover)}
  .mention-item .name{font-weight:700;font-size:14px}
  .mention-item .handle{font-size:13px;color:var(--muted)}
  .community-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;margin-top:8px;margin-right:6px}
  .community-chip button{color:var(--accent);font-size:16px;line-height:1}
  .chip-check{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text);margin-top:8px;cursor:pointer}

  .composer-img-preview{margin-top:10px;position:relative;display:inline-block}
  .composer-img-preview img{max-height:200px;max-width:100%;border-radius:14px;border:1px solid var(--border);display:block}
  .composer-img-preview button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;font-size:15px;font-weight:700;border:2px solid var(--panel);display:flex;align-items:center;justify-content:center}

  /* POSTS */
  .post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);transition:background .15s}
  .post:hover{background:var(--hover)}
  .post-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .post-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;min-width:0}
  .post-name{font-weight:700;display:flex;align-items:center;gap:3px;flex-shrink:0;cursor:pointer}
  .post-handle,.post-time{color:var(--muted);font-size:14px;flex-shrink:0}
  .post-community{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;cursor:pointer;flex-shrink:0}
  .post-community:hover{background:var(--accent);color:#fff}
  .post-text{margin-top:3px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;cursor:pointer}
  .mention,.hashtag{color:var(--accent);cursor:pointer}
  .mention{font-weight:600}
  .mention:hover,.hashtag:hover{text-decoration:underline}
  .post-image{margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--border);width:100%}
  .post-image img{width:100%;height:auto;max-height:420px;object-fit:cover;display:block}
  .post-actions{display:flex;gap:2px;margin-top:8px;margin-left:-8px;flex-wrap:wrap}
  .action-btn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;color:var(--muted);font-size:13px;font-weight:600;transition:color .15s,background .15s}
  .action-btn svg{width:18px;height:18px}
  .action-btn:hover{background:var(--accent-soft);color:var(--accent)}
  .action-btn.liked{color:var(--danger)}
  .action-btn.liked:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
  .action-btn.reposted{color:var(--success)}
  .action-btn.reposted:hover{background:color-mix(in srgb,var(--success) 12%,transparent)}
  .action-btn.del:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}

  /* RAIL */
  .rail{width:320px;padding:16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:none;flex-shrink:0}
  .rail-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
  .rail-card h2{font-size:18px;font-weight:800;margin-bottom:12px}
  .rail-user{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
  .rail-user:hover .name{text-decoration:underline}
  .rail-user-info{flex:1;min-width:0}
  .rail-user-info .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:3px}
  .rail-user-info .handle{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn-follow{font-size:13px;font-weight:700;padding:5px 14px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);transition:background .15s,color .15s;flex-shrink:0}
  .btn-follow:hover{background:var(--accent-soft)}
  .btn-follow.following{background:var(--accent);color:#fff}
  .trend-item{padding:8px 0;cursor:pointer}
  .trend-item:hover .trend-name{text-decoration:underline}
  .trend-label{font-size:13px;color:var(--muted)}
  .trend-name{font-weight:700}
  .trend-count{font-size:13px;color:var(--muted)}

  .comm-list{display:flex;flex-direction:column;gap:2px}
  .comm-card{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background .15s}
  .comm-card:hover{background:var(--hover)}
  .comm-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0;background-size:cover;background-position:center;position:relative;overflow:hidden}
  .comm-info{flex:1;min-width:0}
  .comm-info .cname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px}
  .comm-info .cmeta{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* MODAL */
  .modal-backdrop{position:fixed;inset:0;background:var(--modal-bg);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal-backdrop.show{display:flex}
  .modal{background:var(--panel);border-radius:20px;width:100%;max-width:560px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.3);animation:modalIn .22s ease}
  @keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:5}
  .modal-head h2{font-size:19px;font-weight:800}
  .modal-close{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;transition:background .15s;flex-shrink:0}
  .modal-close:hover{background:var(--hover)}
  .modal-body{padding:18px;max-height:75vh;overflow-y:auto}
  .modal-body.flush{padding:0}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
  .field input[type=text],.field input:not([type]),.field input[type=email],.field input[type=password],.field textarea,.field select{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;outline:none;transition:border-color .15s}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field input:disabled{opacity:.6}
  .field textarea{resize:vertical;min-height:70px}
  .field .hint{font-size:12px;color:var(--muted);margin-top:5px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
  .menu-list button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;font-weight:600;font-size:15px;text-align:left}
  .menu-list button:hover{background:var(--hover)}
  .menu-list button svg{width:20px;height:20px;color:var(--accent)}
  .menu-list button.red,.menu-list button.red svg{color:var(--danger)}
  .set-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
  .set-row:last-of-type{border-bottom:none}
  .set-row .t{flex:1}.set-row .t b{display:block;font-size:15px}.set-row .t span{font-size:13px;color:var(--muted)}
  .sw{position:relative;width:46px;height:26px;flex-shrink:0}
  .sw input{opacity:0;width:0;height:0}
  .sw span{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:.2s;cursor:pointer}
  .sw span::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .sw input:checked+span{background:var(--accent)}
  .sw input:checked+span::before{transform:translateX(20px)}

  /* PROFILE */
  .profile-cover{height:150px;background:linear-gradient(120deg,#1da1f2,#8b5cf6,#ec4899)}
  .profile-header{padding:0 16px 8px;position:relative}
  .profile-avatar{width:96px;height:96px;border-radius:50%;border:4px solid var(--panel);margin-top:-48px;font-size:36px}
  .profile-avatar.ring{box-shadow:0 0 0 4px var(--panel),0 0 0 7px var(--accent)}
  .profile-avatar.ring.seen{box-shadow:0 0 0 4px var(--panel),0 0 0 7px #9aa5b1}
  .profile-avatar .online-dot{width:18px;height:18px;top:4px;right:4px;border-width:3px}
  .profile-name{font-size:22px;font-weight:800;margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .profile-handle{color:var(--muted);font-size:15px}
  .presence{font-size:13px;font-weight:600;margin-top:2px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .presence.on{color:#22c55e}
  .presence i{width:9px;height:9px;border-radius:50%;background:#22c55e;display:inline-block}
  .profile-bio{margin-top:10px;font-size:15px;line-height:1.45;white-space:pre-wrap}
  .profile-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:14px}
  .profile-meta span,.profile-meta a{display:inline-flex;align-items:center;gap:5px}
  .profile-meta svg{width:15px;height:15px}
  .profile-meta a{color:var(--accent);text-decoration:none}
  .profile-stats{display:flex;gap:20px;margin-top:12px;font-size:14px;flex-wrap:wrap}
  .profile-stats b{font-weight:800;color:var(--text)}
  .profile-stats .st{color:var(--muted);cursor:pointer}
  .profile-stats .st:hover{text-decoration:underline}
  .contact-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:border-color .15s;text-decoration:none}
  .contact-badge svg{width:15px;height:15px}
  .contact-badge:hover{border-color:var(--accent)}
  .tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:calc(var(--bh) + 54px);background:var(--bg);z-index:15}
  .tab{flex:1;padding:14px;font-weight:700;font-size:14px;color:var(--muted);text-align:center;position:relative;transition:background .15s;cursor:pointer}
  .tab:hover{background:var(--hover)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:3px;background:var(--accent);border-radius:3px}
  .empty{padding:48px 24px;text-align:center;color:var(--muted)}
  .empty svg{width:56px;height:56px;margin:0 auto 12px;opacity:.5}
  .empty h3{font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px}
  .comm-banner{height:130px;display:flex;align-items:flex-end;padding:16px;position:relative}
  .comm-banner-icon{width:80px;height:80px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;border:4px solid var(--panel);margin-bottom:-40px;background-size:cover;background-position:center}
  .staff-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;padding:5px 6px 5px 12px;border-radius:999px;margin:0 6px 6px 0}
  .staff-chip button{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;line-height:1}

  /* COMMENTS */
  .comment{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);transition:background .15s}
  .comment:hover{background:var(--hover)}
  .comment-main{flex:1;min-width:0}
  .comment-head{display:flex;align-items:center;gap:6px;font-size:14px;flex-wrap:wrap}
  .comment-head .name{font-weight:700;display:flex;align-items:center;gap:3px}
  .comment-head .handle,.comment-head .time{color:var(--muted);font-size:13px}
  .comment-text{margin-top:3px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .comment-actions{display:flex;gap:6px;margin-top:4px;margin-left:-8px;flex-wrap:wrap;align-items:center}
  .comment-actions .action-btn{font-size:12px;padding:4px 8px}
  .comment-actions .action-btn svg{width:15px;height:15px}
  .author-like-big{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);font-size:12px;font-weight:800}
  .author-like-big svg{width:14px;height:14px}
  .comment-reply-info{font-size:12px;color:var(--muted);margin-bottom:2px}
  .comment-reply-info b{color:var(--accent)}

  /* MESSENGER */
  .messenger{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column}
  .messenger.show{display:flex}
  .msg-header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
  .msg-header h2{font-size:18px;font-weight:800;flex:1}
  .msg-body{flex:1;display:flex;overflow:hidden;max-width:1200px;margin:0 auto;width:100%;min-height:0}
  .msg-sidebar{width:300px;border-right:1px solid var(--border);overflow-y:auto;background:var(--panel);flex-shrink:0}
  .msg-chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);min-height:0}
  .chat-item{display:flex;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;align-items:center}
  .chat-item:hover{background:var(--hover)}
  .chat-item.active{background:var(--accent-soft)}
  .chat-item-info{flex:1;min-width:0}
  .chat-item-info .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px}
  .chat-item-info .preview{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .chat-item-time{font-size:11px;color:var(--muted);flex-shrink:0}
  .unread-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .chat-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--panel);min-height:58px}
  .chat-head .back-btn.chat-back{display:none}
  .chat-head .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .chat-head .sub.on{color:#22c55e}
  .chat-head .sub i{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
  .pin-bar{background:var(--panel);border-bottom:1px solid var(--border)}
  .pin-row{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer}
  .pin-row svg{width:18px;height:18px;color:var(--accent);flex-shrink:0}
  .pin-row .pt{flex:1;min-width:0;font-size:13px}
  .pin-row .pt b{display:block;color:var(--accent);font-size:12px}
  .pin-row .pt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pin-list{max-height:180px;overflow-y:auto;border-top:1px solid var(--border)}
  .chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:0}
  .bubble{max-width:75%;padding:8px 12px;border-radius:18px;font-size:15px;line-height:1.4;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer;position:relative;transition:box-shadow .2s}
  .bubble.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .bubble.them{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
  .bubble small{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10px;opacity:.7;margin-top:3px}
  .bubble small svg{width:11px;height:11px}
  .bubble img.mimg{display:block;max-width:100%;max-height:300px;border-radius:12px;margin-bottom:4px}
  .bubble.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 50%,transparent)}
  .bubble.flash{box-shadow:0 0 0 3px var(--gold)}
  .quote{border-left:3px solid currentColor;padding:2px 8px;margin-bottom:5px;border-radius:4px;background:rgba(127,127,127,.15);font-size:13px;cursor:pointer;opacity:.95}
  .quote b{display:block;font-size:12px}
  .quote span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
  .sys-msg{align-self:center;background:var(--sticker-bg);color:var(--muted);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
  .sys-msg svg{width:14px;height:14px}
  .reply-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--border);background:var(--panel)}
  .reply-bar .q{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px;font-size:13px}
  .reply-bar .q b{color:var(--accent);display:block;font-size:12px}
  .reply-bar .q span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat-input-area{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--panel);align-items:center;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .chat-input-area input[type=text]{flex:1;min-width:0;padding:11px 16px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;font-size:15px}
  .chat-input-area input[type=text]:focus{border-color:var(--accent)}
  .msg-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);padding:24px;text-align:center}
  .msg-empty svg{width:64px;height:64px;opacity:.4}

  /* CALL */
  .call-overlay{position:fixed;inset:0;z-index:450;background:linear-gradient(160deg,#0f172a,#1e3a5f 60%,#1da1f2);display:none;align-items:center;justify-content:center;color:#fff;padding:20px}
  .call-overlay.show{display:flex}
  .call-card{text-align:center;width:100%;max-width:360px}
  .call-av{display:flex;justify-content:center;margin-bottom:22px}
  .call-av .avatar{border:3px solid rgba(255,255,255,.4)}
  .call-card.pulse .call-av .avatar{animation:ring 1.4s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}100%{box-shadow:0 0 0 28px rgba(255,255,255,0)}}
  .call-name{font-size:26px;font-weight:800}
  .call-status{font-size:16px;opacity:.85;margin-top:6px;min-height:22px}
  .call-btns{display:flex;justify-content:center;gap:34px;margin-top:48px}
  .call-btn{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .1s}
  .call-btn:active{transform:scale(.92)}
  .call-btn svg{width:30px;height:30px}
  .call-btn.green{background:#22c55e}.call-btn.red{background:#ef4444}.call-btn.gray{background:rgba(255,255,255,.22)}
  .call-limit{font-size:12px;opacity:.65;margin-top:14px}

  /* STORY VIEWER */
  .story-viewer{position:fixed;inset:0;z-index:420;background:#000;display:none;align-items:center;justify-content:center}
  .story-viewer.show{display:flex}
  .story-frame{position:relative;width:100%;max-width:440px;height:100%;max-height:100dvh;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .story-bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:5}
  .story-bars div{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:3px;overflow:hidden}
  .story-bars div i{display:block;height:100%;width:0;background:#fff}
  .story-bars div.done i{width:100%}
  .story-bars div.cur i{animation:sbar 5.5s linear forwards}
  @keyframes sbar{from{width:0}to{width:100%}}
  .story-top{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:5;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .story-top .nm{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .story-top .tm{font-size:12px;opacity:.85;font-weight:500;margin-left:6px}
  .story-top button{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.35)}
  .story-top button svg{width:20px;height:20px}
  .story-text{padding:60px 28px;font-size:28px;font-weight:800;line-height:1.3;text-align:center;color:#fff;width:100%;height:100%;display:flex;align-items:center;justify-content:center;word-break:break-word;white-space:pre-wrap}
  .story-img{width:100%;height:100%;object-fit:contain;background:#000}
  .story-cap{position:absolute;bottom:0;left:0;right:0;padding:40px 20px 28px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:16px;text-align:center}
  .story-nav{position:absolute;top:70px;bottom:0;z-index:4}
  .story-nav.l{left:0;width:35%}.story-nav.r{right:0;width:65%}
  .bg-pick{display:flex;gap:8px;flex-wrap:wrap}
  .bg-pick button{width:40px;height:40px;border-radius:12px;border:3px solid transparent}
  .bg-pick button.on{border-color:var(--text)}
  .story-prev{width:100%;min-height:150px;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;font-weight:800;font-size:22px;text-align:center;margin-bottom:12px;word-break:break-word}
  .lightbox{position:fixed;inset:0;z-index:440;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px}
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px}

  /* NOTIFICATIONS */
  .notif-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer;position:relative}
  .notif-item:hover{background:var(--hover)}
  .notif-item.unread{background:var(--accent-soft)}
  .notif-icon-wrap{position:relative;flex-shrink:0}
  .notif-type-icon{position:absolute;bottom:-4px;right:-4px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border:2px solid var(--panel)}
  .notif-type-icon svg{width:11px;height:11px}
  .notif-type-icon.like{background:var(--danger)}
  .notif-type-icon.repost{background:var(--success)}
  .notif-type-icon.verify{background:var(--gold)}
  .notif-type-icon.admin{background:#8b5cf6}
  .notif-body{flex:1;min-width:0}
  .notif-text{font-size:14px;line-height:1.4}
  .notif-text b{font-weight:700}
  .notif-time{font-size:12px;color:var(--muted);margin-top:2px}

  /* ADMIN */
  .admin-tabs{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border);overflow-x:auto;background:var(--panel);position:sticky;top:calc(var(--bh) + 54px);z-index:15}
  .admin-tab{padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;transition:background .15s;cursor:pointer}
  .admin-tab:hover{background:var(--hover)}
  .admin-tab.active{background:var(--accent);color:#fff}
  .admin-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
  .admin-item-info{flex:1;min-width:0}
  .admin-item-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px}
  .admin-item-meta{font-size:13px;color:var(--muted);margin-top:2px}
  .admin-actions{display:flex;gap:6px;flex-wrap:wrap}
  .badge-verified{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:var(--accent);border-radius:50%;flex-shrink:0}
  .badge-verified svg{width:9px;height:9px;fill:#fff}
  .badge-banned{background:var(--danger);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px}
  .category-tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px;margin-top:4px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:10px 22px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:all .3s;z-index:600;pointer-events:none;box-shadow:0 4px 20px rgba(29,161,242,.45);max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(min-width:1050px){.rail{display:block}}
  @media(max-width:800px){
    .sidebar{width:72px;padding:16px 6px;align-items:center}
    .logo-name,.logo-slogan,.nav-item span:not(.badge),.theme-toggle span,.profile-mini>div{display:none}
    .nav-item{padding:12px;padding-right:12px}.profile-mini{padding:6px;justify-content:center}
    .slogan-badge{display:none}.main{max-width:none}
    .topbar{padding:0 10px}
    .user-menu{left:72px;bottom:6px;right:auto}
  }
  @media(max-width:600px){
    :root{--bh:38px}
    .app{flex-direction:column}
    .sidebar{position:fixed;bottom:0;top:auto;width:100%;height:calc(58px + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);flex-direction:row;justify-content:space-around;align-items:center;border-right:none;border-top:1px solid var(--border);background:var(--panel);z-index:40}
    .logo,.sidebar-bottom{display:none}
    .nav-item{padding:10px}
    .main{padding-bottom:calc(70px + env(safe-area-inset-bottom));border-right:none}
    .topbar{min-height:50px}
    .search-box,.tabs,.admin-tabs{top:calc(var(--bh) + 50px)}
    .msg-sidebar{width:100%}
    .msg-chat{display:none}
    .msg-body.chat-open .msg-sidebar{display:none}
    .msg-body.chat-open .msg-chat{display:flex}
    .chat-head .back-btn.chat-back{display:flex}
    .bubble{max-width:86%}
    .post-image img{max-height:300px}
    .badge{left:22px}
    .modal-backdrop{padding:16px 10px}
    .story-frame{max-width:none}
    .call-btns{gap:26px}
    .composer textarea{font-size:17px}
  }
</style>
</head>
<body data-theme="light">

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" fill="#1da1f2"/><path d="M15 16h18M24 16v16M15 32h18" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg>
      <div><b>Shift Net</b><span>Делай по-своему</span></div>

</div>

<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" fill="#1da1f2"/><path d="M15 16h18M24 16v16M15 32h18" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg>
      <div><div class="logo-name">Shift Net</div><div class="logo-slogan">Делай по-своему</div></div>
    </div>
    <button class="nav-item" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg><span>Главная</span>
    </button>
    <button class="nav-item" data-page="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Поиск</span>
    </button>
    <button class="nav-item" data-page="notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span>Уведомления</span>
      <span class="badge" id="notifBadge" style="display:none">0</span>
    </button>
    <button class="nav-item" data-page="messages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 9l9 6 9-6"/></svg><span>Сообщения</span>
      <span class="badge" id="msgBadge" style="display:none">0</span>
    </button>
    <button class="nav-item" data-page="communities">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15.5 20c0-2.5 1.8-4.5 4-4.5 1 0 1.5.2 1.5.2"/></svg><span>Сообщества</span>
    </button>

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtText(t){

function ago(ts){
  if(!ts)return '';const s=(Date.now()-ts)/1000;
  if(s<60)return 'сейчас';if(s<3600)return Math.floor(s/60)+' мин';if(s<86400)return Math.floor(s/3600)+' ч';
  const d=new Date(ts);return d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0');
}
function lastSeen(ts){
  if(!ts)return '';const s=(Date.now()-ts)/1000;

  const d=new Date(ts);return d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0')+' в '+clock(ts);
}
function clock(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtDur(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

/* --- imgBB --- */
async function uploadImg(file){
  const fd=new FormData();fd.append('image',file);
  const r=await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_KEY,{method:'POST',body:fd});
  const j=await r.json();
  if(!j.success)throw new Error((j.error&&j.error.message)||'Ошибка загрузки изображения');
  return j.data.display_url||j.data.url;
}
async function copyText(t){

  toast('Скопировано');
}

/* ===================== АВТОРИЗАЦИЯ ===================== */
const ERR={
  'auth/email-already-in-use':'Этот email уже зарегистрирован','auth/invalid-email':'Некорректный email',
  'auth/weak-password':'Слишком простой пароль (минимум 6 символов)','auth/invalid-credential':'Неверный email или пароль',
  'auth/user-not-found':'Пользователь не найден','auth/wrong-password':'Неверный пароль',
  'auth/too-many-requests':'Слишком много попыток. Подождите и попробуйте снова','auth/network-request-failed':'Нет соединения с сетью','auth/missing-password':'Введите пароль'
};
const errText=e=>ERR[e&&e.code]||(e&&e.message)||'Что-то пошло не так';
let flashMsg=null;

function showAuth(mode,msg,type){
  $('authScreen').classList.add('show');
  const box=$('authBody');
  const m=msg?`<div class="auth-msg ${type||'err'}">${esc(msg)}</div>`:'';
  if(mode==='verify'){
    const mail=S.authUser?S.authUser.email:'';
    box.innerHTML=`<div class="auth-title">Подтвердите почту</div>
      <div class="auth-sub">Мы отправили ссылку на <b>${esc(mail)}</b>. Перейдите по ней, затем нажмите кнопку ниже. Если письма нет — проверьте «Спам».</div>${m}
      <button class="btn-primary" id="aChk">Я подтвердил(а) почту</button>
      <div style="display:flex;gap:16px;flex-wrap:wrap"><span class="auth-link" id="aResend">Отправить письмо ещё раз</span><span class="auth-link" id="aOut">Выйти</span></div>`;
    $('aChk').onclick=async()=>{
      const u=auth.currentUser;if(!u)return;
      try{await u.reload();if(auth.currentUser.emailVerified){S.authUser=auth.currentUser;await enter(auth.currentUser);}
        else showAuth('verify','Почта ещё не подтверждена. Перейдите по ссылке из письма.');}catch(e){showAuth('verify',errText(e));}
    };
    $('aResend').onclick=async()=>{try{await sendEmailVerification(auth.currentUser);showAuth('verify','Письмо отправлено повторно','ok');}catch(e){showAuth('verify',errText(e));}};
    $('aOut').onclick=()=>signOut(auth);
    return;
  }
  const tabs=`<div class="auth-tabs"><button data-t="login" class="${mode==='login'?'active':''}">Вход</button><button data-t="register" class="${mode==='register'?'active':''}">Регистрация</button></div>`;
  if(mode==='login'){
    box.innerHTML=`${tabs}${m}
      <div class="field"><label>Email</label><input id="aEmail" type="email" autocomplete="email"></div>
      <div class="field"><label>Пароль</label><input id="aPass" type="password" autocomplete="current-password"></div>
      <button class="btn-primary" id="aGo">Войти</button>
      <span class="auth-link" id="aForgot">Забыли пароль?</span>`;
    const go=async()=>{
      const em=$('aEmail').value.trim(),pw=$('aPass').value;
      if(!em||!pw){showAuth('login','Введите email и пароль');return;}
      $('aGo').disabled=true;
      try{await signInWithEmailAndPassword(auth,em,pw);}catch(e){showAuth('login',errText(e));}
    };
    $('aGo').onclick=go;$('aPass').onkeydown=e=>{if(e.key==='Enter')go();};
    $('aForgot').onclick=()=>showAuth('reset');
  }else if(mode==='register'){
    box.innerHTML=`${tabs}${m}
      <div class="field"><label>Имя</label><input id="rName" maxlength="40" autocomplete="name"></div>
      <div class="field"><label>Логин</label><input id="rHandle" maxlength="20" autocomplete="username"><div class="hint">3–20 символов: буквы, цифры, _</div></div>
      <div class="field"><label>Email</label><input id="rEmail" type="email" autocomplete="email"></div>
      <div class="field"><label>Пароль</label><input id="rPass" type="password" autocomplete="new-password"><div class="hint">Минимум 6 символов</div></div>
      <button class="btn-primary" id="rGo">Зарегистрироваться</button>
      <div style="margin-top:10px;font-size:12px;color:var(--muted)">После регистрации придёт письмо со ссылкой — без подтверждения войти нельзя.</div>`;
    $('rGo').onclick=doRegister;
  }else if(mode==='reset'){
    box.innerHTML=`<div class="auth-title">Сброс пароля</div>
      <div class="auth-sub">Введите email — мы пришлём ссылку для создания нового пароля.</div>${m}
      <div class="field"><label>Email</label><input id="pEmail" type="email"></div>
      <button class="btn-primary" id="pGo">Отправить ссылку</button>
      <span class="auth-link" id="pBack">← Назад ко входу</span>`;
    $('pGo').onclick=async()=>{
      const em=$('pEmail').value.trim();if(!em){showAuth('reset','Введите email');return;}
      try{await sendPasswordResetEmail(auth,em);showAuth('reset','Если такой аккаунт есть, письмо со ссылкой отправлено. Проверьте почту (и «Спам»).','ok');}
      catch(e){showAuth('reset',errText(e));}
    };
    $('pBack').onclick=()=>showAuth('login');
  }
  box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>showAuth(b.dataset.t));
}

async function doRegister(){
  const name=$('rName').value.trim(),email=$('rEmail').value.trim(),pass=$('rPass').value;
  const isAdm=email.toLowerCase()===ADMIN_EMAIL;
  const handle=isAdm?ADMIN_HANDLE:$('rHandle').value.trim().toLowerCase();
  if(!name)return showAuth('register','Введите имя');
  if(!/^[a-zA-Zа-яА-Я0-9_]{3,20}$/.test(handle))return showAuth('register','Логин: 3–20 символов, буквы, цифры, _');
  if(handle===ADMIN_HANDLE&&!isAdm)return showAuth('register','Этот логин зарезервирован');
  if(!email)return showAuth('register','Введите email');
  if(pass.length<6)return showAuth('register','Пароль минимум 6 символов');
  $('rGo').disabled=true;
  try{
    if(!isAdm){const h=await get(ref(db,'handles/'+handle));if(h.exists())return showAuth('register','Этот логин уже занят');}
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    const uid=cred.user.uid;
    await set(ref(db,'users/'+uid),{name,handle,color:COLORS[Math.floor(Math.random()*COLORS.length)],bio:'',createdAt:Date.now()});
    if(!isAdm)await set(ref(db,'handles/'+handle),uid);
    await sendEmailVerification(cred.user);
    showAuth('verify','Письмо отправлено','ok');
  }catch(e){showAuth('register',errText(e));}
}

onAuthStateChanged(auth,async user=>{
  S.authUser=user;
  if(!user){
    stopListeners();endCallSilently();S.uid=null;S.entered=null;S.ready=false;
    S.users={};S.posts={};S.comms={};S.cats={};S.follows={};S.members={};S.notifs={};S.inbox={};S.presence={};S.settings={};S.statuses={};S.seen={};
    $('messenger').classList.remove('show');closeModal();closeStories();
    mainEl.innerHTML='';railEl.innerHTML='';
    const m=flashMsg;flashMsg=null;
    showAuth('login',m||'',m?'err':'');
    return;
  }
  S.uid=user.uid;
  if(!user.emailVerified){showAuth('verify');return;}
  await enter(user);
});

async function ensureProfile(user){
  const uid=user.uid;
  const snap=await get(ref(db,'users/'+uid));
  const adm=user.email===ADMIN_EMAIL;
  let p=snap.val();
  if(!p){
    let handle=adm?ADMIN_HANDLE:(user.email.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g,'')||'user').slice(0,14);
    if(handle.length<3)handle+='_user';
    if(!adm){let h=handle,i=0;while((await get(ref(db,'handles/'+h))).exists()){i++;h=handle+i;}handle=h;}
    p={name:adm?'Глеб':handle,handle,color:COLORS[0],bio:'',createdAt:Date.now()};
    await set(ref(db,'users/'+uid),p);
  }
  if(adm){
    await update(ref(db,'users/'+uid),{handle:ADMIN_HANDLE,verified:true}).catch(e=>console.warn(e));
    await set(ref(db,'handles/'+ADMIN_HANDLE),uid).catch(()=>{});
    if(!p.bio)await update(ref(db,'users/'+uid),{bio:'Создатель Shift Net. Делай по-своему.'}).catch(()=>{});
  }else if(p.handle){
    const h=await get(ref(db,'handles/'+p.handle));
    if(!h.exists())await set(ref(db,'handles/'+p.handle),uid).catch(()=>{});
  }
  return (await get(ref(db,'users/'+uid))).val();
}
async function enter(user){
  if(S.entered===user.uid)return;
  S.entered=user.uid;
  try{
    await user.getIdToken(true);
    const p=await ensureProfile(user);
    if(p&&p.banned){flashMsg='Аккаунт заблокирован администратором';S.entered=null;await signOut(auth);return;}
    $('authScreen').classList.remove('show');
    mainEl.innerHTML=`<div class="loader"><div class="spinner"></div>Загрузка…</div>`;
    startListeners();
    document.addEventListener('click',()=>{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();},{once:true});
  }catch(e){
    S.entered=null;console.error(e);
    showAuth('login','Ошибка доступа к базе данных. Проверьте правила Realtime Database. '+errText(e));
  }
}

/* ===================== СЛУШАТЕЛИ ===================== */
function stopListeners(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];loaded={};
  if(chatUnsub){chatUnsub();chatUnsub=null;}
  if(connUnsub){connUnsub();connUnsub=null;}
  lastPresenceKey=null;
}
function startListeners(){
  stopListeners();
  const L=(path,key,cb)=>unsubs.push(onValue(ref(db,path),s=>{
    S[key]=s.val()||{};loaded[key]=true;if(cb)cb();
    if(!S.ready&&loaded.users&&loaded.posts){
      S.ready=true;cleanOwnStatuses();
      navigate(S.page==='messages'?'home':S.page,S.page==='profile'?S.profileUid:S.page==='community'?S.communityId:undefined);
    }else sched();
  },err=>{console.error(path,err);toast('Нет доступа к «'+path+'» — обновите правила базы');}));
  L('users','users');L('posts','posts');L('communities','comms');L('categories','cats');
  L('follows','follows');L('members','members');L('presence','presence');L('statuses','statuses');
  L('settings','settings',checkPresence);
  L('statusSeen/'+S.uid,'seen');
  L('notifs/'+S.uid,'notifs');L('userChats/'+S.uid,'inbox');
  unsubs.push(onChildAdded(ref(db,'incomingCalls/'+S.uid),handleIncoming,e=>console.warn('calls',e)));
}
function sched(){if(refreshQueued)return;refreshQueued=true;requestAnimationFrame(()=>{refreshQueued=false;refreshView();});}
function cleanOwnStatuses(){
  Object.entries(S.statuses[S.uid]||{}).forEach(([id,s])=>{if(Date.now()-s.ts>=DAY)remove(ref(db,`statuses/${S.uid}/${id}`)).catch(()=>{});});
}

/* --- присутствие (онлайн) --- */
function checkPresence(){
  const key=String((S.settings[S.uid]||{}).showOnline!==false);
  if(key===lastPresenceKey)return;lastPresenceKey=key;applyPresence();
}
function applyPresence(){
  if(connUnsub){connUnsub();connUnsub=null;}
  const pr=ref(db,'presence/'+S.uid);
  if((S.settings[S.uid]||{}).showOnline===false){onDisconnect(pr).cancel().catch(()=>{});remove(pr).catch(()=>{});return;}
  connUnsub=onValue(ref(db,'.info/connected'),s=>{
    if(s.val()===true){
      onDisconnect(pr).set({online:false,last:serverTimestamp()})
        .then(()=>set(pr,{online:!document.hidden,last:serverTimestamp()})).catch(()=>{});
    }
  });
}
document.addEventListener('visibilitychange',()=>{
  if(!S.uid||(S.settings[S.uid]||{}).showOnline===false)return;
  set(ref(db,'presence/'+S.uid),{online:!document.hidden,last:serverTimestamp()}).catch(()=>{});
});

function navigate(page,param){
  if(page==='messages'){openMessenger();return;}
  S.page=page;
  if(page==='profile')S.profileUid=param||S.uid;
  if(page==='community'&&param)S.communityId=param;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',
    n.dataset.page===page||(page==='community'&&n.dataset.page==='communities')));
  window.scrollTo(0,0);
  render();
}
window.navigate=navigate;
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>navigate(b.dataset.page,b.dataset.page==='profile'?S.uid:undefined));

function render(){
  if(!S.ready)return;
  searchFn=null;
  ({home:renderHome,search:renderSearch,notifications:renderNotifications,communities:renderCommunities,
    community:renderCommunityPage,profile:renderProfile,admin:renderAdmin}[S.page]||renderHome)();
  renderRail();updateMini();updateBadges();
}
function refreshView(){
  if(!S.ready)return;
  updateMini();updateBadges();renderRail();
  if(S.openPost)updateCommentsList();
  if($('messenger').classList.contains('show')){renderChatList();if(!S.sel)renderChatHead();}
  const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&mainEl.contains(document.activeElement);
  switch(S.page){
    case 'home':{const f=$('feedEl');renderStories();if(f)renderFeed(f,postsList());break;}
    case 'search':if(searchFn)searchFn();break;
    case 'admin':if(!typing)renderAdmin();break;
    default:if(!typing)render();
  }
}

function bindComposer(){
  const input=$('composerInput'),cc=$('charCount'),pb=$('postBtn'),sp=$('stickerPanel'),md=$('mentionDropdown');
  const C=S.composer;
  input.value=S.draft||'';
  let men={active:false,start:-1,idx:0,matches:[]};
  function upd(){
    const len=input.value.trim().length;
    pb.disabled=len===0&&C.stickers.length===0&&!C.file;
    cc.textContent=`${len} / 280`;cc.className='char-count'+(len>280?' over':'');S.draft=input.value;
  }
  function renderSel(){
    const box=$('selectedStickers');box.innerHTML='';
    C.stickers.forEach(id=>{
      const d=document.createElement('div');d.className='post-sticker';d.style.cssText='width:46px;height:46px;position:relative;padding:5px';
      d.innerHTML=stickerSvg(id);
      const rm=document.createElement('button');rm.textContent='×';
      rm.style.cssText='position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--panel)';
      rm.onclick=()=>{C.stickers=C.stickers.filter(x=>x!==id);renderSel();upd();};
      d.appendChild(rm);box.appendChild(d);
    });
  }
  function renderImg(){
    const box=$('composerImagePreview');
    if(!C.preview){box.innerHTML='';return;}
    box.innerHTML=`<div class="composer-img-preview"><img src="${C.preview}"><button id="rmImg">×</button></div>`;
    $('rmImg').onclick=()=>{C.file=null;C.preview=null;renderImg();upd();};
  }
  renderSel();renderImg();upd();
  input.style.height='auto';input.style.height=Math.min(input.scrollHeight,200)+'px';

  STICKERS.forEach(s=>{
    const b=document.createElement('button');b.className='sticker-opt';b.innerHTML=s.svg;
    b.onclick=()=>{
      if(C.stickers.includes(s.id))C.stickers=C.stickers.filter(x=>x!==s.id);
      else{if(C.stickers.length>=6){toast('Максимум 6 иконок');return;}C.stickers.push(s.id);}
      renderSel();upd();
    };
    sp.appendChild(b);
  });
  $('stickerBtn').onclick=()=>sp.classList.toggle('show');

  const pi=$('photoInput');
  $('photoBtn').onclick=()=>pi.click();
  pi.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>5*1024*1024){toast('Максимум 5 МБ');return;}
    C.file=f;const r=new FileReader();r.onload=ev=>{C.preview=ev.target.result;renderImg();upd();};r.readAsDataURL(f);
  };
  $('commBtn').onclick=()=>{
    const list=visibleComms();
    openModal('Выбрать сообщество',`<div class="comm-list">
      <div class="comm-card" data-comm="" style="border:1px solid var(--border);margin-bottom:6px"><div class="comm-icon" style="background:var(--muted)">—</div><div class="comm-info"><div class="cname">Без сообщества</div><div class="cmeta">Личный пост</div></div></div>
      ${list.map(c=>`<div class="comm-card" data-comm="${c.id}">${renderCommIcon(c,44)}<div class="comm-info"><div class="cname">${esc(c.name)}</div><div class="cmeta">${fmtNum(c.members)} участников${canPostAs(c)?' · вы администратор':''}</div></div></div>`).join('')}
    </div>`,()=>{
      document.querySelectorAll('#modalInner .comm-card').forEach(el=>el.onclick=()=>{C.comm=el.dataset.comm||null;C.asComm=false;closeModal();render();});
    });
  };
  const clr=$('clearComm');if(clr)clr.onclick=()=>{C.comm=null;C.asComm=false;render();};
  const ac=$('asComm');if(ac)ac.onchange=()=>{C.asComm=ac.checked;};

  function handleMention(){
    const pos=input.selectionStart,before=input.value.slice(0,pos);
    const m=before.match(/@([a-zA-Zа-яА-Я0-9_]*)$/);
    if(!m){closeMen();return;}
    const q=m[1].toLowerCase();
    men.active=true;men.start=pos-m[0].length;men.idx=0;
    men.matches=usersList().filter(u=>!u.banned&&((u.handle||'').toLowerCase().startsWith(q)||(u.name||'').toLowerCase().startsWith(q))).slice(0,6);
    renderMen();
  }
  function renderMen(){
    if(!men.active||!men.matches.length){md.classList.remove('show');return;}
    md.innerHTML='';
    men.matches.forEach((u,i)=>{
      const b=document.createElement('button');b.className='mention-item'+(i===men.idx?' selected':'');
      b.innerHTML=`${renderAvatar(u,'sm')}<div><div class="name">${esc(u.name)} ${verifyBadgeHTML(u.uid)}</div><div class="handle">@${esc(u.handle)}</div></div>`;
      b.onmousedown=e=>{e.preventDefault();insMen(u);};md.appendChild(b);
    });
    md.classList.add('show');md.style.left='0px';md.style.top=(input.offsetTop+input.offsetHeight+4)+'px';
  }
  function insMen(u){
    const pos=input.selectionStart,before=input.value.slice(0,men.start),after=input.value.slice(pos);
    input.value=before+'@'+u.handle+' '+after;
    const np=men.start+u.handle.length+2;input.setSelectionRange(np,np);input.focus();closeMen();upd();
  }
  function closeMen(){men.active=false;md.classList.remove('show');}
  input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,200)+'px';upd();handleMention();};
  input.onkeydown=e=>{
    const open=men.active&&md.classList.contains('show');
    if(open){
      if(e.key==='ArrowDown'){e.preventDefault();men.idx=(men.idx+1)%men.matches.length;renderMen();return;}
      if(e.key==='ArrowUp'){e.preventDefault();men.idx=(men.idx-1+men.matches.length)%men.matches.length;renderMen();return;}
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();insMen(men.matches[men.idx]);return;}
      if(e.key==='Escape'){closeMen();return;}
    }
    if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>800){e.preventDefault();if(!pb.disabled)publish();}
  };
  $('mentionBtn').onclick=()=>{
    const pos=input.selectionStart,v=input.value;
    input.value=v.slice(0,pos)+'@'+v.slice(pos);input.setSelectionRange(pos+1,pos+1);input.focus();handleMention();upd();
  };
  pb.onclick=publish;

  async function publish(){
    const text=input.value.trim();
    if(!text&&!C.stickers.length&&!C.file)return;
    if(isBanned(S.uid)){toast('Аккаунт заблокирован');return;}
    pb.disabled=true;pb.textContent='Публикую…';
    try{
      let image=null;if(C.file)image=await uploadImg(C.file);
      const comm=C.comm?commById(C.comm):null;
      const asC=!!(comm&&C.asComm&&canPostAs(comm));
      const r=push(ref(db,'posts'));
      await set(r,clean({uid:S.uid,text,stickers:C.stickers.length?[...C.stickers]:null,image,community:C.comm,asCommunity:asC?true:null,ts:Date.now()}));
      const seen=new Set();
      (text.match(/@([a-zA-Zа-яА-Я0-9_]+)/g)||[]).forEach(m=>{const uid=byHandle(m.slice(1));if(uid&&!seen.has(uid)){seen.add(uid);notify(uid,'mention',{postId:r.key});}});
      S.draft='';C.stickers=[];C.file=null;C.preview=null;C.comm=null;C.asComm=false;
      render();toast('Пост опубликован!');
    }catch(e){console.error(e);toast('Ошибка: '+(e.message||'не удалось опубликовать'));pb.textContent='Опубликовать';upd();}
  }
}

/* ===================== ЛЕНТА ===================== */
function renderFeed(el,posts,emptyTitle,emptyText){
  if(!posts.length){el.innerHTML=`<div class="empty">${IC.reply}<h3>${emptyTitle||'Пока пусто'}</h3><p>${emptyText||'Опубликуйте первый пост'}</p></div>`;return;}
  el.innerHTML='';posts.forEach(p=>el.appendChild(buildPost(p)));
}
function buildPost(p){
  const el=document.createElement('div');el.className='post';
  const u=U(p.uid);
  const comm=p.community?commById(p.community):null;
  const asC=!!(p.asCommunity&&comm);
  const stickers=(p.stickers||[]).map(id=>`<div class="post-sticker">${stickerSvg(id)}</div>`).join('');
  const liked=!!(p.likes&&p.likes[S.uid]),reposted=!!(p.reposts&&p.reposts[S.uid]);
  const canDel=p.uid===S.uid||isAdmin();
  const left=asC?`<div style="cursor:pointer" data-comm-go="${comm.id}">${renderCommIcon(comm,40)}</div>`:`<div style="cursor:pointer" data-goto="${p.uid}">${renderAvatar(u,'',null,{story:true})}</div>`;
  const nameHTML=asC
    ?`<span class="post-name" data-comm-go="${comm.id}">${esc(comm.name)} ${comm.verified?`<span class="badge-verified">${CHECK_SVG}</span>`:''}</span><span class="post-handle">сообщество${canPostAs(comm)?' · @'+esc(u.handle):''}</span>`
    :`<span class="post-name" data-goto="${p.uid}">${esc(u.name)} ${verifyBadgeHTML(p.uid)}</span><span class="post-handle">@${esc(u.handle)}</span>${comm?`<span class="post-community" data-comm-go="${comm.id}">${esc(comm.name)}</span>`:''}`;
  el.innerHTML=`${left}
    <div class="post-main">
      <div class="post-head">${nameHTML}<span class="post-time">· ${ago(p.ts)}</span></div>
      ${p.text?`<div class="post-text">${fmtText(p.text)}</div>`:''}
      ${p.image?`<div class="post-image"><img src="${esc(p.image)}" loading="lazy" alt=""></div>`:''}
      ${stickers?`<div class="post-stickers">${stickers}</div>`:''}
      <div class="post-actions">
        <button class="action-btn reply-btn">${IC.reply}<span>${cnt(p.comments)}</span></button>
        <button class="action-btn repost-btn ${reposted?'reposted':''}" title="${reposted?'Убрать репост':'Репост'}">${IC.repost}<span>${cnt(p.reposts)}</span></button>
        <button class="action-btn like-btn ${liked?'liked':''}">${IC.heart(liked)}<span>${cnt(p.likes)}</span></button>
        ${canDel?`<button class="action-btn del" title="Удалить">${IC.trash}</button>`:''}
      </div>
    </div>`;
  el.querySelector('.like-btn').onclick=e=>{e.stopPropagation();toggleLike(p);};
  el.querySelector('.repost-btn').onclick=e=>{e.stopPropagation();toggleRepost(p);};
  el.querySelector('.reply-btn').onclick=e=>{e.stopPropagation();openComments(p.id);};
  const d=el.querySelector('.del');
  if(d)d.onclick=async e=>{e.stopPropagation();if(confirm('Удалить пост?')){await remove(ref(db,'posts/'+p.id)).catch(er=>toast('Ошибка: '+er.message));toast('Пост удалён');}};
  el.querySelectorAll('[data-comm-go]').forEach(c=>c.onclick=e=>{e.stopPropagation();navigate('community',c.dataset.commGo);});
  const pt=el.querySelector('.post-text');if(pt)pt.onclick=()=>openComments(p.id);
  return el;
}
async function toggleLike(p){
  const r=ref(db,`posts/${p.id}/likes/${S.uid}`);
  try{if(p.likes&&p.likes[S.uid])await remove(r);else{await set(r,true);notify(p.uid,'like',{postId:p.id,key:`like_${p.id}_${S.uid}`});}}
  catch(e){toast('Ошибка: '+e.message);}
}
async function toggleRepost(p){
  const r=ref(db,`posts/${p.id}/reposts/${S.uid}`);
  try{
    if(p.reposts&&p.reposts[S.uid]){await remove(r);toast('Репост убран');}
    else{await set(r,true);notify(p.uid,'repost',{postId:p.id,key:`repost_${p.id}_${S.uid}`});toast('Репост!');}
  }catch(e){toast('Ошибка: '+e.message);}
}

/* ===================== КОММЕНТАРИИ ===================== */
let commState={replyTo:null,stickers:[]};
function openComments(postId){
  const post=S.posts[postId];if(!post)return;
  S.openPost=postId;commState={replyTo:null,stickers:[]};
  const pu=U(post.uid);
  openModal('Комментарии',`
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);background:var(--bg)">
      <div style="display:flex;gap:10px;align-items:flex-start">${renderAvatar(pu,'sm',36)}
        <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${esc(pu.name)} ${verifyBadgeHTML(post.uid)} <span style="color:var(--muted);font-weight:400">@${esc(pu.handle)}</span></div>
        <div style="font-size:14px;margin-top:3px;white-space:pre-wrap">${fmtText(post.text||'')}</div></div></div>
    </div>
    <div id="commentsList"></div>
    <div style="padding:12px 16px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--panel)">
      <div id="replyToBanner" style="display:none;font-size:13px;color:var(--muted);margin-bottom:8px;align-items:center;gap:6px"></div>
      <div id="commChosen" class="chosen-stickers" style="margin:0 0 8px 46px"></div>
      <div style="display:flex;gap:10px;align-items:flex-start">${renderAvatar(U(S.uid),'sm',36)}
        <div style="flex:1;min-width:0">
          <textarea id="commentInput" placeholder="Написать комментарий..." maxlength="280" style="width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--text);font-size:14px;resize:vertical;min-height:44px;outline:none"></textarea>
          <div class="sticker-panel" id="commStickerPanel"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
            <div style="display:flex;gap:2px">
              <button class="icon-btn" id="commStickerBtn" style="width:32px;height:32px">${svg('<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/>',' style="width:18px;height:18px"')}</button>
              <button class="icon-btn" id="commMentionBtn" style="width:32px;height:32px">${svg('<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 006 0v-1a10 10 0 10-3.9 8"/>',' style="width:18px;height:18px"')}</button>
            </div>
            <button class="btn-primary" id="sendCommentBtn" style="padding:6px 16px;font-size:14px" disabled>Отправить</button>
          </div>
        </div>
      </div>
    </div>`,()=>{
    const input=$('commentInput'),send=$('sendCommentBtn'),panel=$('commStickerPanel'),list=$('commentsList');
    updateCommentsList();
    const upd=()=>{send.disabled=!input.value.trim()&&!commState.stickers.length;};
    const renderChosen=()=>{
      $('commChosen').innerHTML=commState.stickers.map((id,i)=>`<div class="post-sticker" data-i="${i}" style="width:38px;height:38px;padding:4px;cursor:pointer" title="Убрать">${stickerSvg(id)}</div>`).join('');
      $('commChosen').querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>{commState.stickers.splice(+d.dataset.i,1);renderChosen();upd();});
    };
    STICKERS.forEach(s=>{const b=document.createElement('button');b.className='sticker-opt';b.innerHTML=s.svg;
      b.onclick=()=>{if(commState.stickers.length>=3){toast('Максимум 3');return;}commState.stickers.push(s.id);renderChosen();upd();};panel.appendChild(b);});
    $('commStickerBtn').onclick=()=>panel.classList.toggle('show');
    $('commMentionBtn').onclick=()=>{const p=input.selectionStart,v=input.value;input.value=v.slice(0,p)+'@'+v.slice(p);input.setSelectionRange(p+1,p+1);input.focus();};
    input.oninput=upd;
    input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>800){e.preventDefault();if(!send.disabled)doSend();}};
    send.onclick=doSend;
    list.onclick=async e=>{
      const b=e.target.closest('[data-act]');if(!b)return;e.stopPropagation();
      const cid=b.dataset.cid,act=b.dataset.act;
      const p=S.posts[postId];if(!p)return;const c=(p.comments||{})[cid];if(!c)return;
      try{
        if(act==='reply'){
          const h=U(c.uid).handle;commState.replyTo={uid:c.uid,handle:h,cid};
          const bn=$('replyToBanner');bn.style.display='flex';
          bn.innerHTML=`Ответ на <b style="color:var(--accent)">@${esc(h)}</b> <button id="cancelReply" style="color:var(--danger);margin-left:auto;font-size:18px">×</button>`;
          $('cancelReply').onclick=()=>{commState.replyTo=null;bn.style.display='none';};input.focus();
        }else if(act==='like'){
          const r=ref(db,`posts/${postId}/comments/${cid}/likes/${S.uid}`);
          if(c.likes&&c.likes[S.uid])await remove(r);else await set(r,true);
        }else if(act==='authorlike'){
          await set(ref(db,`posts/${postId}/comments/${cid}/authorLiked`),true);
          notify(c.uid,'like',{postId,text:'поставил(а) «лайк от автора» вашему комментарию'});toast('Лайк от автора отправлен');
        }else if(act==='del'){
          if(confirm('Удалить комментарий?')){await remove(ref(db,`posts/${postId}/comments/${cid}`));toast('Комментарий удалён');}
        }
      }catch(er){toast('Ошибка: '+er.message);}
    };
    async function doSend(){
      const text=input.value.trim();if(!text&&!commState.stickers.length)return;
      if(isBanned(S.uid)){toast('Аккаунт заблокирован');return;}
      send.disabled=true;const rt=commState.replyTo;
      try{
        await set(push(ref(db,`posts/${postId}/comments`)),clean({uid:S.uid,text,stickers:commState.stickers.length?[...commState.stickers]:null,replyTo:rt?rt.handle:null,ts:Date.now()}));
        notify(post.uid,'comment',{postId});
        if(rt&&rt.uid!==post.uid)notify(rt.uid,'reply',{postId});
        (text.match(/@([a-zA-Zа-яА-Я0-9_]+)/g)||[]).forEach(m=>{const u=byHandle(m.slice(1));if(u&&u!==post.uid&&(!rt||u!==rt.uid))notify(u,'mention',{postId});});
        input.value='';commState={replyTo:null,stickers:[]};$('replyToBanner').style.display='none';renderChosen();
      }catch(er){toast('Ошибка: '+er.message);}
      upd();
    }
  },true);
}
function updateCommentsList(){
  const list=$('commentsList');if(!list)return;
  const post=S.posts[S.openPost];if(!post){closeModal();return;}
  const comments=Object.entries(post.comments||{}).map(([id,c])=>({id,...c})).sort((a,b)=>(a.ts||0)-(b.ts||0));
  if(!comments.length){list.innerHTML=`<div class="empty" style="padding:32px 16px"><h3>Комментариев пока нет</h3><p>Будьте первым!</p></div>`;return;}
  const canAL=post.uid===S.uid||isAdmin();
  list.innerHTML=comments.map(c=>{
    const u=U(c.uid);const liked=!!(c.likes&&c.likes[S.uid]);
    const st=(c.stickers||[]).map(id=>`<div class="post-sticker" style="width:48px;height:48px;padding:4px">${stickerSvg(id)}</div>`).join('');
    return `<div class="comment">
      <div style="cursor:pointer" data-goto="${c.uid}">${renderAvatar(u,'',36,{story:true})}</div>
      <div class="comment-main">
        <div class="comment-head"><span class="name">${esc(u.name)} ${verifyBadgeHTML(c.uid)}</span><span class="handle">@${esc(u.handle)}</span><span class="time">· ${ago(c.ts)}</span></div>
        ${c.replyTo?`<div class="comment-reply-info">ответ на <b>@${esc(c.replyTo)}</b></div>`:''}
        ${c.text?`<div class="comment-text">${fmtText(c.text)}</div>`:''}
        ${st?`<div class="post-stickers">${st}</div>`:''}
        ${c.authorLiked?`<div class="author-like-big">${IC.crown} Лайк от автора</div>`:''}
        <div class="comment-actions">
          <button class="action-btn" data-act="reply" data-cid="${c.id}">${IC.reply}<span>Ответить</span></button>
          <button class="action-btn ${liked?'liked':''}" data-act="like" data-cid="${c.id}">${IC.heart(liked)}<span>${cnt(c.likes)}</span></button>
          ${canAL&&!c.authorLiked?`<button class="action-btn" data-act="authorlike" data-cid="${c.id}" style="color:var(--gold)">${IC.crown}<span>Лайк от автора</span></button>`:''}
          ${(c.uid===S.uid||isAdmin())?`<button class="action-btn del" data-act="del" data-cid="${c.id}">${IC.trash}</button>`:''}
        </div>
      </div></div>`;
  }).join('');
}

/* ===================== ПОИСК ===================== */
function renderSearch(){
  mainEl.innerHTML=`${topbar('Поиск')}
    <div class="search-box"><div class="search-input-wrap">${svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>')}
      <input id="searchInput" placeholder="Люди, посты, сообщества, #хэштеги" value="${esc(S.searchQuery)}"></div></div><div id="searchResults"></div>`;
  const inp=$('searchInput');inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);
  inp.oninput=()=>{S.searchQuery=inp.value;doSearch();};
  searchFn=doSearch;doSearch();
  function doSearch(){
    const q=S.searchQuery.trim().toLowerCase();const res=$('searchResults');if(!res)return;
    if(!q){res.innerHTML=`<div class="empty"><h3>Начните поиск</h3><p>Люди, посты, сообщества и #хэштеги</p></div>`;return;}
    const qq=q.replace(/^#/,'');
    const people=usersList().filter(u=>!u.banned&&((u.name||'').toLowerCase().includes(qq)||(u.handle||'').toLowerCase().includes(qq)));
    const comms=visibleComms().filter(c=>(c.name||'').toLowerCase().includes(qq)||(c.desc||'').toLowerCase().includes(qq));
    const posts=postsList().filter(p=>(p.text||'').toLowerCase().includes(qq));
    let html='';
    if(people.length){
      html+=`<div style="padding:14px 16px 6px;font-weight:800;font-size:17px">Люди</div>`;
      people.forEach(u=>{
        const f=isFollowing(u.uid);
        html+=`<div class="rail-user" style="padding:10px 16px" data-goto="${u.uid}">${renderAvatar(u,'',null,{dot:true})}
          <div class="rail-user-info"><div class="name">${esc(u.name)} ${verifyBadgeHTML(u.uid)}</div><div class="handle">@${esc(u.handle)}</div><div style="font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.bio||'')}</div></div>
          ${u.uid!==S.uid?`<button class="btn-follow ${f?'following':''}" data-follow="${u.uid}">${f?'Читаю':'Читать'}</button>`:''}</div>`;
      });
    }
    if(comms.length){html+=`<div style="padding:14px 16px 6px;font-weight:800;font-size:17px">Сообщества</div>`;comms.forEach(c=>html+=communityCardHTML(c));}
    if(posts.length)html+=`<div style="padding:14px 16px 6px;font-weight:800;font-size:17px">Посты</div>`;
    if(!people.length&&!comms.length&&!posts.length)html=`<div class="empty"><h3>Ничего не найдено</h3><p>Попробуйте другой запрос</p></div>`;
    res.innerHTML=html;
    if(posts.length){const w=document.createElement('div');renderFeed(w,posts);res.appendChild(w);}
    res.querySelectorAll('[data-community]').forEach(el=>el.onclick=()=>navigate('community',el.dataset.community));
    res.querySelectorAll('[data-follow]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFollow(b.dataset.follow);});
  }
}
function communityCardHTML(c,extra){
  return `<div class="comm-card" data-community="${c.id}" style="padding:10px 16px">${renderCommIcon(c,44)}
    <div class="comm-info"><div class="cname">${esc(c.name)} ${c.verified?`<span class="badge-verified">${CHECK_SVG}</span>`:''}</div>
    <div class="cmeta">${fmtNum(c.members)} участников · ${esc(c.desc||'')}</div>

const NTEXT={like:'оценил(а) ваш пост',repost:'сделал(а) репост вашего поста',comment:'прокомментировал(а) ваш пост',reply:'ответил(а) на ваш комментарий',mention:'упомянул(а) вас',follow:'подписался(лась) на вас',verify:'выдал(а) вам галочку верификации',unverify:'снял(а) с вас галочку верификации',staff:'назначил(а) вас администратором сообщества',admin:''};
function renderNotifications(){
  const list=Object.entries(S.notifs).map(([id,n])=>({id,...n})).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const unread=list.filter(n=>!n.read).length;
  mainEl.innerHTML=`${topbar('Уведомления',false,unread?`<button class="btn-ghost" id="markAll" style="font-size:13px">Прочитать все</button>`:'')}<div id="notifList"></div>`;
  const box=$('notifList');
  if(!list.length){box.innerHTML=`<div class="empty"><h3>Пока тихо</h3><p>Здесь появятся лайки, упоминания и ответы</p></div>`;return;}
  list.forEach(n=>{
    const from=U(n.from);
    const el=document.createElement('div');el.className='notif-item'+(n.read?'':' unread');
    const cls=['like','repost','verify','admin'].includes(n.type)?n.type:'mention';
    const ico=n.type==='like'?IC.heart(true):n.type==='repost'?IC.repost:n.type==='verify'||n.type==='unverify'?IC.check:IC.reply;
    el.innerHTML=`<div class="notif-icon-wrap">${renderAvatar(from,'',40)}<div class="notif-type-icon ${cls}">${ico}</div></div>
      <div class="notif-body"><div class="notif-text"><b>${esc(from.name)}</b> ${verifyBadgeHTML(n.from)} ${esc(n.text||NTEXT[n.type]||'')}${n.comm?' «'+esc(n.comm)+'»':''}</div><div class="notif-time">${ago(n.ts)}</div></div>`;
    el.onclick=()=>{
      set(ref(db,`notifs/${S.uid}/${n.id}/read`),true).catch(()=>{});
      if(n.postId&&S.posts[n.postId])openComments(n.postId);
      else if(n.type==='follow')navigate('profile',n.from);
      else if(n.commId&&S.comms[n.commId])navigate('community',n.commId);
      else if(n.postId)toast('Пост недоступен');
    };
    box.appendChild(el);
  });
  const m=$('markAll');
  if(m)m.onclick=()=>{const up={};list.forEach(n=>{if(!n.read)up[`notifs/${S.uid}/${n.id}/read`]=true;});update(ref(db),up).catch(e=>toast(e.message));};
}

          notify(uid,'staff',{commId:c.id,comm:c.name});toast('Администратор добавлен');}catch(e){toast('Ошибка: '+e.message);}
      };

      const name=$('ecName').value.trim();if(!name){toast('Введите название');return;}

        closeModal();toast('Сохранено');

    };
  });
}

function openStories(uid){
  if(!(uid===S.uid||isFollowing(uid)))return;
  const list=activeStatuses(uid);if(!list.length){if(uid===S.uid)openStatusCreate();return;}
  let idx=list.findIndex(s=>!S.seen[s.id]);if(idx<0)idx=0;
  sv={uid,list,idx,t:null};
  $('storyViewer').classList.add('show');showStory();
}
function showStory(){
  clearTimeout(sv.t);
  const s=sv.list[sv.idx],u=U(sv.uid);
  const canDel=sv.uid===S.uid||isAdmin();
  $('storyViewer').innerHTML=`<div class="story-frame">
    <div class="story-bars">${sv.list.map((_,i)=>`<div class="${i<sv.idx?'done':i===sv.idx?'cur':''}"><i></i></div>`).join('')}</div>
    <div class="story-top">${renderAvatar(u,'sm',36)}<span class="nm">${esc(u.name)}<span class="tm">${ago(s.ts)}</span></span>
      ${canDel?`<button id="svDel">${IC.trash}</button>`:''}<button id="svClose">${IC.x}</button></div>
    ${s.type==='image'?`<img class="story-img" src="${esc(s.image)}" alt="">${s.text?`<div class="story-cap">${esc(s.text)}</div>`:''}`:`<div class="story-text" style="background:${BGS[s.bg||0]}">${esc(s.text)}</div>`}
    <div class="story-nav l" id="svPrev"></div><div class="story-nav r" id="svNext"></div></div>`;
  $('svClose').onclick=closeStories;
  $('svPrev').onclick=()=>{if(sv.idx>0){sv.idx--;showStory();}else showStory();};
  $('svNext').onclick=nextStory;
  const d=$('svDel');
  if(d)d.onclick=async()=>{
    if(!confirm('Удалить этот статус?'))return;
    clearTimeout(sv.t);
    try{await remove(ref(db,`statuses/${sv.uid}/${s.id}`));}catch(e){toast('Ошибка: '+e.message);return;}
    sv.list.splice(sv.idx,1);

    if(sv.idx>=sv.list.length)sv.idx=sv.list.length-1;showStory();

  sv.t=setTimeout(nextStory,5500);
}
function nextStory(){if(!sv)return;if(sv.idx<sv.list.length-1){sv.idx++;showStory();}else closeStories();}
