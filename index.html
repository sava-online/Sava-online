<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08b879">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>SavcomPay</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<!-- QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
  --green:#08b879;
  --green2:#059b67;
  --dark:#073d2c;
  --text:#15201c;
  --muted:#75807b;
  --bg:#f5f8f6;
  --card:#fff;
  --border:#e7ece9;
  --danger:#e84b4b;
  --yellow:#fff5d9;
  --shadow:0 12px 35px rgba(10,70,50,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  padding-bottom:88px;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.app{
  width:100%;
  max-width:760px;
  margin:auto;
  min-height:100vh;
}

.hidden{
  display:none!important;
}

/* ---------- SVG ---------- */

.icon{
  width:24px;
  height:24px;
  display:inline-block;
  flex:none;
}

.icon svg{
  width:100%;
  height:100%;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.logo{
  width:46px;
  height:46px;
  border-radius:16px;
  background:linear-gradient(145deg,#10c789,#079c69);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:900;
  box-shadow:0 7px 20px rgba(8,184,121,.25);
}

/* ---------- AUTH ---------- */

.auth{
  min-height:100vh;
  padding:35px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.auth-box{
  width:100%;
  max-width:440px;
  background:white;
  border-radius:30px;
  padding:30px;
  box-shadow:var(--shadow);
}

.auth-brand{
  text-align:center;
  margin-bottom:25px;
}

.auth-brand .logo{
  margin:auto;
  width:70px;
  height:70px;
  border-radius:23px;
  font-size:34px;
}

.auth-brand h1{
  margin:15px 0 5px;
  font-size:30px;
}

.auth-brand p{
  color:var(--muted);
  margin:0;
}

.tabs{
  display:flex;
  background:#eef3f0;
  border-radius:15px;
  padding:4px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  padding:12px;
  background:transparent;
  border-radius:12px;
  color:var(--muted);
  font-weight:700;
}

.tab.active{
  background:white;
  color:var(--green2);
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.input-group{
  margin-bottom:14px;
}

.input-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
  color:#55605b;
}

.input{
  width:100%;
  height:52px;
  border:1px solid var(--border);
  background:#f8faf9;
  border-radius:15px;
  padding:0 15px;
  outline:none;
  transition:.2s;
}

.input:focus{
  border-color:var(--green);
  background:white;
  box-shadow:0 0 0 4px rgba(8,184,121,.08);
}

.primary{
  width:100%;
  min-height:54px;
  border-radius:17px;
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:white;
  font-weight:800;
  font-size:17px;
  box-shadow:0 10px 24px rgba(8,184,121,.22);
}

.secondary{
  width:100%;
  min-height:52px;
  border-radius:16px;
  background:#edf5f1;
  color:var(--green2);
  font-weight:800;
}

.link{
  color:var(--green2);
  font-weight:700;
  cursor:pointer;
}

.error{
  background:#fff0f0;
  color:#b72d2d;
  border-radius:14px;
  padding:12px;
  font-size:14px;
  margin-bottom:12px;
}

.success{
  background:#e9fbf3;
  color:#147052;
  border-radius:14px;
  padding:12px;
  font-size:14px;
  margin-bottom:12px;
}

/* ---------- HEADER ---------- */

.header{
  padding:22px 20px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.profile{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.profile-info{
  min-width:0;
}

.profile-name{
  font-size:20px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile-id{
  color:var(--muted);
  margin-top:3px;
  font-size:14px;
}

.header-actions{
  display:flex;
  gap:8px;
}

.round-btn{
  width:48px;
  height:48px;
  border-radius:17px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#26322d;
  box-shadow:0 4px 15px rgba(0,0,0,.04);
}

/* ---------- BALANCE ---------- */

.balance-card{
  margin:14px 20px 0;
  padding:26px;
  min-height:265px;
  border-radius:32px;
  background:
    radial-gradient(circle at 100% 100%,rgba(255,255,255,.11) 0 90px,transparent 91px),
    radial-gradient(circle at 88% 90%,rgba(255,255,255,.07) 0 150px,transparent 151px),
    linear-gradient(145deg,#079b68,#056446);
  color:white;
  position:relative;
  overflow:hidden;
  box-shadow:0 15px 35px rgba(4,101,69,.20);
}

.balance-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.balance-label{
  opacity:.75;
  font-size:15px;
}

.network{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  border-radius:30px;
  padding:8px 13px;
  font-size:12px;
  font-weight:800;
}

.balance-number{
  font-size:52px;
  font-weight:900;
  margin-top:28px;
  letter-spacing:-2px;
}

.balance-sub{
  opacity:.65;
  margin-top:2px;
}

.wallet-state{
  opacity:.7;
  font-size:14px;
  margin-top:6px;
}

.balance-actions{
  display:flex;
  gap:12px;
  margin-top:30px;
}

.balance-btn{
  flex:1;
  min-height:54px;
  border-radius:17px;
  background:white;
  color:#075d43;
  font-weight:850;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.balance-btn.dark{
  background:rgba(255,255,255,.08);
  color:white;
  border:1px solid rgba(255,255,255,.13);
}

/* ---------- CONTENT ---------- */

.section{
  padding:0 20px;
  margin-top:28px;
}

.section-title{
  font-size:23px;
  font-weight:900;
  margin-bottom:14px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.quick{
  background:white;
  border-radius:20px;
  min-height:105px;
  padding:13px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  color:#123a2c;
  box-shadow:0 5px 18px rgba(0,0,0,.035);
}

.quick-icon{
  width:48px;
  height:48px;
  border-radius:16px;
  background:#e7f9f1;
  color:#078c60;
  display:flex;
  align-items:center;
  justify-content:center;
}

.quick span{
  font-size:12px;
  font-weight:800;
  text-align:center;
}

.asset{
  background:white;
  border-radius:21px;
  padding:17px;
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:10px;
  box-shadow:0 5px 18px rgba(0,0,0,.035);
}

.asset-logo{
  width:48px;
  height:48px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e7f9f1;
  color:#078c60;
  font-weight:900;
}

.asset-main{

}

.asset-name{
  font-weight:850;
}

.asset-address{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.asset-balance{
  font-weight:900;
  text-align:right;
}

.notice{
  background:var(--yellow);
  color:#80641d;
  border-radius:18px;
  padding:16px;
  line-height:1.45;
  font-size:14px;
}

/* ---------- BOTTOM ---------- */

.bottom{
  position:fixed;
  z-index:20;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(15px);
  border-top:1px solid #e7ece9;
  display:flex;
  justify-content:center;
}

.bottom-inner{
  width:100%;
  max-width:760px;
  display:flex;
}

.nav{
  flex:1;
  background:none;
  color:#89918d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:11px;
  font-weight:700;
}

.nav.active{
  color:var(--green2);
}

/* ---------- MODALS ---------- */

.overlay{
  position:fixed;
  z-index:100;
  inset:0;
  background:rgba(0,0,0,.48);
  backdrop-filter:blur(5px);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal{
  width:100%;
  max-width:760px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:30px 30px 0 0;
  padding:24px 20px calc(25px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}

@keyframes up{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-title{
  font-size:27px;
  font-weight:900;
}

.close{
  width:48px;
  height:48px;
  border-radius:16px;
  background:#f2f5f3;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#111;
}

.info-box{
  background:#e9fbf3;
  color:#26765d;
  border-radius:18px;
  padding:16px;
  line-height:1.45;
  margin-bottom:12px;
}

.warn-box{
  background:#fff6df;
  color:#80631d;
  border-radius:18px;
  padding:16px;
  line-height:1.45;
  margin-bottom:12px;
}

.address-box{
  background:#f6f8f7;
  border:1px solid var(--border);
  border-radius:17px;
  padding:15px;
  word-break:break-all;
  font-family:monospace;
  font-size:13px;
}

.copy-btn{
  width:100%;
  margin-top:10px;
  height:50px;
  border-radius:15px;
  background:#e8f8f1;
  color:#087052;
  font-weight:800;
}

.qr-wrap{
  display:flex;
  justify-content:center;
  padding:20px 0;
}

#qr{
  padding:10px;
  background:white;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.amount-input{
  font-size:28px;
  font-weight:800;
  text-align:center;
}

/* ---------- SEED ---------- */

.seed-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:15px 0;
}

.seed-word{
  background:#f5f8f6;
  border-radius:12px;
  padding:11px 5px;
  text-align:center;
  font-size:13px;
}

.seed-word b{
  color:#9ba39f;
  margin-right:3px;
}

.seed-actions{
  display:flex;
  gap:10px;
}

.seed-actions button{
  flex:1;
}

/* ---------- PIN ---------- */

.pin-screen{
  position:fixed;
  z-index:500;
  inset:0;
  background:linear-gradient(145deg,#06b878,#056547);
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.pin-logo{
  width:72px;
  height:72px;
  border-radius:24px;
  background:white;
  color:#078e60;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:900;
  margin-bottom:20px;
}

.pin-screen h2{
  margin:0;
  font-size:27px;
}

.pin-screen p{
  opacity:.72;
}

.pin-dots{
  display:flex;
  gap:12px;
  margin:22px 0;
}

.pin-dot{
  width:13px;
  height:13px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.65);
}

.pin-dot.on{
  background:white;
}

.pin-pad{
  width:100%;
  max-width:320px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.pin-key{
  height:60px;
  border-radius:19px;
  background:rgba(255,255,255,.13);
  color:white;
  font-size:22px;
  font-weight:800;
}

.pin-key:active{

}

.pin-error{
  min-height:20px;
  color:#ffe0e0;
  margin-bottom:8px;

/* ---------- SETTINGS ---------- */

.setting{
  background:white;
  border-radius:18px;
  padding:17px;
  margin-bottom:9px;

  align-items:center;
  gap:13px;
}

.setting-main{
  flex:1;
}

.setting-title{
  font-weight:850;
}

.setting-desc{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.setting-danger{

/* ---------- CARD ---------- */

.virtual-card{
  height:215px;
  border-radius:25px;
  padding:25px;
  background:
    radial-gradient(circle at 85% 15%,rgba(255,255,255,.22),transparent 30%),
    linear-gradient(135deg,#0a9b6b,#073d2c);
  color:white;
  position:relative;
  overflow:hidden;
  margin-bottom:15px;
}

.virtual-card .chip{
  width:45px;
  height:33px;
  border-radius:8px;
  background:linear-gradient(135deg,#d6d6d6,#7d7d7d);
  margin-top:15px;
}

.virtual-card .card-number{
  margin-top:28px;
  letter-spacing:3px;
  font-size:19px;
}

.virtual-card .card-bottom{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
  font-size:11px;
  opacity:.8;
}

/* ---------- TOAST ---------- */

.toast{
  position:fixed;
  z-index:900;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  background:#111;
  color:white;
  padding:14px 19px;
  border-radius:16px;
  max-width:90%;
  text-align:center;
  font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.22);
}

/* ---------- LOADER ---------- */

.loader{
  width:20px;
  height:20px;
  border:3px solid rgba(255,255,255,.35);
  border-top-color:white;
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:inline-block;
  vertical-align:middle;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@media(max-width:390px){
  .balance-number{
    font-size:43px;
  }

  .quick-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .auth-box{
    padding:23px;
  }
}
</style>
</head>

<script type="module">

/*
  ============================================================
  SAVCOMPAY TON ENGINE
  ============================================================

  ВАЖНО:
  Старый вариант использовал esm.sh + dynamic import().
  Здесь используем jsDelivr ESM.

  Официальный @ton/ton 16.3.0:
  https://www.npmjs.com/package/@ton/ton

  @ton/crypto:
  https://www.npmjs.com/package/@ton/crypto
*/

const TON_VERSION = "16.3.0";
const CRYPTO_VERSION = "3.3.0";

let TON = null;
let TONCRYPTO = null;
let tonLoaded = false;
let tonLoadError = null;

/*
  Загружаем модули один раз.
  +esm заставляет jsDelivr подготовить ESM-версию пакета.
*/

async function loadTONLibraries(){

  if(tonLoaded){
    return true;
  }

  try{

    showToast("Загрузка TON…");

    const tonUrl =
      "https://cdn.jsdelivr.net/npm/@ton/ton@" +
      TON_VERSION +
      "/+esm";

    const cryptoUrl =
      "https://cdn.jsdelivr.net/npm/@ton/crypto@" +
      CRYPTO_VERSION +
      "/+esm";

    const results = await Promise.all([
      import(tonUrl),
      import(cryptoUrl)
    ]);

    TON = results[0];
    TONCRYPTO = results[1];

    if(!TON || !TONCRYPTO){
      throw new Error("TON modules returned empty result");
    }

    tonLoaded = true;

    console.log("SavcomPay TON SDK loaded", TON_VERSION);

    return true;

  }catch(error){

    tonLoadError = error;

    console.error("TON SDK load error:",error);

    return false;
  }
}


/*
  Этот preload не блокирует интерфейс.
*/
window.addEventListener("load",()=>{
  loadTONLibraries().then(ok=>{
    if(ok){
      console.log("TON готов");
    }else{
      console.warn("TON SDK пока недоступен");
    }
  });
});


/* Экспорт */
window.TON_ENGINE = {
  load:loadTONLibraries,
  isReady:()=>tonLoaded,
  getTON:()=>TON,
  getCrypto:()=>TONCRYPTO,
  getError:()=>tonLoadError
};

</script>

function escapeHtml(str){

  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

  if(!Number.isFinite(n)) return "0";

  return n.toLocaleString("ru-RU",{
    maximumFractionDigits:6
  });
}

async function submitAuth(){

  const email=$("authEmail")?.value.trim();
  const password=$("authPassword")?.value;

  if(!email || !password){

    $("authError").innerHTML=
      `<div class="error">Заполните email и пароль.</div>`;

    return;
  }

  try{

    $("authError").innerHTML="";

    if(state.authMode==="register"){

      const name=$("regName")?.value.trim() || "Пользователь";

      const cred=
        await auth.createUserWithEmailAndPassword(
          email,
          password
        );

      await cred.user.updateProfile({
        displayName:name
      });

      await db.ref("users/"+cred.user.uid).set({

        uid:cred.user.uid,

        name:name,

        email:email,

        createdAt:firebase.database.ServerValue.TIMESTAMP,

        savId:createSavId()

      });

      await cred.user.sendEmailVerification();

      showToast("Письмо подтверждения отправлено");

      await auth.signOut();

      state.authMode="login";

      renderAuth();

      $("authError").innerHTML=
        `<div class="success">
          Проверьте почту и подтвердите email.
        </div>`;

    }else{

      const cred=
        await auth.signInWithEmailAndPassword(
          email,
          password
        );

      if(!cred.user.emailVerified){

        $("authError").innerHTML=
          `<div class="error">
            Email ещё не подтверждён.
            Проверьте почту.
          </div>`;

        await auth.signOut();

        return;
      }

      state.user=cred.user;

      await startApp();

    }

  }catch(error){

    console.error(error);

    let msg="Не удалось выполнить операцию.";

    if(error.code==="auth/email-already-in-use"){
      msg="Этот email уже зарегистрирован.";
    }

    if(error.code==="auth/wrong-password" ||
       error.code==="auth/invalid-credential"){
      msg="Неверный email или пароль.";
    }

    if(error.code==="auth/invalid-email"){
      msg="Некорректный email.";
    }

    if(error.code==="auth/weak-password"){
      msg="Пароль слишком короткий.";
    }

    $("authError").innerHTML=
      `<div class="error">${escapeHtml(msg)}</div>`;
  }
}


function createSavId(){

  let out="SAV-";

}

/* ==========================================================
   WALLET ENCRYPTION
   ========================================================== */

function walletStorageKey(){

  return "sav_wallet_"+state.user.uid+"_"+state.network;
}

function pinKey(){

  return "sav_pin_"+state.user.uid;
}

async function deriveKey(pin,salt){

  const enc=new TextEncoder();

  const material=
    await crypto.subtle.importKey(
      "raw",
      enc.encode(pin),
      "PBKDF2",
      false,
      ["deriveKey"]
    );

  return crypto.subtle.deriveKey(

    {
      name:"PBKDF2",
      salt:salt,
      iterations:250000,
      hash:"SHA-256"
    },

    material,

    {
      name:"AES-GCM",
      length:256
    },

    false,

    ["encrypt","decrypt"]
  );
}


function bytesToB64(bytes){

  let binary="";

  bytes.forEach(b=>{
    binary+=String.fromCharCode(b);
  });

  return btoa(binary);
}


function b64ToBytes(str){

  const binary=atob(str);

  const arr=new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){
    arr[i]=binary.charCodeAt(i);
  }

  return arr;
}


async function encryptWallet(data,pin){

  const salt=crypto.getRandomValues(new Uint8Array(16));

  const iv=crypto.getRandomValues(new Uint8Array(12));

  const key=await deriveKey(pin,salt);

  const plain=new TextEncoder().encode(
    JSON.stringify(data)
  );

  const encrypted=
    await crypto.subtle.encrypt(
      {name:"AES-GCM",iv},
      key,
      plain
    );

  return {

    salt:bytesToB64(salt),

    iv:bytesToB64(iv),

    data:bytesToB64(new Uint8Array(encrypted))
  };
}


async function decryptWallet(record,pin){

  const salt=b64ToBytes(record.salt);
  const iv=b64ToBytes(record.iv);
  const data=b64ToBytes(record.data);

  const key=await deriveKey(pin,salt);

  const decrypted=
    await crypto.subtle.decrypt(
      {name:"AES-GCM",iv},
      key,
      data
    );

  const text=
    new TextDecoder().decode(decrypted);

  return JSON.parse(text);
}

function updatePinDots(){

  const dots=
    document.querySelectorAll(".pin-dot");

  dots.forEach((dot,i)=>{
    dot.classList.toggle(
      "on",
      i<enteredPin.length
    );
  });

async function pinEnter(){

  if(enteredPin.length!==6) return;

  try{

    const record=
      localStorage.getItem(pinKey());

    if(!record){

      hidePin();

      return;
    }

    const parsed=JSON.parse(record);

    await decryptWallet(parsed,enteredPin);

    state.pin=enteredPin;

    hidePin();

    await loadLocalWallet();

    refreshWallet();

  }catch(e){

    enteredPin="";

    updatePinDots();

    $("pinError").textContent=
      "Неверный PIN";
  }
}


/* ==========================================================
   LOCAL WALLET
   ========================================================== */

async function saveWalletLocal(){

  if(!state.pin || !state.keyPair || !state.tonAddress){
    return;
  }

  const secretHex=
    Array.from(state.keyPair.secretKey)
      .map(x=>x.toString(16).padStart(2,"0"))
      .join("");

  const publicHex=
    Array.from(state.keyPair.publicKey)
      .map(x=>x.toString(16).padStart(2,"0"))
      .join("");

  const record=await encryptWallet({

    secretHex,

    publicHex,

    address:state.tonAddress

  },state.pin);

  localStorage.setItem(
    walletStorageKey(),
    JSON.stringify(record)
  );

  localStorage.setItem(
    pinKey(),
    localStorage.getItem(walletStorageKey())
  );
}


async function loadLocalWallet(){

  if(!state.user) return false;

  const raw=
    localStorage.getItem(walletStorageKey());

  if(!raw){

    state.tonAddress=null;
    state.keyPair=null;

    return false;
  }

  /*
    Если PIN уже есть в памяти,
    сразу расшифровываем.
  */

  if(!state.pin){

    return false;
  }

  try{

    const record=JSON.parse(raw);

    const data=
      await decryptWallet(record,state.pin);

    if(!data.secretHex){

      throw new Error("No secret key");
    }

    const TONCRYPTO=
      window.TON_ENGINE.getCrypto();

    if(!TONCRYPTO){

      return false;
    }

    const secretKey=
      new Uint8Array(
        data.secretHex.match(/.{1,2}/g)
          .map(x=>parseInt(x,16))
      );

    const publicKey=
      new Uint8Array(
        data.publicHex.match(/.{1,2}/g)
          .map(x=>parseInt(x,16))
      );

    state.keyPair={
      secretKey,
      publicKey
    };

    state.tonAddress=data.address;

    return true;

  }catch(e){

    console.error("Wallet decrypt error",e);

    return false;
  }
}

async function ensureTON(){

  if(window.TON_ENGINE.isReady()){
    state.sdkReady=true;
    return true;
  }

  const ok=
    await window.TON_ENGINE.load();

  state.sdkReady=ok;

  if(!ok){

    openModal("TON не загружен",`

      <div class="warn-box">

        Браузер не смог загрузить криптографическую
        библиотеку TON.

      </div>

      <div class="info-box">

        Попробуйте обновить страницу.
        Если ошибка повторяется, возможно браузер
        или сеть блокирует CDN.

      </div>

      <button class="primary"
              onclick="location.reload()">
        Обновить страницу
      </button>

    `);

    return false;
  }

  return true;
}


async function createWallet(){

  if(!state.user){

    showError("Сначала войдите в аккаунт.");

    return;
  }

  if(state.tonAddress){

    showToast("Кошелёк уже создан.");

    return;
  }

  const ok=await ensureTON();

  if(!ok) return;

  try{

    showToast("Создаём TON-кошелёк…");

    const cryptoLib=
      window.TON_ENGINE.getCrypto();

    if(!cryptoLib){

      throw new Error("Crypto library unavailable");
    }

    const mnemonic=
      await cryptoLib.mnemonicNew(24);

    const keyPair=
      await cryptoLib.mnemonicToPrivateKey(mnemonic);

    state.keyPair=keyPair;

    const TON=
      window.TON_ENGINE.getTON();

    const wallet=
      TON.WalletContractV5R1.create({
        workchain:0,
        publicKey:keyPair.publicKey
      });

    state.wallet=wallet;

    state.tonAddress=
      wallet.address.toString({
        bounceable:false,
        testOnly:state.network==="testnet"
      });

    /*
      Первый PIN:
      если его ещё нет — просим создать.
    */

    if(!localStorage.getItem(pinKey())){

      await showCreatePin();

    }

    if(!state.pin){

      showToast("Создание отменено");

      return;
    }

    await saveWalletLocal();

    await db.ref(
      "users/"+state.user.uid+"/wallet"
    ).set({

      address:state.tonAddress,

      network:state.network,

      walletVersion:"V5R1",

      createdAt:firebase.database.ServerValue.TIMESTAMP

    });

    renderApp();

    showSeed(mnemonic);

    await refreshWallet();

  }catch(e){

    console.error(e);

    openModal("Ошибка создания кошелька",`

      <div class="error">
        ${escapeHtml(e.message || "Неизвестная ошибка")}
      </div>

      <div class="info-box">
        Ключи не были отправлены в Firebase.
      </div>

      <button class="primary"
              onclick="closeModal()">
        Закрыть
      </button>

    `);
  }
}

/* ==========================================================
   REFRESH TON
   ========================================================== */

async function refreshWallet(){

  if(!state.tonAddress){

    updateWalletUI();

    return;
  }

  const endpoint=
    state.network==="testnet"
      ? "https://testnet.toncenter.com/api/v2/getAddressBalance?address="
      : "https://toncenter.com/api/v2/getAddressBalance?address=";

  try{

    const response=
      await fetch(
        endpoint+
        encodeURIComponent(state.tonAddress)
      );

    if(!response.ok){

      throw new Error("TON API HTTP "+response.status);
    }

    const data=await response.json();

    if(data.ok){

      const nano=BigInt(data.result || "0");

      state.tonBalance=
        Number(nano)/1e9;

    }else{

      throw new Error("TON API returned error");
    }

  }catch(e){

    console.warn("Balance error",e);

    state.tonBalance=0;
  }

  updateWalletUI();
}

async function sendTON(){

  if(!state.tonAddress){

    showToast("Кошелёк не создан.");

    return;
  }

  if(!state.keyPair){

    showToast("Кошелёк заблокирован.");

    showPin();

    return;
  }

  const to=
    $("sendAddress")?.value.trim();

  const amount=
    Number($("sendAmount")?.value);

  const comment=
    $("sendComment")?.value.trim() || "";

  if(!to){

    showToast("Введите адрес получателя.");

    return;
  }

  if(!Number.isFinite(amount) || amount<=0){

    showToast("Введите корректную сумму.");

    return;
  }

  if(amount>=state.tonBalance){

    showToast("Недостаточно TON.");

    return;
  }

  const ok=
    confirm(
      `Отправить ${amount} TON на ${shortAddress(to)}?`
    );

  if(!ok) return;

  try{

    if(!(await ensureTON())) return;

    const TON=
      window.TON_ENGINE.getTON();

    const client=
      new TON.TonClient({

        endpoint:
          state.network==="testnet"
            ? "https://testnet.toncenter.com/api/v2/jsonRPC"
            : "https://toncenter.com/api/v2/jsonRPC"

      });

    const wallet=
      TON.WalletContractV5R1.create({

        workchain:0,

        publicKey:state.keyPair.publicKey

      });

    const contract=
      client.open(wallet);

    const seqno=
      await contract.getSeqno();

    const msg=
      TON.internal({

        to:to,

        value:String(amount),

        body:comment || undefined

      });

    const transfer=
      await contract.createTransfer({

        seqno,

        secretKey:state.keyPair.secretKey,

        messages:[msg]

      });

    const boc=
      transfer.toBoc().toString("base64");

    const result=
      await fetch(

        (state.network==="testnet"
          ? "https://testnet.toncenter.com/api/v2/sendBoc"
          : "https://toncenter.com/api/v2/sendBoc"),

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            boc
          })

        }

      );

    const json=await result.json();

    if(!json.ok){

      throw new Error(
        json.error ||
        "TON Center отклонил транзакцию"
      );
    }

    showToast("Транзакция отправлена");

    $("sendAddress").value="";
    $("sendAmount").value="";
    $("sendComment").value="";

    await new Promise(r=>setTimeout(r,2500));

    await refreshWallet();

  }catch(e){

    console.error(e);

    showError(
      e.message ||
      "Не удалось отправить TON."
    );
  }
}

async function loadHistory(){

  const list=$("historyList");

  if(!list) return;

  list.innerHTML=`

    <div class="asset">
      Загрузка…
    </div>

  `;

  try{

    const base=
      state.network==="testnet"
        ? "https://testnet.toncenter.com/api/v2/getTransactions"
        : "https://toncenter.com/api/v2/getTransactions";

    const url=
      base+
      "?address="+
      encodeURIComponent(state.tonAddress)+
      "&limit=10";

    const response=
      await fetch(url);

    const data=
      await response.json();

    if(!data.ok){

      throw new Error(
        data.error || "Ошибка истории"
      );
    }

    const txs=data.result || [];

    if(!txs.length){

      list.innerHTML=`

        <div class="info-box">
          Транзакций пока нет.
        </div>

      `;

      return;
    }

    list.innerHTML=
      txs.map(tx=>{

        const hash=
          tx.transaction_id?.hash ||
          "transaction";

        return `

          <div class="asset">

            <div class="asset-logo">
              ${SVG.history}
            </div>

            <div class="asset-main">

              <div class="asset-name">
                Транзакция
              </div>

              <div class="asset-address">
                ${escapeHtml(
                  String(hash).slice(0,16)
                )}…
              </div>

            </div>

          </div>

        `;

      }).join("");

  }catch(e){

    console.error(e);

    list.innerHTML=`

      <div class="error">
        Не удалось загрузить историю.
      </div>

    `;
  }
}

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

    showToast("Скопировано");

  }catch(e){

    const area=
      document.createElement("textarea");

    area.value=text;

    document.body.appendChild(area);

    area.select();

    document.execCommand("copy");

    area.remove();

    showToast("Скопировано");
  }
}


/* ==========================================================
   LOGOUT
   ========================================================== */

async function logout(){

  const yes=
    confirm("Выйти из аккаунта?");

  if(!yes) return;

  state.keyPair=null;
  state.pin="";

  sessionStorage.clear();

  await auth.signOut();

  state.profile=null;

  renderAuth();
}


/* ==========================================================
   INIT
   ========================================================== */

renderAuth();
