<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>YouTube 2016 — Client</title>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    font-family: Arial, Roboto, Helvetica, sans-serif;
    background: #f1f1f1;
    color: #333;
    font-size: 13px;
}


/* =========================================
   HEADER
========================================= */

header {
    height: 50px;
    background: #fff;
    border-bottom: 1px solid #ddd;

    display: flex;
    align-items: center;

    padding: 0 16px;

    position: sticky;
    top: 0;

    z-index: 2000;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;

    flex-shrink: 0;
}


/* MENU */

.menu-button {
    width: 34px;
    height: 34px;

    border: 0;
    background: transparent;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 3000;
}

.menu-button:hover {
    background: #eee;
}

.menu-icon {
    width: 22px;
    height: 22px;
    fill: #555;
}


/* YOUTUBE LOGO */

.logo-container {
    display: flex;
    align-items: center;

    text-decoration: none;

    cursor: pointer;
}

.youtube-logo {
    width: 110px;
    height: 32px;

    object-fit: contain;

    display: block;
}


/* SEARCH */

.search-box {
    display: flex;

    flex: 1;

    max-width: 610px;

    margin: 0 auto;

    height: 32px;
}

.search-box input {
    flex: 1;

    min-width: 0;

    height: 32px;

    padding: 0 10px;

    border: 1px solid #ccc;

    border-radius: 2px 0 0 2px;

    background: #fff;

    color: #333;

    font-size: 13px;

    outline: none;
}

.search-box input:focus {
    border-color: #167ac6;
}

.search-box button {
    width: 64px;
    height: 32px;

    border: 1px solid #ccc;
    border-left: none;

    background: #f8f8f8;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.search-box button:hover {
    background: #eee;
}

.search-icon {
    width: 17px;
    height: 17px;

    fill: #555;
}


/* GOOGLE LOGIN */

.google-login {
    margin-left: 10px;

    height: 32px;

    border: 1px solid #ccc;

    background: #fff;

    color: #444;

    padding: 0 12px;

    cursor: pointer;

    white-space: nowrap;

    font-size: 12px;
}

.google-login:hover {
    background: #f5f5f5;
}


/* =========================================
   LAYOUT
========================================= */

.layout {
    display: flex;

    max-width: 1400px;

    margin: 0 auto;
}


/* =========================================
   SIDEBAR
========================================= */

aside {
    width: 180px;

    flex-shrink: 0;

    background: #fff;

    border-right: 1px solid #ddd;

    min-height: calc(100vh - 50px);

    padding-top: 8px;

    transition: width .2s ease;

    z-index: 1500;
}

aside.collapsed {
    width: 58px;
}

aside.collapsed .nav-text,
aside.collapsed .sidebar-title {
    display: none;
}

aside.collapsed .nav-item {
    justify-content: center;

    padding-left: 0;
    padding-right: 0;
}

.sidebar-title {
    padding: 12px 14px 6px;

    color: #999;

    font-size: 10px;

    font-weight: bold;

    text-transform: uppercase;
}

.nav-item {
    min-height: 38px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 9px 14px;

    color: #444;

    text-decoration: none;

    font-size: 12px;

    cursor: pointer;

    border-left: 3px solid transparent;

    transition: background .15s;
}

.nav-item:hover {
    background: #f5f5f5;
}

.nav-item.active {
    background: #e9e9e9;

    border-left-color: #cc181e;

    color: #222;

    font-weight: bold;
}

.nav-item svg {
    width: 18px;
    height: 18px;

    fill: #666;

    flex-shrink: 0;
}

.nav-item.active svg {
    fill: #cc181e;
}


/* =========================================
   MAIN
========================================= */

main {
    flex: 1;

    min-width: 0;

    padding: 18px;
}

.page-title {
    font-size: 18px;

    font-weight: normal;

    color: #222;
}

.page-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 14px;
}

.search-info {
    color: #999;

    font-size: 11px;
}


/* =========================================
   VIDEO GRID
========================================= */

.video-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(190px, 1fr));

    gap: 18px 14px;
}

.video-card {
    background: transparent;

    cursor: pointer;

    min-width: 0;

    transition: transform .12s ease;
}

.video-card:hover {
    transform: translateY(-2px);
}

.thumbnail-wrapper {
    position: relative;

    width: 100%;

    background: #ddd;

    overflow: hidden;
}

.video-card img {
    display: block;

    width: 100%;

    aspect-ratio: 16 / 9;

    object-fit: cover;
}

.video-info {
    padding-top: 7px;
}

.video-card .title {
    font-size: 13px;

    font-weight: bold;

    color: #333;

    line-height: 1.3;

    min-height: 34px;

    max-height: 34px;

    overflow: hidden;

    margin-bottom: 4px;
}

.video-card:hover .title {
    color: #167ac6;
}

.video-card .meta {
    font-size: 11px;

    color: #777;

    line-height: 1.5;
}

.video-card .channel {
    color: #555;
}

.video-card .date {
    color: #999;
}


/* =========================================
   CHANNEL CARD
========================================= */

.channel-card {
    background: #fff;

    border: 1px solid #ddd;

    padding: 14px;

    cursor: pointer;

    grid-column: 1 / -1;

    display: flex;

    align-items: center;

    gap: 18px;
}

.channel-card:hover {
    background: #fafafa;
}

.channel-avatar {
    width: 90px;
    height: 90px;

    border-radius: 50%;

    object-fit: cover;

    background: #ddd;

    flex-shrink: 0;
}

.channel-card-title {
    font-size: 18px;

    color: #222;

    margin-bottom: 7px;
}

.channel-card-description {
    color: #777;

    line-height: 1.5;

    max-width: 700px;
}


/* =========================================
   CHANNEL PAGE
========================================= */

#channel-page {
    display: none;
}

.channel-header {
    background: #fff;

    border: 1px solid #ddd;

    padding: 20px;

    display: flex;

    align-items: center;

    gap: 22px;

    margin-bottom: 20px;
}

.channel-big-avatar {
    width: 110px;
    height: 110px;

    border-radius: 50%;

    object-fit: cover;

    background: #ddd;

    flex-shrink: 0;
}

.channel-name {
    font-size: 23px;

    font-weight: normal;

    margin-bottom: 8px;

    color: #222;
}

.channel-stats {
    color: #999;

    margin-bottom: 12px;
}

.channel-description {
    color: #666;

    line-height: 1.6;

    white-space: pre-line;
}

.channel-videos-title {
    font-size: 18px;

    font-weight: normal;

    margin-bottom: 14px;

    color: #222;
}


/* =========================================
   WATCH
========================================= */

#watch-page {
    display: none;
}

.back-btn {
    display: inline-flex;

    align-items: center;

    gap: 5px;

    margin-bottom: 12px;

    color: #167ac6;

    cursor: pointer;

    text-decoration: none;

    font-weight: bold;
}

.back-btn:hover {
    text-decoration: underline;
}

.watch-container {
    background: #fff;

    border: 1px solid #ddd;

    padding: 14px;
}

.player-box {
    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;

    overflow: hidden;
}

.player-box iframe {
    width: 100%;
    height: 100%;

    border: none;
}

.video-title {
    font-size: 18px;

    font-weight: normal;

    line-height: 1.35;

    color: #222;

    margin: 13px 0 9px;
}

.video-stats {
    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    border-bottom: 1px solid #ddd;

    padding-bottom: 10px;

    color: #777;

    font-size: 11px;
}

.stats-left {
    display: flex;

    flex-direction: column;

    gap: 4px;
}

.like-dislike-container {
    display: flex;

    flex-direction: column;

    align-items: flex-end;

    gap: 5px;
}

.likes-count {
    display: flex;

    align-items: center;

    gap: 14px;
}

.like-btn,
.dislike-btn {
    display: flex;

    align-items: center;

    gap: 4px;

    color: #666;
}

.like-btn svg,
.dislike-btn svg {
    width: 15px;
    height: 15px;

    fill: #666;
}

.like-dislike-bar {
    width: 150px;

    height: 3px;

    background: #ddd;
}

.like-fill {
    height: 100%;

    background: #167ac6;

    width: 50%;
}


/* =========================================
   ACTIONS
========================================= */

.video-actions {
    display: flex;

    gap: 8px;

    padding: 10px 0;

    border-bottom: 1px solid #ddd;
}

.action-btn {
    border: 1px solid #ccc;

    background: #f8f8f8;

    color: #555;

    padding: 7px 12px;

    cursor: pointer;

    font-size: 11px;
}

.action-btn:hover {
    background: #eee;
}

.action-btn.active {
    color: #cc181e;
}


/* =========================================
   DESCRIPTION
========================================= */

.description {
    padding: 14px 0;

    font-size: 12px;

    line-height: 1.6;

    color: #555;

    white-space: pre-line;
}

.description-title {
    font-weight: bold;

    color: #333;

    margin-bottom: 5px;
}


/* =========================================
   LOADING
========================================= */

.loading {
    min-height: 180px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: #888;
}

.spinner {
    width: 28px;
    height: 28px;

    border: 3px solid #ddd;

    border-top-color: #cc181e;

    border-radius: 50%;

    animation: spin .8s linear infinite;

    margin-bottom: 12px;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================
   MESSAGE
========================================= */

.message-box {
    background: #fff;

    border: 1px solid #ddd;

    padding: 40px 25px;

    text-align: center;

    color: #777;

    grid-column: 1 / -1;
}

.message-box strong {
    display: block;

    color: #444;

    font-size: 18px;

    margin-bottom: 10px;
}

.error-box {
    border-left: 4px solid #cc181e;
}


/* =========================================
   TOAST
========================================= */

.toast {
    position: fixed;

    left: 50%;

    bottom: 25px;

    transform:
        translateX(-50%)
        translateY(20px);

    background: #333;

    color: #fff;

    padding: 10px 18px;

    font-size: 12px;

    opacity: 0;

    pointer-events: none;

    transition: all .25s;

    z-index: 5000;
}

.toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

    header {
        padding: 0 8px;
    }

    .header-left {
        gap: 5px;
    }

    .youtube-logo {
        width: 91px;
    }

    .search-box {
        margin-left: 6px;
    }

    .google-login {
        display: none;
    }

    aside {
        position: fixed;

        left: 0;

        top: 50px;

        bottom: 0;

        width: 180px;

        z-index: 1900;

        transform: translateX(-100%);

        transition: transform .2s ease;

        box-shadow:
            3px 0 10px rgba(0,0,0,.12);
    }

    aside.mobile-open {
        transform: translateX(0);
    }

    main {
        width: 100%;

        padding: 12px;
    }

    .video-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 15px 10px;
    }

    .channel-header {
        align-items: flex-start;

        flex-direction: column;
    }

    .channel-big-avatar {
        width: 90px;
        height: 90px;
    }

    .channel-name {
        font-size: 19px;
    }

    .video-title {
        font-size: 16px;
    }

}

@media (max-width: 480px) {

    .search-box button {
        width: 45px;
    }

    .search-box input {
        font-size: 12px;
    }

    .video-grid {
        grid-template-columns: 1fr;
    }

    .video-card .title {
        max-height: 34px;
    }

    .watch-container {
        padding: 8px;
    }

    .video-actions {
        flex-wrap: wrap;
    }

    .channel-card {
        align-items: flex-start;

        flex-direction: column;
    }

}

</style>
</head>

let currentVideoId = null;

let currentVideoUrl = '';

let currentChannelId = null;

let googleAccessToken = null;

   ELEMENTS

/* =========================================

========================================= */

menuButton.addEventListener(
    'click',
    function(event) {

        event.preventDefault();

        event.stopPropagation();


        if (window.innerWidth <= 800) {

            sidebar.classList.toggle(
                'mobile-open'
            );

        } else {

            sidebar.classList.toggle(
                'collapsed'
            );

        }

    }
);


/* =========================================
   CLOSE MOBILE MENU
========================================= */

document.addEventListener(
    'click',
    function(event) {

        if (window.innerWidth > 800) {
            return;
        }


        if (
            !sidebar.contains(event.target) &&
            !menuButton.contains(event.target)
        ) {

            sidebar.classList.remove(
                'mobile-open'
            );

        }

    }
);

   SEARCH BUTTON
========================================= */

    .getElementById('searchButton')
    .addEventListener(
        'click',
        searchEverything
    );


/* =========================================
   ENTER
========================================= */

queryInput.addEventListener(

        }

    }
);


/* =========================================
   GOOGLE LOGIN
========================================= */

googleLoginButton.addEventListener(
    'click',
    startGoogleLogin
);


function startGoogleLogin() {

    if (
        typeof google === 'undefined' ||
        !google.accounts
    ) {

        showMessage(
            'Google ещё загружается. Попробуйте через несколько секунд.'
        );

        return;

    }


    if (!googleTokenClient) {

        googleTokenClient =
            google.accounts.oauth2.initTokenClient({

                client_id:
                    GOOGLE_CLIENT_ID,

                scope:
                    'https://www.googleapis.com/auth/youtube.readonly',

                callback:
                    function(response) {

                        if (
                            response &&
                            response.access_token
                        ) {

                            googleAccessToken =
                                response.access_token;

                            localStorage.setItem(
                                'yt2016_google_token',
                                googleAccessToken
                            );

                            googleLoginButton.textContent =
                                'Google подключён';

                            showMessage(
                                'Google аккаунт подключён'
                            );

                        }

                    }

            });

    }


    googleTokenClient.requestAccessToken({
        prompt: 'consent'
    });

}


/* =========================================
   CHECK GOOGLE TOKEN
========================================= */

function loadGoogleToken() {

    try {

        const token =
            localStorage.getItem(
                'yt2016_google_token'
            );

        if (token) {

            googleAccessToken =
                token;

            googleLoginButton.textContent =
                'Google подключён';

        }

    }

    catch (error) {}

}


/* =========================================
   SEARCH EVERYTHING
========================================= */

async function searchEverything() {

    const q =
        queryInput.value.trim();


    if (!q) {

        showHome();

        return;

    }


    /*
        Если пользователь вставил
        прямую ссылку YouTube.
    */

    const videoId =
        extractVideoId(q);


    if (videoId) {

        await openVideoFromId(
            videoId
        );

        return;

    }


    const channelId =
        extractChannelId(q);


    if (channelId) {

        openChannel(channelId);

        return;

    }


    showLoading(grid);


    document.getElementById(
        'searchInfo'
    ).textContent =
        'Поиск: ' + q;


    try {

        /*
            Ищем видео.
            Только 2016 год.
        */

        const videoUrl =
            API_URL +
            'search?part=snippet' +
            '&type=video' +
            '&maxResults=24' +
            '&order=relevance' +
            '&publishedAfter=' +
            encodeURIComponent(
                YEAR_START
            ) +
            '&publishedBefore=' +
            encodeURIComponent(
                YEAR_END
            ) +
            '&q=' +
            encodeURIComponent(q) +
            '&key=' +
            encodeURIComponent(API_KEY);


        /*
            Отдельно ищем каналы.
        */

        const channelUrl =
            API_URL +
            'search?part=snippet' +
            '&type=channel' +
            '&maxResults=8' +
            '&q=' +
            encodeURIComponent(q) +
            '&key=' +
            encodeURIComponent(API_KEY);


        const [
            videoResponse,
            channelResponse
        ] =
            await Promise.all([
                fetch(videoUrl),
                fetch(channelUrl)
            ]);


        const videoData =
            await videoResponse.json();


        const channelData =
            await channelResponse.json();


        if (
            videoData.error ||
            channelData.error
        ) {

            throw new Error(
                videoData.error?.message ||
                channelData.error?.message ||
                'Ошибка YouTube API'
            );

        }


        const videos =
            videoData.items || [];

        const channels =
            channelData.items || [];


        renderSearchResults(
            videos,
            channels
        );

    }

    catch (error) {

        console.error(error);

        showError(
            grid,
            error.message
        );

    }

}


/* =========================================
   SEARCH RESULTS
========================================= */

function renderSearchResults(
    videos,
    channels
) {

    showPage('home');


    grid.innerHTML = '';


    if (
        !videos.length &&
        !channels.length
    ) {

        showEmpty(grid);

        return;

    }


    /*
        Сначала каналы.
    */

    channels.forEach(
        channel => {

            const id =
                channel.id.channelId;

            if (!id) {
                return;
            }


            const snippet =
                channel.snippet;


            const card =
                document.createElement(
                    'article'
                );


            card.className =
                'channel-card';


            const avatar =
                snippet.thumbnails?.medium?.url ||
                snippet.thumbnails?.default?.url ||
                '';


            card.innerHTML = `

                <img
                    class="channel-avatar"
                    src="${escapeHTML(avatar)}"
                    alt=""
                >

                <div>

                    <div class="channel-card-title">
                        ${escapeHTML(snippet.title)}
                    </div>

                    <div class="channel-card-description">
                        ${escapeHTML(
                            snippet.description ||
                            'Канал YouTube'
                        )}
                    </div>

                </div>

            `;


            card.addEventListener(
                'click',
                function() {

                    openChannel(id);

                }
            );


            grid.appendChild(card);

        }
    );


    /*
        Затем видео.
    */

    videos.forEach(
        item => {

            addVideoCard(
                grid,
                item
            );

        }
    );

}


/* =========================================
   VIDEO CARD
========================================= */

function addVideoCard(
    target,
    item
) {

    if (
        !item.id ||
        !item.id.videoId
    ) {

        return;

    }


    const id =
        item.id.videoId;


    const snippet =
        item.snippet;


    const card =
        document.createElement(
            'article'
        );


    card.className =
        'video-card';


    const thumbnail =
        snippet.thumbnails?.medium?.url ||
        snippet.thumbnails?.high?.url ||
        '';


    card.innerHTML = `

        <div class="thumbnail-wrapper">

            <img
                src="${escapeHTML(thumbnail)}"
                alt=""
                loading="lazy"
            >

        </div>

        <div class="video-info">

            <div class="title">
                ${escapeHTML(snippet.title)}
            </div>

            <div class="meta">

                <div class="channel">
                    ${escapeHTML(
                        snippet.channelTitle
                    )}
                </div>

                <div class="date">
                    ${formatDate(
                        snippet.publishedAt
                    )}
                </div>

            </div>

        </div>

    `;


    card.addEventListener(
        'click',
        function() {

            openVideo(
                id,
                snippet.title,
                snippet.description,
                snippet.publishedAt
            );

        }
    );


    target.appendChild(card);

}


/* =========================================
   OPEN CHANNEL
========================================= */

async function openChannel(
    channelId
) {

    if (!channelId) {
        return;
    }


    previousPage =
        getCurrentPage();


    currentChannelId =
        channelId;


    showPage('channel');


    document.getElementById(
        'channel-header'
    ).innerHTML = `

        <div class="loading">
            <div class="spinner"></div>
            Загрузка канала...
        </div>

    `;


    channelGrid.innerHTML = '';


    try {

        /*
            Данные канала.
        */

        const channelUrl =
            API_URL +
            'channels?part=snippet,statistics' +
            '&id=' +
            encodeURIComponent(channelId) +
            '&key=' +
            encodeURIComponent(API_KEY);


        /*
            ВАЖНО:

            Видео канала ограничиваем
            именно 2016 годом.
        */

        const videosUrl =
            API_URL +
            'search?part=snippet' +
            '&type=video' +
            '&channelId=' +
            encodeURIComponent(channelId) +
            '&maxResults=50' +
            '&order=date' +
            '&publishedAfter=' +
            encodeURIComponent(
                YEAR_START
            ) +
            '&publishedBefore=' +
            encodeURIComponent(
                YEAR_END
            ) +
            '&key=' +
            encodeURIComponent(API_KEY);


        const [
            channelResponse,
            videosResponse
        ] =
            await Promise.all([
                fetch(channelUrl),
                fetch(videosUrl)
            ]);


        const channelData =
            await channelResponse.json();


        const videosData =
            await videosResponse.json();


        if (
            channelData.error ||
            videosData.error
        ) {

            throw new Error(
                channelData.error?.message ||
                videosData.error?.message ||
                'Ошибка загрузки канала'
            );

        }


        if (
            !channelData.items ||
            !channelData.items.length
        ) {

            throw new Error(
                'Канал не найден'
            );

        }


        const channel =
            channelData.items[0];


        const snippet =
            channel.snippet;


        const statistics =
            channel.statistics || {};


        const avatar =
            snippet.thumbnails?.high?.url ||
            snippet.thumbnails?.medium?.url ||
            snippet.thumbnails?.default?.url ||
            '';


        const subscribers =
            Number(
                statistics.subscriberCount || 0
            );


        const videoCount =
            Number(
                statistics.videoCount || 0
            );


        document.getElementById(
            'channel-header'
        ).innerHTML = `

            <img
                class="channel-big-avatar"
                src="${escapeHTML(avatar)}"
                alt=""
            >

            <div>

                <h1 class="channel-name">
                    ${escapeHTML(
                        snippet.title
                    )}
                </h1>

                <div class="channel-stats">

                    ${subscribers.toLocaleString(
                        'ru-RU'
                    )}
                    подписчиков

                    ·

                    ${videoCount.toLocaleString(
                        'ru-RU'
                    )}
                    видео

                </div>

                <div class="channel-description">
                    ${escapeHTML(
                        snippet.description ||
                        'Описание отсутствует.'
                    )}
                </div>

            </div>

        `;


        channelGrid.innerHTML = '';


        const videos =
            videosData.items || [];


        if (!videos.length) {

            channelGrid.innerHTML = `

                <div class="message-box">

                    <strong>
                        Видео за 2016 год не найдены
                    </strong>

                    Этот клиент показывает
                    только материалы 2016 года.

                </div>

            `;

            updateUrl(
                '#channel/' + channelId
            );

            return;

        }


        videos.forEach(
            item => {

                addVideoCard(
                    channelGrid,
                    item
                );

            }
        );


        updateUrl(
            '#channel/' + channelId
        );


        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            'channel-header'
        ).innerHTML = `

            <div class="message-box error-box">

                <strong>
                    Не удалось загрузить канал
                </strong>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================================
   OPEN VIDEO
========================================= */

async function openVideo(
    id,
    title,
    description = '',
    publishedAt = ''
) {

    /*
        Дополнительная защита:
        если видео не 2016 года,
        не открываем его.
    */

    if (
        publishedAt &&
        !is2016(publishedAt)
    ) {

        showMessage(
            'Этот клиент показывает только видео 2016 года.'
        );

        return;

    }


    currentVideoId =
        id;


    currentVideoUrl =
        'https://www.youtube.com/watch?v=' +
        id;


    previousPage =
        getCurrentPage();


    showPage('watch');


    document.getElementById(
        'v-title'
    ).textContent =
        title;


    document.getElementById(
        'v-description'
    ).textContent =
        description ||
        'Описание отсутствует.';


    document.getElementById(
        'v-date'
    ).textContent =
        formatDate(publishedAt);


    const holder =
        document.getElementById(
            'player-holder'
        );


    holder.innerHTML = `

        <iframe

            src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0"

            title="${escapeHTML(title)}"

            allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share
            "

            allowfullscreen>

        </iframe>

    `;


    document.getElementById(
        'v-views'
    ).textContent =
        'Загрузка статистики...';


    document.getElementById(
        'v-likes'
    ).textContent =
        '--';


    document.getElementById(
        'v-dislikes'
    ).textContent =
        '--';


    document.getElementById(
        'like-rate'
    ).style.width =
        '50%';


    addToHistory({

        id: id,

        title: title,

        thumbnail:
            'https://i.ytimg.com/vi/' +
            id +
            '/mqdefault.jpg'

    });


    /*
        Запоминаем первое просмотренное видео.

        Именно после него главная
        начинает показывать рекомендации.
    */

    try {

        const watched =
            JSON.parse(
                localStorage.getItem(
                    'yt2016_watched'
                ) || '[]'
            );


        const exists =
            watched.some(
                item =>
                    item.id === id
            );


        if (!exists) {

            watched.unshift({

                id: id,

                title: title

            });

        }


        localStorage.setItem(
            'yt2016_watched',
            JSON.stringify(
                watched.slice(0, 20)
            )
        );

    }

    catch (error) {}


    updateUrl(
        '#watch/' + id
    );


    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });


    await fetchVideoStatistics(
        id
    );

}


/* =========================================
   OPEN VIDEO BY ID
========================================= */

async function openVideoFromId(
    id
) {

    try {

        const url =
            API_URL +
            'videos?part=snippet,statistics' +
            '&id=' +
            encodeURIComponent(id) +
            '&key=' +
            encodeURIComponent(API_KEY);


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (
            !response.ok ||
            data.error
        ) {

            throw new Error(
                data.error?.message ||
                'Видео не найдено'
            );

        }


        if (
            !data.items ||
            !data.items.length
        ) {

            throw new Error(
                'Видео не найдено'
            );

        }


        const video =
            data.items[0];


        const snippet =
            video.snippet;


        if (!is2016(
            snippet.publishedAt
        )) {

            showMessage(
                'Это видео не из 2016 года.'
            );

            return;

        }


        openVideo(
            id,
            snippet.title,
            snippet.description,
            snippet.publishedAt
        );

    }

    catch (error) {

        showMessage(
            error.message
        );

    }

}


/* =========================================
   STATISTICS
========================================= */

async function fetchVideoStatistics(
    id
) {

    try {

        const url =
            API_URL +
            'videos?part=statistics' +
            '&id=' +
            encodeURIComponent(id) +
            '&key=' +
            encodeURIComponent(API_KEY);


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (
            response.ok &&
            data.items &&
            data.items.length
        ) {

            const statistics =
                data.items[0].statistics;


            const views =
                Number(
                    statistics.viewCount || 0
                );


            const likes =
                Number(
                    statistics.likeCount || 0
                );


            document.getElementById(
                'v-views'
            ).textContent =

                views.toLocaleString(
                    'ru-RU'
                ) +

                ' просмотров';


            document.getElementById(
                'v-likes'
            ).textContent =

                likes.toLocaleString(
                    'ru-RU'
                );

        }

    }

    catch (error) {

        document.getElementById(
            'v-views'
        ).textContent =
            'Статистика недоступна';

    }


    /*
        Return YouTube Dislike.
    */

    try {

        const response =
            await fetch(
                'https://returnyoutubedislikeapi.com/votes?videoId=' +
                encodeURIComponent(id)
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        const likes =
            Number(
                data.likes || 0
            );


        const dislikes =
            Number(
                data.dislikes || 0
            );


        document.getElementById(
            'v-likes'
        ).textContent =

            likes.toLocaleString(
                'ru-RU'
            );


        document.getElementById(
            'v-dislikes'
        ).textContent =

            dislikes.toLocaleString(
                'ru-RU'
            );


        const total =
            likes + dislikes;


        const percent =
            total > 0
                ? likes / total * 100
                : 50;


        document.getElementById(
            'like-rate'
        ).style.width =
            percent + '%';

    }

    catch (error) {

        console.log(
            'Дизлайки недоступны'
        );

    }

}

/* =========================================
   RECOMMENDATIONS
========================================= */

async function loadRecommendations() {

    const watched =
        getWatched();


    /*
        Пока пользователь ничего
        не посмотрел.
    */

    if (!watched.length) {

        document.getElementById(
            'homeTitle'
        ).textContent =
            'Рекомендованные видео';


        document.getElementById(
            'searchInfo'
        ).textContent = '';


        grid.innerHTML = `

            <div class="message-box">

                <strong>
                    Пока мы вас ничего не знаем
                </strong>

                Посмотрите любое видео,
                чтобы мы могли подобрать
                для вас рекомендации.

                <br><br>

                Просто воспользуйтесь поиском
                сверху.

            </div>

        `;

        return;

    }


    /*
        Берём последнее просмотренное
        видео и ищем похожее.

        Всё равно ограничиваем 2016 годом.
    */

    const last =
        watched[0];


    showLoading(
        grid
    );


    document.getElementById(
        'homeTitle'
    ).textContent =
        'Рекомендованные видео';


    try {

        const url =
            API_URL +
            'search?part=snippet' +
            '&type=video' +
            '&maxResults=24' +
            '&order=relevance' +
            '&publishedAfter=' +
            encodeURIComponent(
                YEAR_START
            ) +
            '&publishedBefore=' +
            encodeURIComponent(
                YEAR_END
            ) +
            '&q=' +
            encodeURIComponent(
                last.title
            ) +
            '&key=' +
            encodeURIComponent(
                API_KEY
            );


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (
            !response.ok ||
            data.error
        ) {

            throw new Error(
                data.error?.message ||
                'Ошибка рекомендаций'
            );

        }


        let items =
            data.items || [];


        /*
            Не показываем то самое видео,
            которое пользователь уже смотрел.
        */

        items =
            items.filter(
                item =>
                    item.id?.videoId !==
                    last.id
            );


        grid.innerHTML = '';


        if (!items.length) {

            grid.innerHTML = `

                <div class="message-box">

                    <strong>
                        Пока мало рекомендаций
                    </strong>

                    Попробуйте посмотреть ещё
                    одно видео 2016 года.

                </div>

            `;

            return;

        }


        items.forEach(
            item => {

                addVideoCard(
                    grid,
                    item
                );

            }
        );

    }

    catch (error) {

        showError(
            grid,
            error.message
        );

    }

}

async function showMyChannel() {

    if (!googleAccessToken) {

        showMessage(
            'Сначала войдите через Google.'
        );

        return;

    }


    try {

        const response =
            await fetch(
                API_URL +
                'channels?part=snippet,statistics&mine=true',
                {

                    headers: {

                        Authorization:
                            'Bearer ' +
                            googleAccessToken

                    }

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            data.error
        ) {

            throw new Error(
                data.error?.message ||
                'Не удалось получить канал'
            );

        }


        if (
            !data.items ||
            !data.items.length
        ) {

            showMessage(
                'У этого Google аккаунта нет YouTube-канала.'
            );

            return;

        }


        openChannel(
            data.items[0].id
        );

    }

    catch (error) {

        showMessage(
            error.message
        );

    }

}


/* =========================================
   HISTORY
========================================= */

function showHistory() {

    showPage(
        'home'
    );


    document.getElementById(
        'homeTitle'
    ).textContent =
        'История';


    document.getElementById(
        'searchInfo'
    ).textContent = '';


    const history =
        getHistory();


    grid.innerHTML = '';


    if (!history.length) {

        grid.innerHTML = `

            <div class="message-box">

                <strong>
                    История пуста
                </strong>

                Здесь появятся видео,
                которые вы открывали.

            </div>

        `;

        return;

    }


    history.forEach(
        item => {

            addVideoCard(
                grid,
                {

                    id: {

                        videoId:
                            item.id

                    },

                    snippet: {

                        title:
                            item.title,

                        channelTitle:
                            'История просмотра',

                        publishedAt:
                            '',

                        thumbnails: {

                            medium: {

                                url:
                                    item.thumbnail

                            }

                        }

                    }

                }
            );

        }
    );

}


/* =========================================

function likeVideo() {

/* =========================================
   SHARE
========================================= */

async function shareVideo() {

    if (!currentVideoUrl) {
        return;
    }


    if (navigator.share) {

        try {

            await navigator.share({

                title:
                    document.getElementById(
                        'v-title'
                    ).textContent,

                url:
                    currentVideoUrl

            });

        }

        catch (error) {}

        return;

    }


    copyVideoLink();

}


/* =========================================
   COPY
========================================= */

async function copyVideoLink() {

    if (!currentVideoUrl) {
        return;
    }


    try {

        await navigator.clipboard.writeText(
            currentVideoUrl
        );


        showMessage(
            'Ссылка скопирована'
        );

    }

    catch (error) {

        showMessage(
            currentVideoUrl
        );

    }

}


/* =========================================
   PAGE SWITCH
========================================= */

function showPage(
    page
) {

    document.getElementById(
        'home-page'
    ).style.display =
        page === 'home'
            ? 'block'
            : 'none';


    document.getElementById(
        'watch-page'
    ).style.display =
        page === 'watch'
            ? 'block'
            : 'none';


    document.getElementById(
        'channel-page'
    ).style.display =
        page === 'channel'
            ? 'block'
            : 'none';


    if (page !== 'watch') {

        document.getElementById(
            'player-holder'
        ).innerHTML = '';

    }


    if (window.innerWidth <= 800) {

        sidebar.classList.remove(
            'mobile-open'
        );

    }


    setActiveNav(
        page
    );

}


/* =========================================
   ACTIVE NAV
========================================= */

function setActiveNav(
    page
) {

    document
        .querySelectorAll(
            '.nav-item'
        )
        .forEach(
            item => {

                item.classList.remove(
                    'active'
                );

            }
        );


    if (page === 'home') {

        document
            .querySelector(
                '.nav-item[data-page="home"]'
            )
            ?.classList.add(
                'active'
            );

    }

}

/* =========================================
   READ URL
========================================= */

async function openFromHash() {

    const hash =
        location.hash;


    if (
        hash.startsWith(
            '#watch/'
        )
    ) {

        const id =
            hash.substring(
                '#watch/'.length
            );


        if (id) {

            await openVideoFromId(
                id
            );

            return;

        }

    }


    if (
        hash.startsWith(
            '#channel/'
        )
    ) {

        const id =
            hash.substring(
                '#channel/'.length
            );


        if (id) {

            openChannel(
                id
            );

            return;

        }

    }


    showHome();

}

/* =========================================
   HISTORY STORAGE
========================================= */

function getHistory() {

    try {

        return JSON.parse(
            localStorage.getItem(
                'youtube2016_history'
            )
        ) || [];

    }

    catch (error) {

        return [];

    }

}


function addToHistory(
    video
) {

    let history =
        getHistory();


    history =
        history.filter(
            item =>
                item.id !==
                video.id
        );


    history.unshift(
        video
    );


    history =
        history.slice(
            0,
            50
        );


    localStorage.setItem(
        'youtube2016_history',
        JSON.stringify(
            history
        )
    );

}

/* =========================================
   DATE
========================================= */

function formatDate(
    date
) {

    if (!date) {
        return '';
    }


    const d =
        new Date(
            date
        );


    if (
        Number.isNaN(
            d.getTime()
        )
    ) {

        return '';

    }


    return d.toLocaleDateString(
        'ru-RU',
        {

            day:
                '2-digit',

            month:
                '2-digit',

            year:
                'numeric'

        }
    );

}


/* =========================================
   IS 2016
========================================= */

function is2016(
    date
) {

    if (!date) {
        return false;
    }


    const d =
        new Date(
            date
        );


    return (
        !Number.isNaN(
            d.getTime()
        ) &&
        d >= new Date(
            YEAR_START
        ) &&
        d < new Date(
            YEAR_END
        )
    );

}


/* =========================================
   VIDEO URL
========================================= */

function extractVideoId(
    value
) {

    try {

        const url =
            new URL(
                value
            );


        if (
            url.hostname.includes(
                'youtube.com'
            )
        ) {

            if (
                url.pathname ===
                '/watch'
            ) {

                return url.searchParams.get(
                    'v'
                );

            }


            if (
                url.pathname.startsWith(
                    '/shorts/'
                )
            ) {

                return url.pathname
                    .split('/')[2];

            }

        }


        if (
            url.hostname ===
            'youtu.be'
        ) {

            return url.pathname
                .substring(1);

        }

    }

    catch (error) {}


    return null;

}


/* =========================================
   CHANNEL URL
========================================= */

function extractChannelId(
    value
) {

    try {

        const url =
            new URL(
                value
            );


        if (
            !url.hostname.includes(
                'youtube.com'
            )
        ) {

            return null;

        }


        const parts =
            url.pathname
                .split('/')
                .filter(Boolean);


        if (
            parts[0] ===
            'channel' &&
            parts[1]
        ) {

            return parts[1];

        }

    }

    catch (error) {}


    return null;

}

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
    value
) {

    return String(
        value || ''
    )
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );

}
