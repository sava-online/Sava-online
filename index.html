<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форум любителей Савелия</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #dbe2ed; color: #222222; font-size: 13px; padding-bottom: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #e5ebf2; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); min-height: 100vh; }
        .header { background: #536f96; color: #ffffff; padding: 12px; border-bottom: 2px solid #364e70; text-align: center; }
        .logo-title { font-size: 18px; font-weight: bold; }
        
        /* Меню */
        details.main-menu { background: #d8e0ec; border-bottom: 1px solid #b3c0d2; }
        details.main-menu summary { padding: 10px; font-weight: bold; color: #2b3e55; cursor: pointer; list-style: none; background: #f0f3f8; border-bottom: 1px solid #c2cede; display: flex; align-items: center; }
        details.main-menu summary::-webkit-details-marker { display: none; }
        .menu-list { list-style: none; background: #ffffff; }
        .menu-list li { border-bottom: 1px solid #e1e7f0; }
        .menu-list button { display: flex; align-items: center; width: 100%; text-align: left; padding: 10px; color: #1a4f8b; font-weight: bold; font-size: 13px; background: none; border: none; cursor: pointer; }
        .menu-svg { width: 18px; height: 18px; fill: #536f96; margin-right: 10px; }
        
        /* Блоки */
        .category { margin: 8px; border: 1px solid #8ba0bd; background: #ffffff; }
        .category-header { background: #728bb0; color: #ffffff; font-weight: bold; font-size: 12px; padding: 8px; text-transform: uppercase; }
        
        .forum-item { padding: 10px; border-bottom: 1px solid #e1e7f0; display: flex; align-items: flex-start; }
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 10px; border: 1px solid #c2cede; background: #f0f3f8; }
        .forum-details { flex-grow: 1; overflow: hidden; }
        .forum-title { color: #1a4f8b; font-weight: bold; font-size: 14px; cursor: pointer; }
        .forum-desc { color: #222; font-size: 12px; margin-top: 4px; word-wrap: break-word; }
        .forum-desc img { max-width: 100%; max-height: 200px; border-radius: 4px; margin-top: 5px; display: block; }
        .forum-meta { background: #f4f6f9; border: 1px dashed #d0d7e0; padding: 4px; font-size: 10px; color: #666; margin-top: 4px; }
        
        /* Формы и кнопки */
        .post-box { padding: 10px; background: #f8fafc; }
        .post-textarea { width: 100%; height: 60px; border: 1px solid #b2c1d4; padding: 8px; font-size: 12px; margin-bottom: 8px; }
        .btn { background: #3b5b8c; color: #fff; border: 1px solid #2a4369; padding: 8px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-light { background: #eef3f8; color: #2b3e55; border: 1px solid #a8b8cc; }
        .input-text { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #b2c1d4; }
        
        /* Галерея */
        .gallery-grid { display: flex; flex-wrap: wrap; gap: 5px; padding: 5px; }
        .gallery-grid img { width: calc(50% - 5px); height: 120px; object-fit: cover; border: 1px solid #ccc; }

        .hidden { display: none !important; }
        .page { display: none; }
        .active-page { display: block; }
        
        .add-friend-btn { font-size: 10px; background: #4a7c59; color: #fff; border: none; padding: 2px 6px; margin-left: 5px; cursor: pointer; border-radius: 2px; }
    </style>
    
    <!-- Подключаем старую версию Firebase (v8), которая работает на старых браузерах (ES5) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="logo-title">Форум Савелия</div>
    </header>

    <details class="main-menu" id="mainMenu">
        <summary>
            <svg class="menu-svg" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            Главное меню
        </summary>
        <ul class="menu-list">
            <li id="navLogin"><button onclick="goPage('auth')"><svg class="menu-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Вход / Регистрация</button></li>
            <li><button onclick="goPage('main')"><svg class="menu-svg" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>Главная беседа</button></li>
            <li><button onclick="goPage('gallery')"><svg class="menu-svg" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>Галерея</button></li>
            <li id="navFriends" class="hidden"><button onclick="goPage('friends')"><svg class="menu-svg" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Друзья и ЛС</button></li>
            <li id="navSettings" class="hidden"><button onclick="goPage('settings')"><svg class="menu-svg" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 C9.7,21.59,9.9,21.76,10.14,21.76h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>Настройки</button></li>
            <li id="navLogout" class="hidden"><button onclick="doLogout()">Выход</button></li>
        </ul>
    </details>

    <!-- 1. АВТОРИЗАЦИЯ -->
    <div id="page-auth" class="page">
        <div class="category">
            <div class="category-header">Вход / Регистрация</div>
            <div class="post-box">
                <input type="email" id="authEmail" class="input-text" placeholder="Email">
                <input type="password" id="authPass" class="input-text" placeholder="Пароль">
                <input type="text" id="authName" class="input-text" placeholder="Имя (Только для регистрации)">
                
                <div style="font-size: 11px; margin-bottom: 5px;">Аватарка (Для регистрации, необязательно):</div>
                <input type="file" id="authAvatar" accept="image/*" class="input-text">

                <div id="authStatus" style="color:red; font-size:11px; margin-bottom:10px;"></div>
                
                <button class="btn" onclick="doLogin()">Войти</button>
                <button class="btn btn-light" onclick="doRegister()">Создать аккаунт</button>
            </div>
        </div>
    </div>

    <!-- 2. ГЛАВНАЯ (БЕСЕДА) -->
    <div id="page-main" class="page active-page">
        <div class="category">
            <div class="category-header">Флудилка <span id="syncStatus">...</span></div>
            <div id="postsList"></div>
        </div>
        
        <div class="category" id="postFormSection" style="display:none;">
            <div class="category-header">Написать</div>
            <div class="post-box">
                <textarea id="postText" class="post-textarea" placeholder="Текст сообщения..."></textarea>
                <input type="file" id="postImg" accept="image/*" style="display:none;">
                <button class="btn btn-light" onclick="document.getElementById('postImg').click()">Прикрепить фото</button>
                <button class="btn" id="sendBtn" onclick="sendPost()">Отправить</button>
                <div id="postStatus" style="font-size: 11px; color: green; margin-top:5px;"></div>
            </div>
        </div>
    </div>

    <!-- 3. ГАЛЕРЕЯ -->
    <div id="page-gallery" class="page">
        <div class="category">
            <div class="category-header">Галерея пользователей</div>
            <div class="gallery-grid" id="galleryList"></div>
        </div>
    </div>

    <!-- 4. НАСТРОЙКИ (СМЕНА ИМЕНИ И АВАТАРА) -->
    <div id="page-settings" class="page">
        <div class="category">
            <div class="category-header">Мой Профиль</div>
            <div class="post-box">
                <img id="setAvPreview" class="avatar-img" src="" style="width: 80px; height: 80px; display:block; margin-bottom:10px;">
                <div style="font-size: 11px;">Новое имя:</div>
                <input type="text" id="setNewName" class="input-text">
                
                <div style="font-size: 11px;">Новая аватарка:</div>
                <input type="file" id="setNewAvatar" accept="image/*" class="input-text">
                
                <button class="btn" onclick="saveSettings()">Сохранить настройки</button>
                <div id="setSync" style="font-size: 11px; color: green; margin-top:5px;"></div>
            </div>
        </div>
    </div>

    <!-- 5. ДРУЗЬЯ И ЛС -->
    <div id="page-friends" class="page">
        <div class="category">
            <div class="category-header">Мои Друзья</div>
            <div id="friendsList"></div>
        </div>
    </div>

    <!-- 6. ЧАТ С ДРУГОМ -->
    <div id="page-chat" class="page">
        <div class="category">
            <div class="category-header">Диалог: <span id="chatTitle">...</span></div>
            <div id="chatMessages" style="max-height: 300px; overflow-y: auto;"></div>
            <div class="post-box">
                <textarea id="chatInput" class="post-textarea" placeholder="Сообщение..."></textarea>
                <button class="btn" onclick="sendPrivateMsg()">Отправить ЛС</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- НАСТРОЙКА FIREBASE ---
    var firebaseConfig = {
        apiKey: "AIzaSyCsU2eJ2aF5oj4uWFbyy0Ez0mekT_At4vU",
        authDomain: "sava-online.firebaseapp.com",
        databaseURL: "https://sava-online-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "sava-online",
        storageBucket: "sava-online.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var db = firebase.database();
    var IMGBB_KEY = "fa3d56b9fb97bfbbe162c367ace448d1";

    var myUid = null;
    var allUsers = {}; // Кэш пользователей для быстрого отображения имен и аватарок
    var currentChatUser = null;

    // --- НАВИГАЦИЯ (SPA) ---
    function goPage(pageId) {
        var pages = document.querySelectorAll('.page');
        for (var i = 0; i < pages.length; i++) {
            pages[i].classList.remove('active-page');
        }
        document.getElementById('page-' + pageId).classList.add('active-page');
        document.getElementById('mainMenu').removeAttribute('open');
    }

    // --- РЕГИСТРАЦИЯ И ВХОД ---
    auth.onAuthStateChanged(function(user) {
        if (user) {
            myUid = user.uid;
            document.getElementById('navLogin').classList.add('hidden');
            document.getElementById('navLogout').classList.remove('hidden');
            document.getElementById('navSettings').classList.remove('hidden');
            document.getElementById('navFriends').classList.remove('hidden');
            document.getElementById('postFormSection').style.display = 'block';
            
            // Загрузка данных пользователя для страницы настроек
            db.ref('users/' + myUid).on('value', function(snap) {
                var uData = snap.val();
                if(uData) {
                    document.getElementById('setNewName').value = uData.name || '';
                    document.getElementById('setAvPreview').src = uData.avatar || 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
                }
            });
            goPage('main');
        } else {
            myUid = null;
            document.getElementById('navLogin').classList.remove('hidden');
            document.getElementById('navLogout').classList.add('hidden');
            document.getElementById('navSettings').classList.add('hidden');
            document.getElementById('navFriends').classList.add('hidden');
            document.getElementById('postFormSection').style.display = 'none';
        }
    });

    // Функция загрузки картинки на ImgBB через старый добрый XMLHttpRequest (работает на ВСЕХ телефонах)
    function uploadToImgbb(file, callback) {
        var xhr = new XMLHttpRequest();
        var formData = new FormData();
        formData.append("image", file);
        
        xhr.open("POST", "https://api.imgbb.com/1/upload?key=" + IMGBB_KEY, true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                var response = JSON.parse(xhr.responseText);
                callback(response.data.url);
            } else {
                callback(null);
            }
        };
        xhr.onerror = function() { callback(null); };
        xhr.send(formData);
    }

    function doRegister() {
        var email = document.getElementById('authEmail').value;
        var pass = document.getElementById('authPass').value;
        var name = document.getElementById('authName').value || 'Новичок';
        var avFile = document.getElementById('authAvatar').files[0];
        var status = document.getElementById('authStatus');

        status.innerText = "Регистрация...";
        
        auth.createUserWithEmailAndPassword(email, pass).then(function(userCred) {
            var uid = userCred.user.uid;
            if (avFile) {
                status.innerText = "Грузим аватарку...";
                uploadToImgbb(avFile, function(url) {
                    db.ref('users/' + uid).set({ name: name, avatar: url || '' });
                });
            } else {
                db.ref('users/' + uid).set({ name: name, avatar: '' });
            }
        }).catch(function(error) {
            status.innerText = "Ошибка: " + error.message;
        });
    }

    function doLogin() {
        var email = document.getElementById('authEmail').value;
        var pass = document.getElementById('authPass').value;
        document.getElementById('authStatus').innerText = "Вход...";
        auth.signInWithEmailAndPassword(email, pass).catch(function(error) {
            document.getElementById('authStatus').innerText = "Ошибка входа!";
        });
    }

    function doLogout() {
        auth.signOut();
        goPage('auth');
    }

    // --- СЛУШАТЕЛЬ ВСЕХ ПОЛЬЗОВАТЕЛЕЙ (КЭШ ДЛЯ ОТОБРАЖЕНИЯ) ---
    db.ref('users').on('value', function(snap) {
        allUsers = snap.val() || {};
        renderFriendsList();
    });

    // --- ГЛАВНАЯ БЕСЕДА И ГАЛЕРЕЯ ---
    db.ref('posts').on('value', function(snap) {
        document.getElementById('syncStatus').innerText = "(Синхронизировано)";
        var data = snap.val();
        var html = "";
        var galHtml = "";
        
        if (data) {
            var posts = [];
            for (var key in data) {
                var p = data[key];
                p.id = key;
                posts.push(p);
            }
            posts.sort(function(a, b) { return a.timestamp - b.timestamp; });

            for (var i = 0; i < posts.length; i++) {
                var post = posts[i];
                var authorData = allUsers[post.uid] || { name: 'Гость', avatar: '' };
                var d = new Date(post.timestamp);
                var time = d.getHours() + ':' + (d.getMinutes()<10?'0':'') + d.getMinutes();
                var avImg = authorData.avatar ? authorData.avatar : 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
                
                // Кнопка добавления в друзья (если это не я)
                var addFriendBtn = "";
                if (myUid && myUid !== post.uid) {
                    addFriendBtn = '<button class="add-friend-btn" onclick="addFriend(\'' + post.uid + '\')">В друзья</button>';
                }

                html += '<div class="forum-item">' +
                        '<img src="' + avImg + '" class="avatar-img">' +
                        '<div class="forum-details">' +
                        '<div class="forum-title">' + authorData.name + addFriendBtn + '</div>' +
                        '<div class="forum-desc">' + post.text.replace(/\n/g, '<br>');
                
                if (post.img) {
                    html += '<img src="' + post.img + '">';
                    galHtml += '<img src="' + post.img + '">';
                }
                
                html += '</div><div class="forum-meta">' + d.toLocaleDateString() + ' ' + time + '</div>' +
                        '</div></div>';
            }
        }
        
        var pl = document.getElementById('postsList');
        pl.innerHTML = html || '<div style="padding:10px;">Нет сообщений</div>';
        pl.scrollTop = pl.scrollHeight; // Прокрутка вниз
        
        document.getElementById('galleryList').innerHTML = galHtml || '<div style="padding:10px;">Нет фото</div>';
    });

    function sendPost() {
        var text = document.getElementById('postText').value;
        var file = document.getElementById('postImg').files[0];
        var status = document.getElementById('postStatus');
        
        if (!text && !file) return;
        status.innerText = "Загрузка...";
        document.getElementById('sendBtn').disabled = true;

        var savePost = function(imgUrl) {
            db.ref('posts').push({
                uid: myUid,
                text: text,
                img: imgUrl,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }, function() {
                document.getElementById('postText').value = '';
                document.getElementById('postImg').value = '';
                status.innerText = "";
                document.getElementById('sendBtn').disabled = false;
            });
        };

        if (file) {
            uploadToImgbb(file, savePost);
        } else {
            savePost("");
        }
    }

    // --- НАСТРОЙКИ ПРОФИЛЯ ---
    function saveSettings() {
        var newName = document.getElementById('setNewName').value;
        var file = document.getElementById('setNewAvatar').files[0];
        var status = document.getElementById('setSync');
        
        status.innerText = "Сохранение...";
        
        if (file) {
            uploadToImgbb(file, function(url) {
                if (url) {
                    db.ref('users/' + myUid).update({ name: newName, avatar: url }, function() {
                        status.innerText = "Готово!";
                    });
                } else {
                    status.innerText = "Ошибка загрузки фото";
                }
            });
        } else {
            db.ref('users/' + myUid).update({ name: newName }, function() {
                status.innerText = "Готово!";
            });
        }
    }

    // --- ДРУЗЬЯ И ЛИЧНЫЕ СООБЩЕНИЯ ---
    function addFriend(friendUid) {
        if (!myUid) return alert("Войдите в аккаунт");
        db.ref('users/' + myUid + '/friends/' + friendUid).set(true, function() {
            alert("Пользователь добавлен в список друзей!");
        });
    }

    function renderFriendsList() {
        if (!myUid || !allUsers[myUid]) return;
        var myFriends = allUsers[myUid].friends || {};
        var html = "";
        
        for (var fUid in myFriends) {
            var fData = allUsers[fUid];
            if (fData) {
                var avImg = fData.avatar ? fData.avatar : 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
                html += '<div class="forum-item" style="cursor:pointer;" onclick="openChat(\'' + fUid + '\', \'' + fData.name + '\')">' +
                        '<img src="' + avImg + '" class="avatar-img">' +
                        '<div class="forum-details"><div class="forum-title" style="margin-top:10px;">' + fData.name + ' (Написать ЛС)</div></div>' +
                        '</div>';
            }
        }
        document.getElementById('friendsList').innerHTML = html || '<div style="padding:10px;">Список друзей пуст. Нажмите "В друзья" в главной беседе.</div>';
    }

    var chatRef = null;
    function openChat(targetUid, targetName) {
        currentChatUser = targetUid;
        document.getElementById('chatTitle').innerText = targetName;
        goPage('chat');
        
        // Создаем уникальный ID чата для двоих (сортируем ID по алфавиту)
        var chatId = (myUid < targetUid) ? (myUid + "_" + targetUid) : (targetUid + "_" + myUid);
        
        // Отключаем старый слушатель, если был
        if (chatRef) chatRef.off();
        
        chatRef = db.ref('messages/' + chatId);
        chatRef.on('value', function(snap) {
            var data = snap.val();
            var html = "";
            if (data) {
                var msgs = [];
                for (var k in data) msgs.push(data[k]);
                msgs.sort(function(a, b) { return a.timestamp - b.timestamp; });
                
                for (var i = 0; i < msgs.length; i++) {
                    var m = msgs[i];
                    var uData = allUsers[m.uid] || {name: '?'};
                    var color = m.uid === myUid ? '#eef3f8' : '#ffffff';
                    html += '<div style="padding:8px; margin:5px; background:' + color + '; border:1px solid #c2cede; border-radius:4px;">' +
                            '<b>' + uData.name + ':</b> ' + m.text + '</div>';
                }
            }
            var cm = document.getElementById('chatMessages');
            cm.innerHTML = html || '<div style="padding:10px;">Нет сообщений</div>';
            cm.scrollTop = cm.scrollHeight;
        });
    }

    function sendPrivateMsg() {
        var text = document.getElementById('chatInput').value;
        if (!text || !currentChatUser) return;
        
        var chatId = (myUid < currentChatUser) ? (myUid + "_" + currentChatUser) : (currentChatUser + "_" + myUid);
        
        db.ref('messages/' + chatId).push({
            uid: myUid,
            text: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        }, function() {
            document.getElementById('chatInput').value = '';
        });
    }
</script>

</body>
</html>
