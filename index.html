/*
========================================================

 SAVCOMPAY 2.0
 ONE FILE VERSION

 Firebase:
 - регистрация
 - вход
 - подтверждение email

 Crypto:
 - TON
 - USDT Jetton
 - Testnet

 ВАЖНО:
 Seed-фразу намеренно не сохраняем в Firebase.
 Реальный signer/подпись добавляется отдельно.

========================================================
*/


/* =====================================================
   FIREBASE
===================================================== */


/*
  ВСТАВЬ СЮДА СВОЙ CONFIG ИЗ FIREBASE
*/

const firebaseConfig = {

    apiKey:
        "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.appspot.com",

    messagingSenderId:
        "YOUR_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


/*
  Firebase SDK загружается отдельно.
*/

let firebaseReady = false;

let auth = null;
let db = null;

let createUserWithEmailAndPassword;
let signInWithEmailAndPassword;
let sendEmailVerification;
let reload;
let signOut;
let initializeApp;
let getAuth;
let getFirestore;
let doc;
let setDoc;


async function loadFirebase(){

    try{

        const firebase =
            await import(
                "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"
            );

        const firebaseAuth =
            await import(
                "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"
            );

        const firestore =
            await import(
                "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"
            );


        initializeApp =
            firebase.initializeApp;

        getAuth =
            firebaseAuth.getAuth;

        createUserWithEmailAndPassword =
            firebaseAuth.createUserWithEmailAndPassword;

        signInWithEmailAndPassword =
            firebaseAuth.signInWithEmailAndPassword;

        sendEmailVerification =
            firebaseAuth.sendEmailVerification;

        reload =
            firebaseAuth.reload;

        signOut =
            firebaseAuth.signOut;


        getFirestore =
            firestore.getFirestore;

        doc =
            firestore.doc;

        setDoc =
            firestore.setDoc;


        const app =
            initializeApp(firebaseConfig);


        auth =
            getAuth(app);

        db =
            getFirestore(app);


        firebaseReady = true;

    }
    catch(error){

        console.error(
            "Firebase error:",
            error
        );

    }

}

/* =====================================================
   LOCAL PIN
===================================================== */

const PIN_KEY =
    "savcompay_pin_hash";


async function hashPIN(pin){

    const data =
        new TextEncoder()
            .encode(pin);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array
        .from(
            new Uint8Array(hash)
        )
        .map(
            x =>
                x.toString(16)
                 .padStart(2,"0")
        )
        .join("");

}


async function savePIN(pin){

    const hash =
        await hashPIN(pin);

    localStorage.setItem(
        PIN_KEY,
        hash
    );

}


async function verifyPIN(pin){

    const saved =
        localStorage.getItem(
            PIN_KEY
        );

    if(!saved)
        return false;

    const hash =
        await hashPIN(pin);

    return hash === saved;

}

function loginScreen(){

    root.innerHTML = `

                    S

                    SavcomPay

                        Войти

                </div>

            </div>

        </div>

    `;


    let register =
        false;


    document
        .getElementById(
            "loginTab"
        )
        .onclick = () => {

            register = false;

            document
                .getElementById(
                    "loginTab"
                )
                .classList
                .add("active");

            document
                .getElementById(
                    "registerTab"
                )
                .classList
                .remove("active");

            document
                .getElementById(
                    "authButton"
                )
                .textContent =
                "Войти";

        };


    document
        .getElementById(
            "registerTab"
        )
        .onclick = () => {

            register = true;

            document
                .getElementById(
                    "registerTab"
                )
                .classList
                .add("active");

            document
                .getElementById(
                    "loginTab"
                )
                .classList
                .remove("active");

            document
                .getElementById(
                    "authButton"
                )
                .textContent =
                "Создать аккаунт";

        };


    document
        .getElementById(
            "authButton"
        )
        .onclick =
        async () => {

            if(!firebaseReady){

                showAuthMessage(
                    "Firebase ещё не загрузился. Проверь Firebase Config.",
                    "error"
                );

                return;
            }


            const email =
                document
                    .getElementById(
                        "email"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            try{

                if(register){

                    const result =
                        await
                        createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    await
                    sendEmailVerification(
                        result.user
                    );


                    await
                    setDoc(
                        doc(
                            db,
                            "users",
                            result.user.uid
                        ),
                        {

                            email:
                                email,

                            createdAt:
                                Date.now(),

                            savcomId:
                                "SC-" +
                                result.user.uid
                                    .slice(0,8)
                                    .toUpperCase()

                        }
                    );


                    showAuthMessage(
                        "Аккаунт создан. Проверь email и перейди по ссылке подтверждения.",
                        "success"
                    );


                }else{

                    const result =
                        await
                        signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    await
                    reload(
                        result.user
                    );


                    if(
                        !auth.currentUser
                            .emailVerified
                    ){

                        showAuthMessage(
                            "Email ещё не подтверждён.",
                            "warning"
                        );

                        return;
                    }


                    pinScreen();

                }

            }
            catch(error){

                console.error(error);

                showAuthMessage(
                    error.message,
                    "error"
                );

            }

        };

}


function showAuthMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "authMessage"
        );

    if(!box)
        return;

    box.innerHTML = `
        <div class="${type}">
            ${text}
        </div>
    `;

}

    document
        .getElementById(
            "pinButton"
        )
        .onclick =
        async () => {

            const pin =
                document
                    .getElementById(
                        "pin"
                    )
                    .value;


            if(!/^\d{6}$/.test(pin)){

                document
                    .getElementById(
                        "pinMessage"
                    )
                    .textContent =
                    "PIN должен содержать ровно 6 цифр.";

                return;
            }


            const existing =
                localStorage.getItem(
                    PIN_KEY
                );


            if(!existing){

                await savePIN(pin);

                walletScreen();

                return;
            }


            if(
                await verifyPIN(pin)
            ){

                walletScreen();

            }else{

                document
                    .getElementById(
                        "pinMessage"
                    )
                    .innerHTML =
                    `
                    <div class="error">
                        Неверный PIN.
                    </div>
                    `;

            }

        };

}

                return;
            }

            await navigator
                .clipboard
                .writeText(
                    walletAddress
                );

            alert(
                "Адрес скопирован."
            );

        };


    document
        .getElementById(
            "copyUsdt"
        )
        .onclick =
        async () => {

            await navigator
                .clipboard
                .writeText(
                    USDT_MASTER
                );

            alert(
                "USDT master contract скопирован."
            );

        };


    document
        .getElementById(
            "sendButton"
        )
        .onclick =
        sendModal;


    document
        .getElementById(
            "receiveButton"
        )
        .onclick =
        receiveModal;


    /*
      Пытаемся получить данные кошелька,
      если адрес уже был создан.
    */

    loadTONData();

}


/* =====================================================
   TON DATA
===================================================== */

async function loadTONData(){

    /*
      На этом этапе реальный адрес signer ещё
      намеренно не генерируем.

      Здесь будет подключён WalletKit.
    */

    if(!walletAddress){

        document
            .getElementById(
                "walletAddress"
            )
            .textContent =
            "Создайте или импортируйте TON-кошелёк";

    }

}


/* =====================================================
   RECEIVE
===================================================== */

function receiveModal(){

    const address =
        walletAddress ||
        "TON-кошелёк ещё не создан";


    modal(`
    
        <h2>
            Получить
        </h2>


        <p>
            Передай отправителю этот TON-адрес.
        </p>


        <div class="address">

            <div class="address-text">
                ${address}
            </div>

        </div>


        <br>


        <div class="warning">

            USDT в SavcomPay будет использовать
            официальный Jetton USDT на TON.

        </div>


        <button
            class="close"
            id="closeModal"
        >
            Закрыть
        </button>

    `);

}


/* =====================================================
   SEND
===================================================== */

function sendModal(){

    modal(`

        <h2>
            Отправить
        </h2>


        <select
            id="sendAsset"
            class="input"
        >

            <option value="TON">
                TON
            </option>

            <option value="USDT">
                USDT
            </option>

        </select>


        <input
            id="sendTo"
            class="input"
            placeholder="TON-адрес получателя"
        >


        <input
            id="sendAmount"
            class="input"
            type="number"
            step="any"
            placeholder="Количество"
        >


        <button
            class="primary"
            id="continueSend"
        >
            Продолжить
        </button>


        <button
            class="close"
            id="closeModal"
        >
            Отмена
        </button>

    `);


    document
        .getElementById(
            "continueSend"
        )
        .onclick =
        () => {

            const asset =
                document
                    .getElementById(
                        "sendAsset"
                    )
                    .value;


            const address =
                document
                    .getElementById(
                        "sendTo"
                    )
                    .value
                    .trim();


            const amount =
                document
                    .getElementById(
                        "sendAmount"
                    )
                    .value;


            if(!address){

                alert(
                    "Введите адрес получателя."
                );

                return;
            }


            if(!amount || Number(amount) <= 0){

                alert(
                    "Введите количество."
                );

                return;
            }


            /*
              Здесь будет реальная WalletKit
              transaction preview + PIN +
              подпись.

              Для Jetton USDT используется
              USDT_MASTER.
            */

            alert(
                "Транзакция " +
                asset +
                " будет подписана после подключения TON signer."
            );

        };

}


/* =====================================================
   MODAL
===================================================== */

function modal(content){

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "modal";


    element.id =
        "modal";


    element.innerHTML = `

        <div class="modal-box">

            ${content}

        </div>

    `;


    document
        .body
        .appendChild(
            element
        );


    const close =
        document.getElementById(
            "closeModal"
        );


    if(close){

        close.onclick =
            () => {

                element.remove();

            };

    }

}

   START
===================================================== */

(async function(){

    await loadFirebase();


    if(
        firebaseReady &&
        auth.currentUser
    ){

        try{

            await reload(
                auth.currentUser
            );

            if(
                auth.currentUser.emailVerified
            ){

                pinScreen();

            }else{

                loginScreen();

            }

        }
        catch{

            loginScreen();

        }

    }else{

        loginScreen();

    }

})();

</script>
