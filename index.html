function setActiveChat(o){

    const cid=chatId(o);let first=true;

function renderChatList(){

  if(!items.length){sb.innerHTML=`<div class="empty" style="padding:32px 16px"><h3>Нет чатов</h3><p>Откройте профиль человека и нажмите «Сообщение»</p></div>`;return;}

/* ===================== ЗВОНКИ (WebRTC P2P) ===================== */
let call=null,ringCtx=null,ringTimer=null,endTimer=null;
const remoteAudio=document.createElement('audio');remoteAudio.autoplay=true;remoteAudio.setAttribute('playsinline','');document.body.appendChild(remoteAudio);

function callUI(mode,text){
  clearTimeout(endTimer);
  const o=$('callOverlay');o.classList.add('show');
  const peer=call?call.peer:null;const u=peer?U(peer):{name:'',color:'#657786'};
  if(call)call.lastText=text;
  o.innerHTML=`<div class="call-card ${mode==='in'||mode==='out'?'pulse':''}">
    <div class="call-av">${renderAvatar(u,'',110)}</div>
    <div class="call-name">${esc(u.name)}</div>
    <div class="call-status" id="callStatus">${esc(text||'')}</div>
    <div class="call-btns">
      ${mode==='in'?`<button class="call-btn red" id="cDecline" title="Отклонить">${IC.hangup}</button><button class="call-btn green" id="cAccept" title="Принять">${IC.phone}</button>`:''}
      ${mode==='out'?`<button class="call-btn red" id="cEnd" title="Отменить">${IC.hangup}</button>`:''}
      ${mode==='live'?`<button class="call-btn gray" id="cMute">${call&&call.muted?IC.micoff:IC.mic}</button><button class="call-btn red" id="cEnd" title="Завершить">${IC.hangup}</button>`:''}
    </div>
    ${mode==='live'||mode==='in'?`<div class="call-limit">Лимит разговора — 10 минут</div>`:''}</div>`;
  const b=id=>$(id);
  if(b('cAccept'))b('cAccept').onclick=acceptCall;
  if(b('cDecline'))b('cDecline').onclick=declineCall;
  if(b('cEnd'))b('cEnd').onclick=hangup;
  if(b('cMute'))b('cMute').onclick=toggleMute;
}
function setCallStatus(t){if(call)call.lastText=t;const e=$('callStatus');if(e)e.textContent=t;}
function startRing(kind){
  stopRing();
  try{
    ringCtx=new (window.AudioContext||window.webkitAudioContext)();
    const beep=()=>{if(!ringCtx)return;const o=ringCtx.createOscillator(),g=ringCtx.createGain();o.type='sine';o.frequency.value=kind==='in'?560:425;g.gain.value=.08;o.connect(g);g.connect(ringCtx.destination);o.start();o.stop(ringCtx.currentTime+.45);};
    beep();ringTimer=setInterval(beep,1600);
  }catch(e){}
}
function stopRing(){clearInterval(ringTimer);ringTimer=null;if(ringCtx){try{ringCtx.close()}catch(e){}ringCtx=null;}}

function makePC(){
  const pc=new RTCPeerConnection(RTC_CFG);
  pc.onicecandidate=e=>{if(!e.candidate||!call)return;const c=e.candidate.toJSON();if(call.candReady)sendCand(c);else call.candBuf.push(c);};
  pc.ontrack=e=>{remoteAudio.srcObject=e.streams[0];remoteAudio.play().catch(()=>{});};
  pc.onconnectionstatechange=()=>{
    if(!call||call.pc!==pc)return;
    if(pc.connectionState==='connected')onConnected();
    else if(pc.connectionState==='failed')finishCall('Соединение потеряно',{remoteState:'ended'});
  };
  call.pc=pc;return pc;
}
function sendCand(c){if(call)set(push(ref(db,`calls/${call.id}/cand/${S.uid}`)),c).catch(()=>{});}
function addRemoteCand(c){
  if(!call||!call.pc||!c)return;
  if(call.pc.remoteDescription)call.pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});else call.remoteBuf.push(c);
}
function flushRemote(){if(!call)return;call.remoteBuf.forEach(c=>call.pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{}));call.remoteBuf=[];}

function onConnected(){
  if(!call||call.startTs)return;
  stopRing();call.startTs=Date.now();callUI('live','0:00 / 10:00');
  call.iv=setInterval(()=>{
    if(!call)return;
    const el=Math.floor((Date.now()-call.startTs)/1000);
    setCallStatus(`${fmtDur(el)} / ${fmtDur(CALL_LIMIT)}`);
    if(el===CALL_LIMIT-60)toast('Осталась 1 минута разговора');
    if(el>=CALL_LIMIT)hangup('Достигнут лимит звонка — 10 минут');
  },1000);
}
function watchCall(cid){
  call.unsubs.push(onValue(ref(db,'calls/'+cid),async s=>{
    const v=s.val();if(!call||call.id!==cid||!v)return;
    if(call.role==='out'){
      if(v.state==='accepted'&&v.answer&&!call.answered){
        call.answered=true;stopRing();clearTimeout(call.ringTO);callUI('live','Соединение…');
        try{await call.pc.setRemoteDescription(v.answer);flushRemote();}catch(e){finishCall('Ошибка соединения',{remoteState:'ended'});}
      }else if(v.state==='declined'){call.reason='declined';finishCall(v.reason==='busy'?'Абонент занят':'Собеседник сбросил трубку');}
      else if(v.state==='ended')finishCall('Собеседник завершил звонок');
    }else{
      if(v.state==='cancelled'||v.state==='missed')finishCall('Пропущенный звонок');
      else if(v.state==='ended')finishCall('Собеседник завершил звонок');
    }
  }));
}
async function startCall(peer){
  if(call){toast('Вы уже в звонке');return;}
  if(isBanned(S.uid)){toast('Аккаунт заблокирован');return;}
  if((S.settings[peer]||{}).allowCalls===false){toast('Пользователь отключил звонки');return;}
  if(!navigator.mediaDevices||!window.RTCPeerConnection){toast('Звонки недоступны: нужен HTTPS и современный браузер');return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Нет доступа к микрофону');return;}
  const id=push(ref(db,'calls')).key;
  call={id,peer,role:'out',stream,unsubs:[],candBuf:[],remoteBuf:[],muted:false};
  callUI('out','Вызов…');startRing('out');
  try{
    const pc=makePC();stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    const offer=await pc.createOffer();await pc.setLocalDescription(offer);
    await set(ref(db,'calls/'+id),{from:S.uid,to:peer,state:'ringing',offer:{type:offer.type,sdp:offer.sdp},ts:Date.now()});
    await set(ref(db,`incomingCalls/${peer}/${id}`),{from:S.uid,ts:Date.now()});
    call.candReady=true;call.candBuf.forEach(sendCand);call.candBuf=[];
    watchCall(id);
    call.unsubs.push(onChildAdded(ref(db,`calls/${id}/cand/${peer}`),s=>addRemoteCand(s.val())));
    call.ringTO=setTimeout(()=>{if(call&&call.id===id&&!call.answered){call.reason='missed';finishCall('Нет ответа',{remoteState:'missed'});}},45000);
  }catch(e){console.error(e);finishCall('Не удалось позвонить. Проверьте правила базы.');}
}
async function handleIncoming(snap){
  const id=snap.key;
  let cs;try{cs=(await get(ref(db,'calls/'+id))).val();}catch(e){return;}
  if(!cs||cs.state!=='ringing'||Date.now()-cs.ts>50000){remove(snap.ref).catch(()=>{});return;}
  if(call){update(ref(db,'calls/'+id),{state:'declined',reason:'busy'}).catch(()=>{});remove(snap.ref).catch(()=>{});return;}
  if(isBanned(cs.from)||isBanned(S.uid)){remove(snap.ref).catch(()=>{});return;}
  if((S.settings[S.uid]||{}).allowCalls===false){update(ref(db,'calls/'+id),{state:'declined'}).catch(()=>{});remove(snap.ref).catch(()=>{});return;}
  call={id,peer:cs.from,role:'in',offer:cs.offer,unsubs:[],candBuf:[],remoteBuf:[],muted:false};
  callUI('in','Входящий звонок');startRing('in');watchCall(id);
  if('Notification' in window&&Notification.permission==='granted'&&document.hidden){
    try{const n=new Notification('Входящий звонок',{body:U(cs.from).name+' звонит вам в Shift Net',tag:'shiftnet-call',requireInteraction:true});n.onclick=()=>{window.focus();n.close();};}catch(e){}
  }
  call.ringTO=setTimeout(()=>{if(call&&call.id===id&&call.role==='in'&&!call.accepting)finishCall('Пропущенный звонок');},50000);
}
async function acceptCall(){
  const c=call;if(!c||c.role!=='in'||c.accepting)return;c.accepting=true;
  clearTimeout(c.ringTO);stopRing();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){toast('Нет доступа к микрофону');declineCall();return;}
  if(call!==c){stream.getTracks().forEach(t=>t.stop());return;}
  c.stream=stream;callUI('live','Соединение…');
  try{
    const pc=makePC();stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    await pc.setRemoteDescription(c.offer);flushRemote();
    const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
    c.candReady=true;c.candBuf.forEach(sendCand);c.candBuf=[];
    c.unsubs.push(onChildAdded(ref(db,`calls/${c.id}/cand/${c.peer}`),s=>addRemoteCand(s.val())));
    await update(ref(db,'calls/'+c.id),{state:'accepted',answer:{type:ans.type,sdp:ans.sdp}});
    remove(ref(db,`incomingCalls/${S.uid}/${c.id}`)).catch(()=>{});
  }catch(e){console.error(e);finishCall('Ошибка соединения',{remoteState:'ended'});}
}
function declineCall(){
  if(!call)return;
  update(ref(db,'calls/'+call.id),{state:'declined'}).catch(()=>{});
  finishCall('');
}
function hangup(msg){
  if(!call)return;
  const m=typeof msg==='string'?msg:'';
  if(call.role==='out'&&!call.answered)finishCall(m||'Звонок отменён',{remoteState:'cancelled'});
  else finishCall(m||'Звонок завершён',{remoteState:'ended'});
}
function toggleMute(){
  if(!call||!call.stream)return;call.muted=!call.muted;
  call.stream.getAudioTracks().forEach(t=>t.enabled=!call.muted);
  callUI('live',call.lastText||'');
}
function endCallSilently(){if(call)finishCall('');}
function finishCall(msg,opt){
  if(!call)return;
  const c=call;call=null;
  stopRing();clearInterval(c.iv);clearTimeout(c.ringTO);
  c.unsubs.forEach(u=>{try{u()}catch(e){}});
  try{c.pc&&c.pc.close();}catch(e){}
  if(c.stream)c.stream.getTracks().forEach(t=>t.stop());
  remoteAudio.srcObject=null;
  if(opt&&opt.remoteState)update(ref(db,'calls/'+c.id),{state:opt.remoteState,endedBy:S.uid}).catch(()=>{});
  remove(ref(db,`incomingCalls/${c.role==='in'?S.uid:c.peer}/${c.id}`)).catch(()=>{});
  if(c.role==='out'&&S.uid){
    const dur=c.startTs?Math.round((Date.now()-c.startTs)/1000):0;
    const txt=dur?`Звонок · ${fmtDur(dur)}`:(c.reason==='declined'?'Звонок отклонён':(opt&&opt.remoteState==='cancelled'?'Звонок отменён':'Пропущенный звонок'));
    sendMessage(c.peer,{type:'call',text:txt}).catch(()=>{});
    setTimeout(()=>remove(ref(db,'calls/'+c.id)).catch(()=>{}),6000);
  }
  const o=$('callOverlay');
  if(!msg){o.classList.remove('show');o.innerHTML='';return;}
  const u=U(c.peer);
  o.classList.add('show');
  o.innerHTML=`<div class="call-card"><div class="call-av">${renderAvatar(u,'',110)}</div><div class="call-name">${esc(u.name)}</div><div class="call-status">${esc(msg)}</div></div>`;
  endTimer=setTimeout(()=>{if(!call){o.classList.remove('show');o.innerHTML='';}},2600);
}

  openModal('Категории: '+c.name,`
    <div id="catChecks" style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
      ${cats.map(cat=>`<label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer"><input type="checkbox" value="${esc(cat)}" ${(c.categories||[]).includes(cat)?'checked':''}> ${esc(cat)}</label>`).join('')||'<span style="color:var(--muted)">Сначала добавьте категории во вкладке «Категории»</span>'}
    </div>
    <div class="modal-actions"><button class="btn-ghost" id="ccCancel">Отмена</button><button class="btn-primary" id="ccSave">Применить</button></div>`,()=>{
    $('ccCancel').onclick=closeModal;
    $('ccSave').onclick=async()=>{
      const v=[...document.querySelectorAll('#catChecks input:checked')].map(i=>i.value);
      try{await set(ref(db,`communities/${c.id}/admin/categories`),v.length?v:null);closeModal();toast('Категории обновлены');}catch(e){toast('Ошибка: '+e.message);}
    };
  });
}

/* ===================== RAIL ===================== */
function renderRail(){
  if(S.page==='search'){railEl.innerHTML='';return;}
  const people=usersList().filter(u=>!isFollowing(u.uid)&&!u.banned&&u.uid!==S.uid).slice(0,3);
  const comms=visibleComms().slice(0,4);
  const tags={};
  Object.values(S.posts).forEach(p=>(String(p.text||'').match(/#([a-zA-Zа-яА-Я0-9_]+)/g)||[]).forEach(t=>{tags[t]=(tags[t]||0)+1;}));
  const trends=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,4);
  railEl.innerHTML=`
    ${people.length?`<div class="rail-card"><h2>Кого читать</h2>${people.map(u=>`<div class="rail-user" data-goto="${u.uid}">${renderAvatar(u,'sm')}
      <div class="rail-user-info"><div class="name">${esc(u.name)} ${verifyBadgeHTML(u.uid)}</div><div class="handle">@${esc(u.handle)}</div></div>
      <button class="btn-follow" data-follow="${u.uid}">Читать</button></div>`).join('')}</div>`:''}
    <div class="rail-card"><h2>Сообщества</h2><div class="comm-list">
      ${comms.map(c=>`<div class="comm-card" data-community="${c.id}" style="padding:8px">${renderCommIcon(c,38)}<div class="comm-info"><div class="cname" style="font-size:14px">${esc(c.name)} ${c.verified?`<span class="badge-verified">${CHECK_SVG}</span>`:''}</div><div class="cmeta">${fmtNum(c.members)}</div></div></div>`).join('')||'<div style="color:var(--muted);font-size:14px">Пока нет</div>'}
    </div><button class="btn-outline" id="railNewComm" style="width:100%;margin-top:10px;justify-content:center">${IC.plus} Создать сообщество</button></div>
    ${trends.length?`<div class="rail-card"><h2>Тренды</h2>${trends.map(([t,n])=>`<div class="trend-item" data-tag="${esc(t)}"><div class="trend-label">Тренд</div><div class="trend-name">${esc(t)}</div><div class="trend-count">${n} ${n===1?'пост':'п.'}</div></div>`).join('')}</div>`:''}`;
  railEl.querySelectorAll('[data-follow]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFollow(b.dataset.follow);});
  railEl.querySelectorAll('[data-community]').forEach(el=>el.onclick=()=>navigate('community',el.dataset.community));
  railEl.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{S.searchQuery=el.dataset.tag;navigate('search');});
  const rn=$('railNewComm');if(rn)rn.onclick=openCreateCommunity;
}

/* ===================== МОДАЛКА ===================== */
const backdrop=$('modalBackdrop'),modalInner=$('modalInner');
function openModal(title,body,onMount,flush){
  modalInner.innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2><button class="modal-close" id="modalCloseBtn">×</button></div><div class="modal-body ${flush?'flush':''}">${body}</div>`;
  backdrop.classList.add('show');$('modalCloseBtn').onclick=closeModal;
  if(onMount)setTimeout(onMount,0);
}
function closeModal(){backdrop.classList.remove('show');modalInner.innerHTML='';S.openPost=null;}
backdrop.onclick=e=>{if(e.target===backdrop)closeModal();};
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if($('lightbox').classList.contains('show'))$('lightbox').classList.remove('show');
  else if(sv)closeStories();
  else if(backdrop.classList.contains('show'))closeModal();
  else if($('messenger').classList.contains('show'))closeMessenger();
});
window.addEventListener('beforeunload',()=>{if(call){try{update(ref(db,'calls/'+call.id),{state:'ended'});}catch(e){}}});

showAuth('login');
</script>
</body>
</html>
