<script>
/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyCsU2eJ2aF5oj4uWFbyy0Ez0mekT_At4vU",
  authDomain: "sava-online.firebaseapp.com",
  databaseURL: "https://sava-online-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sava-online",
  storageBucket: "sava-online.firebasestorage.app",
  messagingSenderId: "997547069745",
  appId: "1:997547069745:web:821a8fa505cf14670ee010",
  measurementId: "G-S3X80BM74X"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* =========================================================
   APP STATE
========================================================= */

const state = {
  authMode: "login",
  page: "home",
  network: localStorage.getItem("savcompay_network") || "testnet",
  asset: "TON",
  user: null,
  profile: null,

  tonLib: null,
  cryptoLib: null,

  client: null,
  wallet: null,
  keyPair: null,
  mnemonic: null,

  tonBalance: 0n,
  usdtBalance: 0n,

  walletReady: false,
  pinUnlocked: false
};

const USDT_MAINNET =
  "EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs";

const TESTNET_USDT = "";

/* =========================================================
   DOM HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function showError(message){
  const box = $("errorBox");
  box.textContent = message;
  box.classList.remove("hidden");

  setTimeout(() => {
    box.classList.add("hidden");
  }, 6000);
}

function closeModal(){
  $("modalBg").classList.remove("show");
  $("modal").innerHTML = "";
}

function openModal(html){
  $("modal").innerHTML = html;
  $("modalBg").classList.add("show");
}

$("modalBg").addEventListener("click", e=>{
  if(e.target === $("modalBg")) closeModal();
});

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function shortAddress(address){
  if(!address) return "—";
  return address.slice(0,9) + "…" + address.slice(-8);
}

function formatTon(nano){
  try{
    const n = BigInt(nano || 0);
    const whole = n / 1000000000n;
    const frac = (n % 1000000000n).toString().padStart(9,"0").replace(/0+$/,"");
    return frac ? `${whole}.${frac}` : `${whole}`;
  }catch{
    return "0";
  }
}

function formatUsdt(raw){
  try{
    const n = BigInt(raw || 0);
    const whole = n / 1000000n;
    const frac = (n % 1000000n).toString().padStart(6,"0").replace(/0+$/,"");
    return frac ? `${whole}.${frac}` : `${whole}`;
  }catch{
    return "0";
  }
}

function parseDecimal(value, decimals){
  value = String(value).trim().replace(",", ".");

  if(!/^\d+(\.\d+)?$/.test(value)){
    throw new Error("Неверная сумма");
  }

  const [a,b=""] = value.split(".");
  if(b.length > decimals){
    throw new Error(`Максимум ${decimals} знаков после запятой`);
  }

  return BigInt(a) * 10n ** BigInt(decimals)
    + BigInt((b + "0".repeat(decimals)).slice(0,decimals) || "0");
}

/* =========================================================
   AUTH
========================================================= */

$("loginTab").onclick = ()=>{
  state.authMode = "login";
  $("loginTab").classList.add("active");
  $("registerTab").classList.remove("active");
  $("authButton").textContent = "Войти";
  $("authMessage").textContent = "";
};

$("registerTab").onclick = ()=>{
  state.authMode = "register";
  $("registerTab").classList.add("active");
  $("loginTab").classList.remove("active");
  $("authButton").textContent = "Создать аккаунт";
  $("authMessage").textContent = "";
};

$("authButton").onclick = async ()=>{
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password){
    $("authMessage").textContent = "Заполни email и пароль";
    return;
  }

  if(password.length < 6){
    $("authMessage").textContent = "Пароль должен быть минимум 6 символов";
    return;
  }

  $("authButton").disabled = true;
  $("authButton").textContent = "Загрузка…";

  try{

    if(state.authMode === "register"){

      const result = await auth.createUserWithEmailAndPassword(
        email,
        password
      );

      await result.user.sendEmailVerification();

      await db.ref("users/" + result.user.uid).set({
        email: email,
        createdAt: Date.now()
      });

      $("authMessage").textContent =
        "Аккаунт создан. Проверь почту и подтверди email.";

      await auth.signOut();

    }else{

      const result = await auth.signInWithEmailAndPassword(
        email,
        password
      );

      if(!result.user.emailVerified){
        await result.user.sendEmailVerification();

        $("authMessage").textContent =
          "Email ещё не подтверждён. Новая ссылка отправлена на почту.";

        await auth.signOut();
      }
    }

  }catch(error){
    console.error(error);

    $("authMessage").textContent =
      firebaseError(error);
  }

  $("authButton").disabled = false;
  $("authButton").textContent =
    state.authMode === "login"
      ? "Войти"
      : "Создать аккаунт";
};

function firebaseError(error){

  const code = error?.code || "";

  const map = {
    "auth/invalid-email":"Неверный email",
    "auth/user-not-found":"Пользователь не найден",
    "auth/wrong-password":"Неверный пароль",
    "auth/email-already-in-use":"Этот email уже зарегистрирован",
    "auth/weak-password":"Слишком слабый пароль",
    "auth/too-many-requests":"Слишком много попыток. Попробуй позже",
    "auth/network-request-failed":"Проблема с интернетом"
  };

  return map[code] || error.message || "Неизвестная ошибка";
}

auth.onAuthStateChanged(async user=>{

  if(!user){
    state.user = null;
    state.profile = null;
    $("authScreen").classList.remove("hidden");
    $("app").classList.add("hidden");
    return;
  }

  if(!user.emailVerified){
    await auth.signOut();
    return;
  }

  state.user = user;

  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  await loadProfile();
  render();

  try{
    await loadTonLibraries();
  }catch(error){
    console.error(error);
    showError("TON-библиотека не загрузилась. Проверь интернет и перезагрузи страницу.");
  }
});

/* =========================================================
   FIREBASE PROFILE
========================================================= */

async function loadProfile(){

  if(!state.user) return;

  const snap = await db.ref("users/" + state.user.uid).once("value");

  state.profile = snap.val() || {
    email: state.user.email
  };
}

/* =========================================================
   TON LIBRARIES
========================================================= */

async function loadTonLibraries(){

  if(state.tonLib && state.cryptoLib){
    return;
  }

  /*
    Один bundled ESM-импорт.
    Это сделано специально, чтобы браузер не пытался
    самостоятельно разрешать десятки npm-зависимостей.
  */

  const tonPromise = import(
    "https://esm.sh/@ton/ton@16.3.0?bundle&target=es2022"
  );

  const cryptoPromise = import(
    "https://esm.sh/@ton/crypto@3.3.0?bundle&target=es2022"
  );

  const [ton, crypto] = await Promise.all([
    tonPromise,
    cryptoPromise
  ]);

  state.tonLib = ton;
  state.cryptoLib = crypto;

  console.log("TON libraries loaded");
}

/* =========================================================
   NETWORK
========================================================= */

function networkName(){
  return state.network === "mainnet"
    ? "TON Mainnet"
    : "TON Testnet";
}

function endpoint(){
  return state.network === "mainnet"
    ? "https://toncenter.com/api/v2/jsonRPC"
    : "https://testnet.toncenter.com/api/v2/jsonRPC";
}

function usdtMaster(){
  return state.network === "mainnet"
    ? USDT_MAINNET
    : TESTNET_USDT;
}

function setNetwork(network){

  state.network = network;

  localStorage.setItem(
    "savcompay_network",
    network
  );

  state.client = null;
  state.wallet = null;
  state.keyPair = null;
  state.mnemonic = null;
  state.walletReady = false;
  state.pinUnlocked = false;
  state.tonBalance = 0n;
  state.usdtBalance = 0n;

  render();
}

/* =========================================================
   PIN / ENCRYPTION
========================================================= */

async function deriveKey(pin, salt){

  const enc = new TextEncoder();

  const base = await crypto.subtle.importKey(
    "raw",
    enc.encode(pin),
    "PBKDF2",
    false,
    ["deriveKey"]
  );

  return crypto.subtle.deriveKey(
    {
      name:"PBKDF2",
      salt,
      iterations:250000,
      hash:"SHA-256"
    },
    base,
    {
      name:"AES-GCM",
      length:256
    },
    false,
    ["encrypt","decrypt"]
  );
}

function bytesToBase64(bytes){
  let binary = "";
  bytes.forEach(b=>binary += String.fromCharCode(b));
  return btoa(binary);
}

function base64ToBytes(str){
  const binary = atob(str);
  const arr = new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){
    arr[i] = binary.charCodeAt(i);
  }

  return arr;
}

async function encryptMnemonic(mnemonic,pin){

  const salt = crypto.getRandomValues(
    new Uint8Array(16)
  );

  const iv = crypto.getRandomValues(
    new Uint8Array(12)
  );

  const key = await deriveKey(pin,salt);

  const encrypted = await crypto.subtle.encrypt(
    {name:"AES-GCM",iv},
    key,
    new TextEncoder().encode(mnemonic.join(" "))
  );

  return {
    salt: bytesToBase64(salt),
    iv: bytesToBase64(iv),
    data: bytesToBase64(new Uint8Array(encrypted))
  };
}

async function decryptMnemonic(data,pin){

  const salt = base64ToBytes(data.salt);
  const iv = base64ToBytes(data.iv);
  const encrypted = base64ToBytes(data.data);

  const key = await deriveKey(pin,salt);

  const result = await crypto.subtle.decrypt(
    {name:"AES-GCM",iv},
    key,
    encrypted
  );

  return new TextDecoder().decode(result);
}

function walletStorageKey(){

  return `savcompay_wallet_${state.user.uid}_${state.network}`;
}

function pinStorageKey(){

  return `savcompay_pin_${state.user.uid}_${state.network}`;
}

/* =========================================================
   CREATE / LOAD TON WALLET
========================================================= */

async function createWalletWithPin(pin){

  await loadTonLibraries();

  const { mnemonicNew, mnemonicToPrivateKey } =
    state.cryptoLib;

  const mnemonic = await mnemonicNew();

  const encrypted = await encryptMnemonic(
    mnemonic,
    pin
  );

  localStorage.setItem(
    walletStorageKey(),
    JSON.stringify(encrypted)
  );

  localStorage.setItem(
    pinStorageKey(),
    "1"
  );

  await unlockWallet(pin);

  openSeedModal(mnemonic);

  return mnemonic;
}

async function unlockWallet(pin){

  await loadTonLibraries();

  const stored = localStorage.getItem(
    walletStorageKey()
  );

  if(!stored){
    return false;
  }

  let walletData;

  try{
    walletData = JSON.parse(stored);
  }catch{
    throw new Error("Повреждены данные локального кошелька");
  }

  const phrase = await decryptMnemonic(
    walletData,
    pin
  );

  const mnemonic = phrase.trim().split(/\s+/);

  const keyPair =
    await state.cryptoLib.mnemonicToPrivateKey(
      mnemonic
    );

  const WalletContractV5R1 =
    state.tonLib.WalletContractV5R1;

  const wallet =
    WalletContractV5R1.create({
      walletId:{
        networkGlobalId:
          state.network === "mainnet"
            ? -239
            : -3
      },
      publicKey:keyPair.publicKey,
      workchain:0
    });

  state.mnemonic = mnemonic;
  state.keyPair = keyPair;
  state.wallet = wallet;

  state.client = new state.tonLib.TonClient({
    endpoint:endpoint()
  });

  state.walletReady = true;
  state.pinUnlocked = true;

  await refreshBalances();

  return true;
}

async function refreshUsdt(){

  state.usdtBalance = 0n;

  const masterAddress = usdtMaster();

  /*
    На TON Testnet официальный Mainnet USDT
    специально НЕ подставляем.
  */

  }

  try{

    const { Address } = state.tonLib;

      state.tonLib.JettonMaster;

      state.tonLib.JettonWallet;

async function sendTon(){

  if(!state.walletReady){
    openPinModal();
    return;
  }

  openModal(`
    <h2>📤 Отправить TON</h2>

    <input
      id="tonRecipient"
      class="input"
      placeholder="TON-адрес получателя"
    >

    <input
      id="tonAmount"
      class="input"
      inputmode="decimal"
      placeholder="Сумма TON"
    >

    <input
      id="tonComment"
      class="input"
      placeholder="Комментарий (необязательно)"
    >

    <div class="notice">
      Сеть: <b>${networkName()}</b><br>
      Проверь адрес и сумму перед отправкой.
    </div>

    <button id="sendTonConfirm" class="primary">
      Отправить TON
    </button>
  `);

  $("sendTonConfirm").onclick = async ()=>{

    try{

      const recipient =
        $("tonRecipient").value.trim();

      const amount =
        $("tonAmount").value.trim();

      const comment =
        $("tonComment").value.trim();

      if(!recipient){
        throw new Error("Введи адрес получателя");
      }

      const { Address, SendMode, internal } =
        state.tonLib;

      Address.parse(recipient);

      const amountNano =
        parseDecimal(amount,9);

      if(amountNano <= 0n){
        throw new Error("Сумма должна быть больше 0");
      }

      if(amountNano >= state.tonBalance){
        throw new Error(
          "Недостаточно TON с учётом комиссии"
        );
      }

      const opened =
        state.client.open(state.wallet);

      const seqno =
        await opened.getSeqno();

      const message =
        internal({
          to: recipient,
          value: amount,
          bounce:false,
          body:comment || undefined
        });

      await opened.sendTransfer({
        seqno,
        secretKey:state.keyPair.secretKey,
        messages:[message],
        sendMode:SendMode.PAY_GAS_SEPARATELY
      });

      closeModal();

      showSuccess(
        "TON отправлен. Обновляем баланс…"
      );

      await waitForSeqnoChange(seqno);

      await refreshBalances();

    }catch(error){

      console.error(error);

      showError(
        error.message || "Ошибка отправки TON"
      );
    }
  };
}

async function waitForSeqnoChange(oldSeqno){

  for(let i=0;i<20;i++){

    await new Promise(
      r=>setTimeout(r,1500)
    );

    try{

      const opened =
        state.client.open(state.wallet);

      const now =
        await opened.getSeqno();

      if(now !== oldSeqno){
        return true;
      }

    }catch{}
  }

  return false;
}

async function sendUsdt(){

  if(state.network !== "mainnet"){

    openModal(`
      <h2>USDT</h2>

        <b>TON Testnet</b>.

    `);

    $("goMainnet").onclick = ()=>{
      closeModal();
      setNetwork("mainnet");
      openPinModal();
    };

    $("closeUsdt").onclick = closeModal;

    return;
  }

  if(!state.walletReady){
    openPinModal();
    return;
  }

  if(state.usdtBalance <= 0n){

    showError(
      "На этом кошельке пока нет USDT"
    );

    return;
  }

  openModal(`
    <h2>💵 Отправить USDT</h2>

    <input
      id="usdtRecipient"
      class="input"
      placeholder="TON-адрес получателя"
    >

    <input
      id="usdtAmount"
      class="input"
      inputmode="decimal"
      placeholder="Сумма USDT"
    >

    <input
      id="usdtComment"
      class="input"
      placeholder="Комментарий"
    >

    <div class="notice">
      Для отправки USDT нужна небольшая сумма TON
      на оплату комиссии сети.
    </div>

    <button id="sendUsdtConfirm" class="primary">
      Отправить USDT
    </button>
  `);

  $("sendUsdtConfirm").onclick =
    async ()=>{

      try{

        const recipient =
          $("usdtRecipient").value.trim();

        const amount =
          $("usdtAmount").value.trim();

        const comment =
          $("usdtComment").value.trim();

        const {
          Address,
          beginCell,
          internal,
          SendMode
        } = state.tonLib;

        if(!recipient){
          throw new Error(
            "Введи адрес получателя"
          );
        }

        Address.parse(recipient);

        const jettonAmount =
          parseDecimal(amount,6);

        if(jettonAmount <= 0n){
          throw new Error(
            "Сумма должна быть больше 0"
          );
        }

        if(jettonAmount > state.usdtBalance){
          throw new Error(
            "Недостаточно USDT"
          );
        }

        /*
          Находим Jetton Wallet нашего аккаунта.
        */

        const JettonMaster =
          state.tonLib.JettonMaster;

        if(!JettonMaster){
          throw new Error(
            "Jetton API недоступен в загруженной TON-библиотеке"
          );
        }

        const master =
          state.client.open(
            JettonMaster.create(
              Address.parse(USDT_MAINNET)
            )
          );

        const jettonWalletAddress =
          await master.getWalletAddress(
            state.wallet.address
          );

        /*
          TEP-74 transfer:
          0x0f8a7ea5
        */

        const forwardPayload =
          beginCell()
            .storeUint(0,32)
            .storeStringTail(comment || "")
            .endCell();

        const body =
          beginCell()
            .storeUint(0x0f8a7ea5,32)
            .storeUint(
              BigInt(Date.now()),
              64
            )
            .storeCoins(jettonAmount)
            .storeAddress(
              Address.parse(recipient)
            )
            .storeAddress(
              state.wallet.address
            )
            .storeBit(0)
            .storeCoins(
              10000000n
            )
            .storeBit(1)
            .storeRef(forwardPayload)
            .endCell();

        const opened =
          state.client.open(state.wallet);

        const seqno =
          await opened.getSeqno();

        /*
          0.05 TON прикладывается к Jetton transfer
          для покрытия газа/forward.
        */

        const message =
          internal({
            to:jettonWalletAddress,
            value:"0.05",
            bounce:true,
            body
          });

        await opened.sendTransfer({
          seqno,
          secretKey:state.keyPair.secretKey,
          messages:[message],
          sendMode:SendMode.PAY_GAS_SEPARATELY
        });

        closeModal();

        showSuccess(
          "USDT отправляется. Проверяем транзакцию…"
        );

        await waitForSeqnoChange(seqno);

        await refreshBalances();

      }catch(error){

        console.error(error);

        showError(
          error.message || "Ошибка отправки USDT"
        );
      }
    };
}

/* =========================================================
   HISTORY LOAD
========================================================= */

async function loadHistory(){

  if(!state.walletReady){
    openPinModal();
    return;
  }

  try{

    const address =
      state.wallet.address.toString({
        bounceable:false,
        urlSafe:true
      });

    const base =
      state.network === "mainnet"
        ? "https://toncenter.com"
        : "https://testnet.toncenter.com";

    const url =
      base +
      "/api/v3/transactions?account=" +
      encodeURIComponent(address) +
      "&limit=15";

    const response =
      await fetch(url);

    if(!response.ok){
      throw new Error("History API error");
    }

    const data =
      await response.json();

    const list =
      Array.isArray(data)
        ? data
        : data.transactions || [];

    const container =
      $("historyList");

    if(!container) return;

    if(!list.length){

      container.innerHTML = `
        <div class="small center" style="margin-top:20px">
          Операций пока нет.
        </div>
      `;

      return;
    }

    container.innerHTML =
      list.map(tx=>{

        const hash =
          tx.hash ||
          tx.transaction_id?.hash ||
          "";

        const time =
          tx.now
            ? new Date(tx.now*1000).toLocaleString("ru-RU")
            : "";

        return `
          <div class="history-item">

            <div class="row">

              <div class="row" style="justify-content:flex-start">

                <div class="history-icon">
                  ↕
                </div>

                <div>

                  <div style="font-weight:850">
                    Транзакция
                  </div>

                  <div class="small">
                    ${escapeHtml(time)}
                  </div>

                </div>

              </div>

              <div class="small">
                ${hash
                  ? escapeHtml(hash.slice(0,8))+"…"
                  : "—"
                }
              </div>

            </div>

          </div>
        `;

      }).join("");

  }catch(error){

    console.error(error);

    showError(
      "Не удалось загрузить историю"
    );
  }
}

/* =========================================================
   IMPORT
========================================================= */

function importWallet(){

  openModal(`
    <h2>📥 Импорт кошелька</h2>

    <div class="notice">
      Вводи seed-фразу только если понимаешь,
      что делаешь. Не отправляй её никому.
    </div>

    <textarea
      id="importSeed"
      class="input"
      rows="5"
      placeholder="12 или 24 слова seed-фразы"
      style="resize:none"
    ></textarea>

    <input
      id="importPin"
      class="input"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="Новый PIN — 6 цифр"
    >

    <button id="importConfirm" class="primary">
      Импортировать
    </button>
  `);

  $("importConfirm").onclick =
    async ()=>{

      try{

        const phrase =
          $("importSeed").value
            .trim()
            .split(/\s+/);

        const pin =
          $("importPin").value.trim();

        if(phrase.length !== 12 &&
           phrase.length !== 24){

          throw new Error(
            "Seed-фраза должна содержать 12 или 24 слова"
          );
        }

        if(!/^\d{6}$/.test(pin)){
          throw new Error(
            "PIN должен состоять из 6 цифр"
          );
        }

        await loadTonLibraries();

        await state.cryptoLib
          .mnemonicToPrivateKey(phrase);

        const encrypted =
          await encryptMnemonic(
            phrase,
            pin
          );

        localStorage.setItem(
          walletStorageKey(),
          JSON.stringify(encrypted)
        );

        localStorage.setItem(
          pinStorageKey(),
          "1"
        );

        await unlockWallet(pin);

        closeModal();

        showSuccess(
          "Кошелёк успешно импортирован"
        );

        render();

      }catch(error){

        showError(
          error.message ||
          "Не удалось импортировать кошелёк"
        );
      }
    };
}
