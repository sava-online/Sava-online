<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форум любителей Савелия</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #dbe2ed; color: #222222; font-size: 13px; padding-bottom: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #e5ebf2; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); min-height: 100vh; }
        .header { background: linear-gradient(to bottom, #728bb0, #536f96); color: #ffffff; padding: 12px; border-bottom: 2px solid #364e70; text-align: center; }
        .logo-title { font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.4); }
        .logo-subtitle { font-size: 11px; color: #e0e6ed; margin-top: 4px; }
        
        details.main-menu { background: #d8e0ec; border-bottom: 1px solid #b3c0d2; display: block; }
        details.main-menu summary { padding: 10px 12px; font-weight: bold; color: #2b3e55; cursor: pointer; list-style: none; background: #f0f3f8; border-bottom: 1px solid #c2cede; display: flex; align-items: center; gap: 8px; }
        details.main-menu summary::-webkit-details-marker { display: none; }
        .menu-list { list-style: none; background: #ffffff; }
        .menu-list li { border-bottom: 1px solid #e1e7f0; }
        .menu-list a, .menu-list button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: #1a4f8b; text-decoration: none; font-weight: bold; font-size: 13px; background: none; border: none; width: 100%; text-align: left; cursor: pointer; }
        .menu-svg { width: 18px; height: 18px; fill: #536f96; }
        
        .breadcrumb { background: #ffffff; border: 1px solid #c2cede; margin: 8px; padding: 8px; color: #334e73; font-size: 11px; font-weight: bold; border-radius: 2px; }
        
        .category { margin: 8px; border: 1px solid #8ba0bd; background: #ffffff; border-radius: 2px; overflow: hidden; }
        .category-header { background: linear-gradient(to bottom, #728bb0, #536f96); color: #ffffff; font-weight: bold; font-size: 12px; padding: 8px 10px; text-transform: uppercase; display: flex; justify-content: space-between; }
        
        .forum-item { padding: 10px; border-bottom: 1px solid #e1e7f0; display: flex; gap: 12px; align-items: flex-start; }
        .forum-item:last-child { border-bottom: none; }
        .forum-svg-icon { width: 36px; height: 36px; flex-shrink: 0; background: #f0f3f8; padding: 6px; border-radius: 50%; border: 1px solid #dbe2ed; }
        .forum-details { flex-grow: 1; overflow: hidden; }
        .forum-title { color: #1a4f8b; font-weight: bold; font-size: 14px; text-decoration: none; display: inline-block; margin-bottom: 4px; word-break: break-word; }
        .forum-desc { color: #222; font-size: 12px; line-height: 1.4; word-break: break-word; margin-bottom: 5px; }
        .forum-desc img { max-width: 100%; max-height: 200px; border-radius: 4px; margin-top: 5px; display: block; }
        .forum-meta { background: #f4f6f9; border: 1px dashed #d0d7e0; padding: 6px; font-size: 10px; color: #666666; border-radius: 2px; }
        
        .post-box { padding: 10px; background: #f8fafc; }
        .post-textarea { width: 100%; height: 60px; border: 1px solid #b2c1d4; padding: 8px; font-size: 12px; margin-bottom: 8px; resize: vertical; border-radius: 2px; outline: none; }
        .post-controls { display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #3b5b8c; color: #ffffff; border: 1px solid #2a4369; padding: 8px 12px; font-size: 12px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border-radius: 2px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-light { background: #eef3f8; color: #2b3e55; border: 1px solid #a8b8cc; }
        
        /* Авторизация */
        .auth-box { padding: 15px; display: none; }
        .auth-input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #b2c1d4; font-size: 13px; }
        .auth-error { color: #d32f2f; font-size: 11px; margin-bottom: 10px; display: none; }

        .footer { text-align: center; padding: 15px 10px; color: #667788; font-size: 10px; border-top: 1px solid #dbe2ed; margin-top: 10px; }
        
        #loadingMsg { font-size: 11px; color: #1a4f8b; font-weight: bold; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="logo-title">Форум любителей Савелия</div>
        <div class="logo-subtitle">Сообщество для простого общения</div>
    </header>

    <main>
        <!-- Выпадающее меню -->
        <details class="main-menu" id="mainMenu">
            <summary>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#2b3e55"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                Главное меню (нажми)
            </summary>
            <ul class="menu-list">
                <li id="menuAuthBtn">
                    <button onclick="toggleAuth()">
                        <svg class="menu-svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        Войти / Регистрация
                    </button>
                </li>
                <li id="menuLogoutBtn" class="hidden">
                    <button onclick="logout()">
                        <svg class="menu-svg" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        Выйти из аккаунта
                    </button>
                </li>
            </ul>
        </details>

        <!-- Блок Авторизации / Регистрации -->
        <section class="category auth-box" id="authSection">
            <header class="category-header">Вход в систему</header>
            <div style="padding: 10px;">
                <div id="authError" class="auth-error">Ошибка</div>
                <input type="email" id="emailInput" class="auth-input" placeholder="Email">
                <input type="password" id="passwordInput" class="auth-input" placeholder="Пароль">
                <div style="display: flex; gap: 10px;">
                    <button class="btn" onclick="login()">Войти</button>
                    <button class="btn btn-light" onclick="register()">Регистрация</button>
                </div>
            </div>
        </section>

        <nav class="breadcrumb" id="userStatus">Вы вошли как: Гость</nav>

        <!-- Лента сообщений -->
        <section class="category">
            <header class="category-header">
                Главная беседа
                <span id="syncStatus" style="font-size:10px; font-weight:normal;">Синхронизация...</span>
            </header>
            <div id="postsContainer">
                <!-- Сообщения будут появляться здесь -->
            </div>
        </section>

        <!-- Быстрое сообщение -->
        <section class="category" id="postSection" style="display: none;">
            <header class="category-header">Написать сообщение</header>
            <div class="post-box">
                <textarea id="messageInput" class="post-textarea" placeholder="Напишите сообщение..."></textarea>
                
                <!-- Скрытый инпут для картинки -->
                <input type="file" id="imageInput" accept="image/*" class="hidden">
                
                <div class="post-controls">
                    <button class="btn btn-light" id="imgBtn" onclick="document.getElementById('imageInput').click()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="#2b3e55"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                        Фото
                    </button>
                    <span id="loadingMsg">Отправка...</span>
                    <button class="btn" id="sendBtn" onclick="sendMessage()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="#ffffff"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        Отправить
                    </button>
                </div>
                <div id="selectedFileName" style="font-size:10px; color:#536f96; margin-top:5px;"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        Форум любителей Савелия © 2026<br>
        Оптимизированная версия для старых телефонов и 3G
    </footer>
</div>

<!-- ПОДКЛЮЧЕНИЕ FIREBASE (Версия 9, модульная через CDN для работы прямо в браузере) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 1. Конфигурация Firebase (Из вашего запроса)
    const firebaseConfig = {
        apiKey: "AIzaSyCsU2eJ2aF5oj4uWFbyy0Ez0mekT_At4vU",
        authDomain: "sava-online.firebaseapp.com",
        databaseURL: "https://sava-online-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "sava-online",
        storageBucket: "sava-online.firebasestorage.app",
        messagingSenderId: "997547069745",
        appId: "1:997547069745:web:821a8fa505cf14670ee010"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    
    // Ключ ImgBB (Из вашего запроса)
    const IMGBB_KEY = "fa3d56b9fb97bfbbe162c367ace448d1";

    let currentUser = null;

    // --- АВТОРИЗАЦИЯ И ИНТЕРФЕЙС ---
    
    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        const authSection = document.getElementById('authSection');
        const postSection = document.getElementById('postSection');
        const userStatus = document.getElementById('userStatus');
        
        if (user) {
            authSection.style.display = 'none';
            postSection.style.display = 'block';
            document.getElementById('menuAuthBtn').classList.add('hidden');
            document.getElementById('menuLogoutBtn').classList.remove('hidden');
            userStatus.innerHTML = `Вы вошли как: <b>${user.email.split('@')[0]}</b>`;
        } else {
            postSection.style.display = 'none';
            document.getElementById('menuAuthBtn').classList.remove('hidden');
            document.getElementById('menuLogoutBtn').classList.add('hidden');
            userStatus.innerHTML = `Вы вошли как: <b>Гость</b> (Только чтение)`;
        }
    });

    window.toggleAuth = () => {
        const authSec = document.getElementById('authSection');
        authSec.style.display = authSec.style.display === 'block' ? 'none' : 'block';
        document.getElementById('mainMenu').removeAttribute('open');
    };

    window.register = () => {
        const email = document.getElementById('emailInput').value;
        const pass = document.getElementById('passwordInput').value;
        createUserWithEmailAndPassword(auth, email, pass).catch(showError);
    };

    window.login = () => {
        const email = document.getElementById('emailInput').value;
        const pass = document.getElementById('passwordInput').value;
        signInWithEmailAndPassword(auth, email, pass).catch(showError);
    };

    window.logout = () => {
        signOut(auth);
        document.getElementById('mainMenu').removeAttribute('open');
    };

    function showError(error) {
        const errDiv = document.getElementById('authError');
        errDiv.style.display = 'block';
        if (error.code === 'auth/email-already-in-use') errDiv.innerText = 'Этот Email уже зарегистрирован!';
        else if (error.code === 'auth/weak-password') errDiv.innerText = 'Пароль слишком простой (минимум 6 символов).';
        else errDiv.innerText = 'Ошибка: Проверьте данные.';
    }

    // --- ОТОБРАЖЕНИЕ СООБЩЕНИЙ В РЕАЛЬНОМ ВРЕМЕНИ ---
    
    const postsRef = ref(db, 'posts');
    onValue(postsRef, (snapshot) => {
        document.getElementById('syncStatus').innerText = 'Онлайн';
        const postsContainer = document.getElementById('postsContainer');
        postsContainer.innerHTML = ''; 
        
        const data = snapshot.val();
        if (!data) {
            postsContainer.innerHTML = '<div style="padding:10px; font-size:11px;">Нет сообщений. Будьте первым!</div>';
            return;
        }

        // Превращаем в массив и сортируем от старых к новым
        const posts = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);

        posts.forEach(post => {
            const date = new Date(post.timestamp || Date.now());
            const timeStr = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const dateStr = date.toLocaleDateString();
            
            // Если есть картинка, создаем тег img
            const imgHtml = post.imageUrl ? `<img src="${post.imageUrl}" alt="Картинка" loading="lazy">` : '';

            postsContainer.innerHTML += `
                <div class="forum-item">
                    <svg class="forum-svg-icon" viewBox="0 0 24 24" fill="#3b5b8c">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <div class="forum-details">
                        <div class="forum-title">${post.author}</div>
                        <div class="forum-desc">
                            ${post.text.replace(/\n/g, '<br>')}
                            ${imgHtml}
                        </div>
                        <div class="forum-meta">Опубликовано: ${dateStr} в ${timeStr}</div>
                    </div>
                </div>
            `;
        });
        
        // Прокрутка вниз к новым сообщениям
        postsContainer.scrollTop = postsContainer.scrollHeight;
    });

    // --- ОТПРАВКА СООБЩЕНИЯ И ЗАГРУЗКА КАРТИНКИ ---
    
    const imageInput = document.getElementById('imageInput');
    const fileNameDisplay = document.getElementById('selectedFileName');

    // Показываем имя файла при выборе
    imageInput.addEventListener('change', () => {
        if (imageInput.files.length > 0) {
            fileNameDisplay.innerText = "Выбрано: " + imageInput.files[0].name;
        } else {
            fileNameDisplay.innerText = "";
        }
    });

    window.sendMessage = async () => {
        if (!currentUser) return;
        
        const text = document.getElementById('messageInput').value.trim();
        const file = imageInput.files[0];

        if (!text && !file) return; // Пустое сообщение

        const btn = document.getElementById('sendBtn');
        const loader = document.getElementById('loadingMsg');
        
        // Блокируем кнопку на время отправки (важно для 3G)
        btn.disabled = true;
        loader.style.display = 'inline-block';

        let imageUrl = null;

        try {
            // Если есть картинка, грузим на ImgBB
            if (file) {
                loader.innerText = 'Загрузка фото...';
                const formData = new FormData();
                formData.append('image', file);
                
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    imageUrl = data.data.url;
                }
            }

            loader.innerText = 'Отправка...';
            
            // Сохраняем в Firebase RTDB
            await push(ref(db, 'posts'), {
                text: text,
                imageUrl: imageUrl,
                author: currentUser.email.split('@')[0], // Имя до @
                timestamp: serverTimestamp()
            });

            // Очищаем форму
            document.getElementById('messageInput').value = '';
            imageInput.value = '';
            fileNameDisplay.innerText = '';

        } catch (error) {
            alert("Ошибка при отправке: " + error.message);
        } finally {
            // Возвращаем интерфейс в норму
            btn.disabled = false;
            loader.style.display = 'none';
        }
    };
</script>

</body>
</html>
